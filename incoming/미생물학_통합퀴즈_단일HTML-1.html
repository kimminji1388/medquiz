<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미생물학 통합 퀴즈</title>
<style>
:root{
  --bg:#ffffff; --ink:#16202a; --soft:#5b6b7a; --line:#e7ecf1;
  --card:#ffffff; --shadow:0 1px 2px rgba(20,32,42,.04),0 8px 24px rgba(20,32,42,.05);
  --accent:#0f7b6c; --accent-soft:#e6f4f1; --accent-ink:#0a5a4e;
  --ok:#1f9d62; --ok-bg:#e8f7ef; --ok-bd:#bfe8d2;
  --no:#d8455f; --no-bg:#fdecef; --no-bd:#f6c5cf;
  --warn:#c98a00; --warn-bg:#fff7e6;
  --chip:#f1f5f8; --chip-ink:#43566a;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -200px, #f4faf8 0%, rgba(244,250,248,0) 70%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  line-height:1.6;
}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 96px}
header.top{padding:20px 2px 8px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
h1{font-size:26px;line-height:1.2;margin:6px 0 2px;letter-spacing:-.01em}
h1 .thin{color:var(--soft);font-weight:500}
.sub{color:var(--soft);font-size:14px;margin-top:2px}

.stats{display:flex;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
.stat{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--soft);letter-spacing:.02em}
.stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}

.toolbar{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg),var(--bg) 70%,rgba(255,255,255,0));
  padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.secrow{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
.secrow::-webkit-scrollbar{display:none}
.segbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--chip-ink);
  padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:.15s;box-shadow:var(--shadow)}
.segbtn .c{color:var(--soft);font-weight:600;margin-left:5px}
.segbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.segbtn[aria-pressed="true"] .c{color:#d9f1ec}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.lnk{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--chip-ink);
  font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:10px;cursor:pointer;transition:.15s}
.lnk:hover{border-color:#cdd7df}
.lnk.danger{color:var(--no)}
.lnk.on{background:var(--accent-soft);border-color:#bfe2db;color:var(--accent-ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;
  margin:14px 0;box-shadow:var(--shadow);scroll-margin-top:120px}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.badge{font-size:11.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:var(--accent);
  padding:3px 9px;border-radius:7px}
.chip{font-size:11px;color:var(--chip-ink);background:var(--chip);border:1px solid var(--line);
  padding:3px 8px;border-radius:7px}
.chip.photo{color:var(--accent-ink);background:var(--accent-soft);border-color:#cde9e3}
.chip.sec{color:var(--soft)}
.src{font-size:11px;color:var(--soft);margin-left:auto}
.qimg{margin:6px 0 12px;text-align:center}
.qimg img{max-width:100%;width:auto;max-height:300px;border-radius:12px;border:1px solid var(--line);
  background:#fafcfe}
.qtext{font-size:15.5px;line-height:1.62;margin:2px 0 12px;font-weight:500;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid var(--line);background:#fcfdfe;border-radius:12px;padding:12px 13px;cursor:pointer;
  font-size:14.5px;line-height:1.5;color:var(--ink);transition:.12s;font-family:inherit}
.opt:hover{border-color:#cdd7df;background:#fff}
.opt .key{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--chip);color:var(--chip-ink);
  font-size:12.5px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.opt .txt{flex:1}
.opt[disabled]{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:#0c5b39}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{background:var(--no-bg);border-color:var(--no-bd);color:#8f2233}
.opt.wrong .key{background:var(--no);color:#fff}
.opt.muted{opacity:.6}

.qfoot{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.exp-toggle{appearance:none;border:1px solid var(--line);background:#fff;color:var(--accent-ink);
  font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;font-family:inherit}
.exp-toggle:hover{border-color:#bfe2db;background:var(--accent-soft)}
.result-tag{font-size:12.5px;font-weight:700}
.result-tag.ok{color:var(--ok)} .result-tag.no{color:var(--no)}
.exp{display:none;margin-top:11px;border-top:1px dashed var(--line);padding-top:11px}
.exp.show{display:block}
.exp .row{display:flex;gap:8px;margin:7px 0;font-size:13.5px;line-height:1.55}
.exp .lab{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:6px;
  height:fit-content;margin-top:1px}
.exp .lab.cue{background:#eef5ff;color:#2f5fa3}
.exp .lab.judge{background:var(--accent-soft);color:var(--accent-ink)}
.exp .lab.mem{background:var(--warn-bg);color:var(--warn)}
.exp .row .body{flex:1;color:#33424f}

.empty{text-align:center;color:var(--soft);padding:60px 20px;font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

footer.foot{text-align:center;color:#aab6c0;font-size:11.5px;padding:30px 0 10px}
@media (max-width:480px){
  h1{font-size:22px}
  .qtext{font-size:15px}
  .opt{font-size:14px}
  .stat b{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">Kosin Microbiology · 기출 통합</div>
    <h1>미생물학 통합 퀴즈 <span class="thin">세균 · 바이러스 각론</span></h1>
    <div class="sub">기출/족보 5개 시험지를 한 곳에. 선지를 누르면 바로 채점됩니다.</div>
  </header>

  <div class="stats">
    <div class="stat"><b id="st-shown">0</b><span>보이는 문제</span></div>
    <div class="stat ok"><b id="st-done">0</b><span>푼 문제</span></div>
    <div class="stat no"><b id="st-wrong">0</b><span>틀린 문제</span></div>
  </div>

  <nav class="toolbar">
    <div class="secrow"><button class="segbtn" data-view="all" aria-pressed="true">전체 <span class="c">221</span></button>
<button class="segbtn" data-view="1">01 세균 그람양성 <span class="c">40</span></button>
<button class="segbtn" data-view="2">02 세균 그람음성 <span class="c">40</span></button>
<button class="segbtn" data-view="3">03 세균 기타세균 <span class="c">40</span></button>
<button class="segbtn" data-view="4">04 바이러스 DNA·레트로·프리온 <span class="c">40</span></button>
<button class="segbtn" data-view="5">05 바이러스 RNA·간염 <span class="c">61</span></button>
<button class="segbtn" data-view="wrong">틀린 것만</button></div>
    <div class="actions">
      <button class="lnk" id="btn-wrong">틀린 것만 모아보기</button>
      <button class="lnk" id="btn-clearmark">틀림 표시만 초기화</button>
      <button class="lnk danger" id="btn-reset">풀이 기록 전체 삭제</button>
    </div>
  </nav>

  <main id="list"></main>

  <footer class="foot">고신의대 미생물학 · 사진은 해당 기출 문항에서 직접 추출 · 자동채점 · 시험 직전용 간결 해설</footer>
</div>
<script>
const DATA = [{"n": 0, "sec": 1, "id": "세균1 20-1", "src": "세균각론1 · 20번지", "q": "초등학생이 금요일부터 목이 아프기 시작했고 증상이 심해져 월요일 아침에 병원에 왔다. 진찰 시 열이 있었고 인두와 편도가 빨갛게 붓고 삼출물이 있었으며 목의 림프절도 부어 있었다. 또한 몸에 붉은 발진이 밤사이 생겼다고 하였다. 이 환자의 증상을 일으키는 균의 독성인자는?", "opts": ["M protein", "Lethal toxin", "Diphtheria toxin", "Pyrogenic exotoxin", "Toxic shock syndrome toxin"], "ans": 3, "hint": "인두염+편도 삼출+목 림프절+몸의 붉은 발진 = 성홍열(scarlet fever).", "why": "S. pyogenes의 lysogenic strain이 내는 pyrogenic exotoxin이 홍반성 발진(성홍열)을 일으킨다.", "mem": "성홍열=S.pyogenes pyrogenic exotoxin. M protein은 류마티스열·항포식(C3b blocking)과 관련.", "img": "", "tag": ""}, {"n": 1, "sec": 1, "id": "세균1 20-2", "src": "세균각론1 · 20번지", "q": "28세 남자가 오토바이 사고로 다리의 개방형 골절을 입었다. 골절 부위에 가스가 찬 물집이 보이고 검게 변하며 괴사가 시작되었다. 상처 주위에서 염증세포는 관찰되지 않았다. 이 현상과 관련이 있는 이 균의 독소는?", "opts": ["Enterotoxin", "Lethal toxin", "Alpha toxin", "Tetanospasmin", "Botulinum neurotoxin"], "ans": 2, "hint": "개방골절+가스 찬 물집+괴사+염증세포 없음 = 가스괴저(C. perfringens).", "why": "C. perfringens의 alpha toxin(lecithinase)이 가스괴저를 일으키며 괴사부에 염증세포가 보이지 않는 것이 특징.", "mem": "가스괴저=C.perfringens alpha toxin. Tetanospasmin=C.tetani, Botulinum=C.botulinum.", "img": "", "tag": ""}, {"n": 2, "sec": 1, "id": "세균1 20-3", "src": "세균각론1 · 20번지", "q": "백신 맞기를 거부하는 가족의 3세 아이가 목이 붓고 숨쉬기를 힘들어하여 응급실에 왔다. 인두에 삼출물과 회백색의 위막이 있었고, 삼출물에서 곤봉모양의 그람양성막대균을 확인할 수 있었다. 이 균의 독소의 발병기전은?", "opts": ["Superantigen", "세포막에 pore형성", "세포내 cAMP 증가 유도", "신경세포의 acetylcholine 억제", "EF-2를 불활성하여 단백 합성 억제"], "ans": 4, "hint": "회백색 위막(pseudomembrane)+곤봉모양 그람양성막대균 = 디프테리아.", "why": "C. diphtheriae의 Diphtheria toxin은 A subunit이 EF-2를 불활성화시켜 단백질 합성을 억제한다.", "mem": "디프테리아=위막+곤봉모양. Diphtheria toxin=EF-2 불활성화. Pseudomonas Exotoxin A도 같은 기전.", "img": "", "tag": ""}, {"n": 3, "sec": 1, "id": "세균1 20-4", "src": "세균각론1 · 20번지", "q": "70세 여자가 급성 폐렴으로 항생제를 1주일째 복용하던 중 갑자기 복통과 함께 녹색의 점액성 설사가 시작되어 병원에 왔다. 대장내시경으로 위막성 장염이 관찰되었다. 원인 균의 특성으로 맞지 않는 것은?", "opts": ["Endospore 형성", "Facultative anaerobe", "Metronidazole로 치료", "Vancomycin으로 치료", "Enterotoxin와 cytotoxin로 인한 증상"], "ans": 1, "hint": "항생제 복용 후 위막성 장염 = C. difficile.", "why": "Clostridium은 obligate anaerobe이다. Facultative anaerobe라는 설명이 틀렸다.", "mem": "C.difficile=위막성 장염. toxinA(염증)+toxinB(설사). 경증 metronidazole, 중증 vancomycin. 절대혐기성.", "img": "", "tag": ""}, {"n": 4, "sec": 1, "id": "세균1 20-5", "src": "세균각론1 · 20번지", "q": "야유회에 참가한 20대 7명이 복통과 설사 증상으로 오후 5시경에 병원에 왔다. 이들은 점심으로 샌드위치를 먹었다고 한다. 샌드위치에서 아포를 생성하지 않는 균을 확인하였다. 이 균의 특성으로 맞는 것은?", "opts": ["Catalase 음성", "신경독소 생산", "Coagulase 음성", "그람양성 막대균", "혈액우무배지에서 베타용혈"], "ans": 4, "hint": "섭취 후 ~4시간 빠른 발현+아포 비형성 = S. aureus 장독소 식중독.", "why": "S. aureus는 혈액우무배지에서 beta hemolysis를 보인다.", "mem": "포도알균 식중독=enterotoxin(heat-stable). S.aureus: catalase+, coagulase+(유일), 그람양성알균, beta용혈.", "img": "", "tag": ""}, {"n": 5, "sec": 1, "id": "세균1 20-6", "src": "세균각론1 · 20번지", "q": "정상분만으로 태어난 아기가 태어난 지 5일 만에 고열, 구토, 호흡 곤란으로 응급실에 왔다. 혈액배양과 뇌척수액 배양에서 그람양성알균이 나와 신생아 패혈증, 뇌수막염으로 진단되었다. 원인균으로 가장 가능성이 높은 균은?", "opts": ["Staphylococcus aureus", "Streptococcus pneumoniae", "Streptococcus pyogenes", "Streptococcus agalactiae", "Listeria monocytogenes"], "ans": 3, "hint": "신생아 패혈증+뇌수막염+그람양성알균 = S. agalactiae(GBS).", "why": "S. agalactiae는 신생아 패혈증·폐렴·수막염을 일으킨다. 미숙아·영아는 보체경로 미발달로 취약.", "mem": "신생아 패혈증/수막염 그람양성'알'균=GBS(agalactiae). Listeria는 그람양성 알막대균.", "img": "", "tag": ""}, {"n": 6, "sec": 1, "id": "세균1 20-7", "src": "세균각론1 · 20번지", "q": "82세 남자가 갑자기 몸이 춥고, 고열, 혈액이 있는 가래기침 증상으로 병원에 왔다. 가슴 X선 촬영 결과에서 아래 폐의 짙은 경화가 관찰되었다. 객담에서 분리된 균을 그람염색해서 보니 그람양성 쌍알균이었다. 이 균의 특성으로 맞는 것은?", "opts": ["담즙 용해에 저항성", "협막이 주 독성인자", "옵토킨(optochin)에 저항성", "혈액우무배지에서 베타용혈", "Pneumolysin으로 항포식작용"], "ans": 1, "hint": "폐경화+그람양성 쌍알균 = S. pneumoniae.", "why": "S. pneumoniae는 polysaccharide capsule이 점액성 집락을 이루며 주 독성인자(항포식)로 작용한다.", "mem": "폐렴구균: 담즙용해 감수성, optochin 감수성, alpha용혈, 협막이 주 독성인자.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQk LRICTx61FMMYGc1OBwDnimTYOPQUISK8aAHJFFOJ3HaBiiqKLH8RpHoopEMil7U6P7ooooEPHemiiigoRfvUrd6KKYDE7/Slm/1J+lFFJgZif62rTdFooplEsXUU9v8AVn60UUC6jE6int1oooGNH3xVc/64UUUAiwe30qKftRRQMYOgqtedD9KKKEUi1YdPwqaXqtFFJ7kskj/1X51Sm+/RRQhIuQf6sfWniiikyRj9T9Kyrn+tFFVEuBHF/rF+tbKdKKKbCQHoaa3RaKKliLH8IqNupoopgIvepB/q6KKliILn/Ut9K5q4/wBeKKKcTWnuS2v8dblp/qfwoooYVNi4P9WKa/Q0UUkYoiT79FFFUUf/2Q==", "tag": "사진/그림"}, {"n": 7, "sec": 1, "id": "세균1 20-8", "src": "세균각론1 · 20번지", "q": "75세 가죽 공장을 하는 남자가 호주 비즈니스 여행에서 소 농장을 방문하고 돌아온 후 팔의 상처가 붓고 궤양이 생긴 후에 새까만 가피가 생겼다. 남자는 열이 나고 몸살이 나는 증상도 있었다. 피부 검체로부터 아포를 생성하는 그람양성균이 배양되었다. 이 균이 가지는 독성인자는?", "opts": ["Hyaluronic acid capsule", "Edema toxin", "Alpha toxin", "Enterotoxin", "Endotoxin"], "ans": 1, "hint": "소 접촉+궤양+까만 괴사성 가피 = 피부탄저(B. anthracis).", "why": "B. anthracis의 독성인자는 Edema toxin(PA+EF)와 Lethal toxin(PA+LF).", "mem": "피부탄저=B.anthracis. Hyaluronic capsule=S.pyogenes, Alpha toxin=C.perfringens, Endotoxin=그람음성만.", "img": "", "tag": ""}, {"n": 8, "sec": 1, "id": "세균1 20-9", "src": "세균각론1 · 20번지", "q": "자취하는 대학생이 아침에 만들어 놓은 볶음밥을 식탁에 놓고 학교에 간 후, 저녁에 데워 식사했다. 3시간쯤 지나 갑작스러운 구역, 구토 및 복통 증상을 나타냈고 다음 날 오전까지 지속되었다가 특별한 치료 없이 회복되었다. 원인 균은?", "opts": ["Bacillus cereus", "Clostridium botulinum", "Listeria monocytogenes", "Clostridium perfringens", "Staphylococcus epidermidis"], "ans": 0, "hint": "볶음밥(쌀)+빠른 구토+24시간 내 회복 = B. cereus 구토형 식중독.", "why": "B. cereus 구토형 식중독은 오염된 쌀이 주원인이며 빠른 발현·짧은 지속이 특징.", "mem": "볶음밥 구토형=B.cereus. C.botulinum은 1~3일 후, C.perfringens는 8~12시간 후 발현.", "img": "", "tag": ""}, {"n": 9, "sec": 1, "id": "세균1 20-10", "src": "세균각론1 · 20번지", "q": "생후 1주일된 신생아가 목의 경직과 고열로 왔다. 산모는 임신 중 체험목장을 방문하여 살균되지 않은 우유를 먹었고 이후 약한 감기 증상을 앓았다. 뇌척수액에서 그람양성균이 발견되었고 한냉증균(cold enrichment)으로 잘 자랐다. 원인 병원체는?", "opts": ["Staphylococcus aureus", "Listeria monocytogenes", "Streptococcus pyogene", "Streptococcus agalactiae", "Streptococcus pneumoniae"], "ans": 1, "hint": "살균안된 우유+신생아 수막염+cold enrichment = L. monocytogenes.", "why": "Listeria는 1~45℃ 넓은 온도/pH, 높은 염 농도에서 증식, cold enrichment로 선택배양. 실온에서 더 잘 운동.", "mem": "Listeria=살균안된 유제품, cold enrichment, 신생아 리스테리아증/성인수막염. 그람양성 알막대균.", "img": "", "tag": ""}, {"n": 10, "sec": 1, "id": "세균1 21-1", "src": "세균각론1 · 21번", "q": "68세 남자가 수술 부위에서 화농성 피부감염이 발견되어 배농치료 및 항균제 치료를 실시하였다. 고름을 배양하였더니 혈액우무배지에서 베타용혈이 나타나고 Mannitol salt agar 배지에서 콜로니 부위가 노랗게 변하였다. 이 원인 균의 감염 확산에 기여하는 enzyme이 아닌 것은?", "opts": ["Hyaluronidase", "Coagulase", "Fibrinolysis", "Nuclease", "모두 기여한다"], "ans": 4, "hint": "베타용혈+Mannitol salt agar 노란색 = S. aureus.", "why": "Hyaluronidase, coagulase, fibrinolysin, nuclease 모두 S. aureus의 확산/병독성에 기여한다.", "mem": "S.aureus: MSA 발효(노란색), coagulase+(유일). 확산효소 모두 기여 → '모두 기여한다'가 정답.", "img": "", "tag": ""}, {"n": 11, "sec": 1, "id": "세균1 21-2", "src": "세균각론1 · 21번", "q": "10세 남아가 춥고 목이 아프다고 병원에 왔다. 체온은 38도, 인두와 편도는 사진과 같았고(A) 목의 림프절은 약간 부어 압통이 있었다. 그람염색은 사진과 같았다(B, 사슬모양 그람양성알균). 원인균의 특성으로 맞지 않는 것은?", "opts": ["혈액우무배지에서 베타용혈", "Hyaluronic acid capsule 항포식작용", "M protein 항포식작용", "Bacitracin 감수성", "PYR 검사 음성"], "ans": 4, "hint": "인두염+사슬모양 그람양성알균 = S. pyogenes(GAS).", "why": "S. pyogenes는 PYR 검사 양성이다. PYR 음성이라는 설명이 틀렸다.", "mem": "GAS=S.pyogenes: beta용혈, bacitracin 감수성, PYR 양성, M protein/hyaluronic capsule 항포식.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGiAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm BRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUABB7U1UCsWA5PWnUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFAH//Z", "tag": "사진/그림"}, {"n": 12, "sec": 1, "id": "세균1 21-3", "src": "세균각론1 · 21번", "q": "Bioterrorism으로 사용되었던 탄저균의 특성에 대한 설명으로 맞는 것은?", "opts": ["Polysaccharide capsule", "단백합성 억제하는 Edema toxin", "아포형성균", "cAMP 증가시키는 Lethal toxin", "그람양성알균"], "ans": 2, "hint": "탄저균 = Bacillus anthracis.", "why": "B. anthracis는 아포형성균(그람양성 막대균)이다.", "mem": "탄저균: Polypeptide(D-glutamate) capsule, 아포형성, 그람양성막대균. Edema toxin=cAMP↑, Lethal toxin=단백분해(MAPKK).", "img": "", "tag": ""}, {"n": 13, "sec": 1, "id": "세균1 21-4", "src": "세균각론1 · 21번", "q": "5개월 된 영아가 모유수유를 잘 하지 못하고 변비가 있으며 울음소리가 약해져서 왔다. 평소 이유식 대신 꿀을 자주 먹었다고 한다. 신체진찰에서 머리를 가누지 못할 정도로 축 늘어져 있었다. 원인균에 대한 설명으로 맞지 않는 것은?", "opts": ["혐기성균", "아포형성균", "Tetanospasmin 생성", "그람양성막대균", "이완성 마비 유도"], "ans": 2, "hint": "꿀+영아+이완성 마비(축 늘어짐) = 영아 보툴리눔독소증(C. botulinum).", "why": "C. botulinum은 botulinum neurotoxin을 생성한다. Tetanospasmin은 C. tetani의 독소이므로 틀렸다.", "mem": "영아 보툴리눔=꿀, 이완성마비. Tetanospasmin(경직마비)은 C.tetani. 둘 다 혐기성 아포형성 그람양성막대균.", "img": "", "tag": ""}, {"n": 14, "sec": 1, "id": "세균1 21-5", "src": "세균각론1 · 21번", "q": "76세 남자가 갑자기 몸이 춥고, 고열, 혈액이 있는 가래기침 증상으로 병원에 왔다. 가슴 X선에서 아래 폐의 짙은 경화가 관찰되었다. 혈액우무배지에서 배양하니 거무스름한 색을 띠는 점액 집락을 형성하였고 담즙에 용해되었다. 이 균을 그람 염색한 결과와 주 독성인자를 맞게 짝지은 것은?", "opts": ["그람양성알균 쌍으로 배열 - 협막", "그람양성알균 포도송이배열 - Pyrogenic exotoxin", "그람양성알균 사슬로 배열 - 협막", "그람양성알균 쌍으로 배열 - Pyrogenic exotoxin", "그람양성알균 사슬로 배열 - pneumolysin"], "ans": 0, "hint": "폐경화+담즙용해+점액성 집락 = S. pneumoniae.", "why": "S. pneumoniae는 그람양성알균이 쌍으로 배열되고, 주 독성인자는 협막(capsule)이다.", "mem": "폐렴구균=쌍알균(diplococcus)+협막이 주 독성인자. 담즙용해 감수성이 진단 단서.", "img": "", "tag": ""}, {"n": 15, "sec": 1, "id": "세균1 22-1", "src": "세균각론1 · 22번", "q": "40세 남성이 갑작스런 고열, 근육통, 구토 그리고 설사가 발생하여 응급실에 왔다. 피부는 전신에 sunburn 후 나타나는 것처럼 표피탈락이 관찰되었다. 혈액 및 대변에서 세균배양을 했으나 검출되지 않았다. 남성은 며칠 전 만성부비동염으로 수술을 받았고, 코 안쪽에 단단한 솜뭉치가 묻어 있었으며 솜뭉치에서 카탈라아제 양성의 그람양성 알균이 배양되었다. 이 질환의 가장 가능성 높은 병원성인자는?", "opts": ["Toxic shock syndrome toxin-1", "Polysaccharide capsule", "Pyrogenic toxin", "Exfoliative toxin", "Coagulase"], "ans": 0, "hint": "솜뭉치(탐폰)+sunburn 양 표피탈락+전신증상, 균은 국소에만 = TSS.", "why": "S. aureus의 TSST-1(superantigen)이 점막을 투과해 전신증상(TSS)을 유발. 균은 국소에 국한.", "mem": "TSS=TSST-1 superantigen, 감염은 국소·독소가 전신. SSSS(exfoliative)는 염증 없이 표피탈락(다른 문제).", "img": "", "tag": ""}, {"n": 16, "sec": 1, "id": "세균1 22-2", "src": "세균각론1 · 22번", "q": "9세 남아가 혈뇨, 부종, 단백뇨 등과 같은 급성 사구체신염의 증상으로 병원에 왔다. 이 환자는 3주 전에 혈액우무배지에서 베타용혈을 보이는 group A 사슬알균에 의한 급성인후염을 앓았다. 이 환자의 급성사구체신염 유발 기전으로 가장 적합한 것은?", "opts": ["내독소에 의한 혈관내피세포의 투과도 변화", "외독소에 의한 사구체 기저막의 투과도 변화", "용혈소(hemolysin) 작용으로 인한 적혈구 파괴", "면역복합체의 침착으로 인한 사구체 기저막의 염증반응", "항체의 교차반응을 통한 사구체 기저막에 대한 항체의존성 세포독성"], "ans": 3, "hint": "GAS 인두염 3주 후 급성사구체신염(post-strep GN).", "why": "급성사구체신염은 면역복합체(immune complex)가 사구체 기저막에 침착하여 염증을 일으키는 비화농성 합병증.", "mem": "PSGN=면역복합체 침착. 류마티스열은 교차반응(class I M protein). 둘 다 S.pyogenes 비화농성 후유증.", "img": "", "tag": ""}, {"n": 17, "sec": 1, "id": "세균1 22-3", "src": "세균각론1 · 22번", "q": "10세 남아가 급성 인두 통증과 발열로 병원에 왔다. 지난 1주간 수차례 구토를 하였고, 체온 38.9℃, 기침이나 콧물은 없었다. 후인두는 삼출을 동반하며 홍반성으로 보이고, 목의 림프절 종창이 촉진된다. 입인두 뒤 편도에서 채취한 목구멍 면봉 검체에서 GAS가 검출되었고 혈액검사에서 ASO 항체가 검출되었다. 의사가 amoxicillin 10일치를 처방하려는 합병증으로 가장 적합한 것은?", "opts": ["성홍열(scarlet fever)", "류마티스열(rheumatic fever)", "토리콩팥염(glomerulonephritis)", "만성이동홍반(erythema chronicum migrans)", "용혈요독증후군(hemolytic uremic syndrome)"], "ans": 1, "hint": "GAS 인두염+ASO+항생제로 예방하려는 합병증.", "why": "항생제(amoxicillin)로 예방 가능한 GAS 비화농성 후유증은 류마티스열이다. 사구체신염은 항생제로 예방되지 않음.", "mem": "류마티스열=항생제 예방 가능, 사구체신염=예방 안됨. GAS 인두염 후 ASO 상승.", "img": "", "tag": ""}, {"n": 18, "sec": 1, "id": "세균1 22-4", "src": "세균각론1 · 22번", "q": "30세 남자가 팔에 2cm의 병변이 생겨서 병원에 왔다. 병터는 통증이 없는 구진 형태로 시작되어 수일 이내에 궤양으로 진행된 후 검은색 딱지(가피)가 형성되었다. 도살장에서 소의 가죽을 벗겨내는 일을 하고 있었다. 병변에서 얻어진 체액의 그람염색 결과이다. 병원체의 특성으로 맞지 않는 것은?", "opts": ["아포형성균", "Adenylate cyclase인 Edema factor 생성", "Zinc protease인 Lethal factor 생성", "비운동성균", "Polysaccharide capsule의 항포식작용"], "ans": 4, "hint": "소 가죽+무통성 궤양→검은 가피 = 피부탄저(B. anthracis).", "why": "B. anthracis의 협막은 polysaccharide가 아니라 polypeptide(poly-D-glutamate) capsule이다.", "mem": "탄저균: 아포형성, Edema factor(adenylate cyclase), Lethal factor(zinc protease), 비운동성, polypeptide capsule.", "img": "", "tag": ""}, {"n": 19, "sec": 1, "id": "세균1 22-5", "src": "세균각론1 · 22번", "q": "68세의 남자가 고열과 호흡곤란으로 병원을 방문하였다. 환자는 최근까지 매일 소주 한 병을 10년 동안 마셨다. 환자의 가래에서 그람양성 쌍알균이 관찰되었고 이 균을 혈액우무배지에 배양한 결과 알파용혈 소견이 관찰되었다. 균은 옵토킨에 감수성을 나타내고 담즙에 용해되었다. 다음 중 이 균의 가장 중요한 병원성 인자로서 백신의 주요성분으로 사용되는 것은?", "opts": ["Polysaccharide capsule", "Pyrogenic toxin", "Pneumolysin", "Teichoic acid", "Autolysin"], "ans": 0, "hint": "알파용혈+옵토킨 감수성+담즙용해 = S. pneumoniae.", "why": "폐렴구균의 협막(polysaccharide capsule)이 주 독성인자이며, 협막다당류가 백신(23가/단백접합 등) 성분이다.", "mem": "폐렴구균 백신=협막다당류(13가 단백접합/23가 다당). 협막이 항포식·주독성인자.", "img": "", "tag": ""}, {"n": 20, "sec": 2, "id": "세균2 20-1", "src": "세균각론2 · 20번", "q": "3세 여아가 심한 기침으로 병원에 왔다. 일주일 동안 지속된 감기증상이 나아지지 않고 내원 전날에 심한 기침이 시작되었다. 발작적인 기침은 구토로 이어졌다. 내원 당시 아이는 매우 지친 상태였다. 피 검사에서 림프구의 증가가 보였다. 원인균의 독소 기작은?", "opts": ["Superantigen", "세포막에 pore형성", "세포내 cAMP 증가 유도", "신경세포의 acetylcholine 억제", "EF-2를 불활성하여 단백 합성 억제"], "ans": 2, "hint": "발작성 기침→구토+림프구증가 = 백일해(B. pertussis).", "why": "Pertussis toxin은 adenylate cyclase를 조절하는 단백을 불활성화시켜 cAMP 증가를 유도한다.", "mem": "백일해=Pertussis toxin, cAMP↑. acetylcholine 억제=C.botulinum, EF-2 불활성=디프테리아.", "img": "", "tag": ""}, {"n": 21, "sec": 2, "id": "세균2 20-2", "src": "세균각론2 · 20번", "q": "61세 여자가 설사, 구토, 두통, 발열이 생겨 응급실로 왔다. 같은 등산 동호회 10여명도 같은 증상을 호소하였다. 2일 전 산행에서 함께 먹은 육전과 떡으로 인한 식중독이었다. 대변배양검사에서 맥콩키배지에서 무색 콜로니가 다수 발견되었고 이 균은 운동성이 있고 oxidase 음성이었다. 추정되는 원인균은?", "opts": ["Shigella sonnei", "Proteus vulgaris", "Salmonella enterica", "Vibrio parahaemolyticus", "Enterotoxigenic Escherichia coli"], "ans": 2, "hint": "식중독+맥콩키 무색(젖산비발효)+운동성+oxidase(-) = Salmonella.", "why": "Salmonella는 식중독 유발, 운동성 있음, oxidase 음성, 맥콩키 무색 콜로니. M cell 통과해 전신감염.", "mem": "Salmonella: 운동성+, oxidase-, 무색. Shigella=non-motile, V.para=oxidase+, ETEC=맥콩키 적색.", "img": "", "tag": ""}, {"n": 22, "sec": 2, "id": "세균2 20-3", "src": "세균각론2 · 20번", "q": "55세 남자가 야외 카페에서 친구들과 시간을 보내고 집에 돌아온 후 발열, 두통, 마른기침이 시작되어 병원에 왔다. 가슴 X선에서 오른쪽 폐의 경화가 보였다. 방문한 카페는 오랫동안 쓰지 않았던 분수대를 그 날 가동하였고 분사된 물방울의 흡입으로 감염되었다면 원인균의 특성으로 맞는 것은?", "opts": ["협막의 항포식작용", "절대 세포내 기생세균", "항체가 감염 해소에 중요", "그람염색에서 진분홍으로 염색이 잘됨", "시스테인과 철분이 첨가된 BCYE 배지에서 배양"], "ans": 4, "hint": "분수대 aerosol 흡입+비정형 폐렴 = Legionella pneumophila.", "why": "Legionella는 L-cysteine과 iron salt가 첨가된 BCYE 배지에서 배양한다.", "mem": "Legionella=냉각탑/분수대 aerosol, BCYE 배지. facultative 세포내균, cell-mediated immunity 중요, 임상검체는 은염색.", "img": "", "tag": ""}, {"n": 23, "sec": 2, "id": "세균2 20-4", "src": "세균각론2 · 20번", "q": "32세 여자가 소변을 잘 참지 못하고 소변 볼 때 통증을 느껴서 왔다. 소변에서 냄새도 났다. 소변검사 결과 그람음성알막대균이 관찰되었고 균 특성검사에서 oxidase 음성, urease 음성이 나왔다. 원인 병원균이 요로감염을 일으키는 데 특별히 중요한 병원성 인자는?", "opts": ["Pili", "LPS", "Capsule", "Flagella", "Shiga toxin"], "ans": 0, "hint": "요로감염+그람음성막대균+urease(-)+oxidase(-) = ExPEC(E. coli).", "why": "UPEC의 요로감염에 중요한 병원성 인자는 adhesin(pili, P/type1/S/F1C/Dr 섬모)으로 균이 씻겨나가지 않게 부착.", "mem": "요로감염 E.coli=adhesin(pili)이 핵심. urease(-)로 Proteus 제외, oxidase(-)로 Pseudomonas 제외.", "img": "", "tag": ""}, {"n": 24, "sec": 2, "id": "세균2 20-5", "src": "세균각론2 · 20번", "q": "59세 알콜 중독자인 노숙자가 폐렴 증상으로 응급실에 왔다. 호흡곤란이 심하여 기관내 삽관 및 기계적 환기를 실시하였다. 환자의 객담은 혈액이 섞여있는 젤리 같았고, 객담염색으로 그람음성막대균이 관찰되었다. 이 균의 특성으로 맞는 것은?", "opts": ["Oxidase 양성", "SS 배지에서 검은색 콜로니", "협막으로 인한 점액성 콜로니", "MacConkey 배지에서 무색 콜로니", "배지에서 운동성으로 swarming 현상"], "ans": 2, "hint": "알콜중독+혈액 섞인 젤리 같은 가래 = Klebsiella pneumoniae.", "why": "K. pneumoniae는 협막을 형성하여 점액성(mucoid) 집락을 이룬다.", "mem": "Klebsiella: 협막→점액성 집락, oxidase-, non-motile, 젖산발효(맥콩키 분홍). SS 검은색=Salmonella, swarming=Proteus.", "img": "", "tag": ""}, {"n": 25, "sec": 2, "id": "세균2 20-6", "src": "세균각론2 · 20번", "q": "37세 남자가 만성 위염이 심해져 병원에 왔다. 위내시경으로 위점막 생검조직을 채취하였다. 혈액한천배지에 도말 후 37℃, 10% CO₂ 배양기에서 5~7일간 배양하였다. 5일째에 작고 둥근 무색의 세균 집락이 관찰되었다. 그람염색에서 가늘고 굽은 모양의 그람음성균을 확인하였다. 이 균의 특성으로 맞는 것은?", "opts": ["Toxin 있음", "운동성 없음", "Urease 음성", "Oxidase 음성", "Catalase 음성"], "ans": 0, "hint": "만성 위염+가늘고 굽은 그람음성균 = H. pylori.", "why": "H. pylori는 cagA, vacA 등 toxin을 분비한다.", "mem": "H.pylori: oxidase+, catalase+, urease+, 강한 운동성(flagella), toxin(cagA/vacA) 있음.", "img": "", "tag": ""}, {"n": 26, "sec": 2, "id": "세균2 20-7", "src": "세균각론2 · 20번", "q": "38세 화상환자의 상처부위에 감염으로 농이 생겼다. 농을 배양한 결과 방향족 냄새가 나는 청록 및 녹황색의 균 집락을 확인할 수 있었다. 균은 포도당을 발효하지 않으며 oxidase 양성, catalase 양성이었다. 이 원인균의 독성인자 중에서 숙주세포의 단백합성을 저해하여 조직 손상을 초래하는 것은?", "opts": ["Pyocyanin", "Pyoverdin", "Exotoxin A", "Exoenzymes S", "Alginate capsule"], "ans": 2, "hint": "화상+청록/녹황색 집락+비발효+oxidase(+) = Pseudomonas aeruginosa.", "why": "Exotoxin A(ETA)는 숙주세포의 단백질 합성을 방해한다(기전이 diphtheria toxin과 유사).", "mem": "녹농균 Exotoxin A=EF-2 불활성(단백합성 저해). Pyocyanin/Pyoverdin=색소, Exoenzyme S=T3SS actin, Alginate=항포식.", "img": "", "tag": ""}, {"n": 27, "sec": 2, "id": "세균2 20-8", "src": "세균각론2 · 20번", "q": "57세 남자가 다리의 출혈성 수포와 괴사성 궤양으로 병원에 왔다. 피부증상 이틀 전 서해안 해수욕장 횟집에서 생선회와 조개 등을 먹었다. 평소 간질환을 가지고 있었다. 다리의 수포액을 TCBS 배지에서 배양한 결과 녹색 집락이 형성되었다. 원인균은?", "opts": ["Vibrio vulnificus", "Francisella tularensis", "Haemophilus influenzae", "Vibrio parahaemolyticus", "Pseudomonas aeruginosa"], "ans": 0, "hint": "간질환+조개 섭취+출혈성 수포/괴사+TCBS 녹색 = V. vulnificus.", "why": "V. vulnificus는 만성 간질환자 등에서 발병, 오염 조개 섭취/상처감염, TCBS 녹색 집락, primary septicemia·조직괴사.", "mem": "V.vulnificus/V.parahaemolyticus=TCBS 녹색, V.cholerae=노란색. 간질환자에서 패혈증·대수포.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk 초콜렛 agar 위에 직경 0.5mm인 작고 이슬 같은 집락을 형성하는 그람음성균이 분리되었다. 성장에는 X 인자(hemin)와 V 인자(NAD)가 필요하였다. 원인균의 독성인자인 협막을 바르게 말한 것은?", "opts": ["Alginate capsule", "Polypeptide capsule", "Hyaluronic acid capsule", "Lipopolysaccharide capsule", "Polyribitol phosphate capsule"], "ans": 4, "hint": "X인자+V인자 필요+소아 수막염 = Haemophilus influenzae.", "why": "Hib의 중요 독성인자는 polysaccharide capsule인 PRP(polyribitol phosphate)로 항포식작용을 한다.", "mem": "H.influenzae=X(hemin)+V(NAD) 필요, Hib 협막=PRP. Alginate=Pseudomonas, Polypeptide=Bacillus, Hyaluronic=S.pyogenes.", "img": "", "tag": ""}, {"n": 29, "sec": 2, "id": "세균2 20-10", "src": "세균각론2 · 20번", "q": "요로감염 병력이 있는 35세 여성이 잦은 배뇨와 배뇨통증으로 왔다. 아침 첫 소변에서 심한 암모니아 냄새가 났으며, 세균배양검사에서 혈액우무배지와 맥콩키배지에서 모두 집락이 자랐다. 그람음성막대균이 나왔고 urease를 생산하였고 운동성이 좋았다. 원인감염균은?", "opts": ["Escherichia coli", "Proteus mirabilis", "Helicobacter pylori", "Klebsiella pneumoniae", "Pseudomonas aeruginosa"], "ans": 1, "hint": "요로감염+암모니아 냄새+urease(+)+강한 운동성 = Proteus mirabilis.", "why": "Proteus는 urease로 요소를 암모니아로 분해해 요 pH↑(알칼리뇨), 맥콩키 무색 집락, swarming 운동.", "mem": "Proteus=urease+ 암모니아뇨+swarming. E.coli=운동성 없음/urease-, Klebsiella=non-motile, Pseudomonas=oxidase+.", "img": "", "tag": ""}, {"n": 30, "sec": 2, "id": "세균2 21-1", "src": "세균각론2 · 21번", "q": "다음의 E. coli 중에서 장 상피세포 부착 후 microvilli를 파괴하여 소실하는 attachment/effacement (A/E) histopathology를 보이는 균은?", "opts": ["EHEC", "ETEC", "EAEC", "EIEC", "ExPEC"], "ans": 0, "hint": "A/E 병변(microvilli 소실) = EHEC/EPEC.", "why": "EHEC는 Tir와 intimin을 이용해 부착하고 A/E 병변(microvilli 파괴)을 만든다.", "mem": "A/E lesion=EHEC/EPEC(Tir-intimin). ETEC=장독소(LT/ST), EIEC=침습, EAEC=응집부착.", "img": "", "tag": ""}, {"n": 31, "sec": 2, "id": "세균2 21-2", "src": "세균각론2 · 21번", "q": "Klebsiella pneumoniae와 Haemophilus influenzae type B 균의 공통적인 주 독성인자는?", "opts": ["Pili", "Capsule", "Exotoxin", "IgA protease", "LPS O-antigen"], "ans": 1, "hint": "두 균 모두 협막이 주 독성인자.", "why": "Klebsiella는 점액성 협막, Hib는 PRP 협막을 주 독성인자로 가진다(공통=capsule).", "mem": "Klebsiella·Hib 공통=협막(capsule)의 항포식작용.", "img": "", "tag": ""}, {"n": 32, "sec": 2, "id": "세균2 21-3", "src": "세균각론2 · 21번", "q": "38세 화상환자의 상처부위에 농이 생겼다. 농을 배양한 결과 방향족 냄새가 나는 청록 및 녹황색 균 집락을 확인할 수 있었다. 원인균의 특성에 해당되지 않는 것은?", "opts": ["Capsule", "Oxidase (+)", "Catalase (+)", "Gram-negative rod", "Lactose fermentation"], "ans": 4, "hint": "화상+청록/녹황색 집락 = P. aeruginosa.", "why": "P. aeruginosa는 비발효균(non-fermenter)으로 lactose를 발효하지 않는다.", "mem": "녹농균=비발효(맥콩키 무색), oxidase+, catalase+, 그람음성막대, alginate capsule. lactose 발효 안함.", "img": "", "tag": ""}, {"n": 33, "sec": 2, "id": "세균2 21-4", "src": "세균각론2 · 21번", "q": "21세 여자가 이틀 전부터 어제까지 발열, 두통 및 근육통이 있다가 오늘부터 복통과 함께 설사를 한다며 왔다. 4일 전까지 양계장에서 계란 수거 아르바이트를 맨손으로 하였다. 대변검체에서 얻은 원인균은 CO₂가 강화된 microaerophilic 조건에서 배양되고, 그람음성의 작고 얇은 만곡형 막대균으로 관찰되었다. catalase 양성, urease 음성. 후유증으로 길랑-바레증후군이 나타났다. 원인균은?", "opts": ["Brucella abortus", "Yersinia enterocolitica", "Helicobacter pylori", "Francisella tularensis", "Campylobacter jejuni"], "ans": 4, "hint": "양계장+만곡형 그람음성균+microaerophilic+길랑바레 후유증 = C. jejuni.", "why": "Campylobacter jejuni는 가금류 매개, microaerophilic, 만곡형, catalase+/urease-, 길랑-바레증후군 후유증.", "mem": "C.jejuni=가금류, microaerophilic, 길랑바레. H.pylori는 urease+(위장 증상).", "img": "", "tag": ""}, {"n": 34, "sec": 2, "id": "세균2 21-5", "src": "세균각론2 · 21번", "q": "61세 여자가 설사, 구토, 두통, 발열이 생겨 응급실로 왔다. 같은 등산 동호회 10여명도 같은 증상을 호소하였다. 2일 전 산행에서 함께 먹은 육전과 떡으로 인한 식중독이었다. 대변배양검사에서 맥콩키배지에서 무색 콜로니가 다수 발견되었고 운동성이 있고 oxidase 음성이었다. 가장 가능성 있는 원인균은?", "opts": ["Salmonella enterica", "Proteus vulgaris", "Shigella sonnei", "Vibrio parahaemolyticus", "Enterotoxigenic Escherichia coli"], "ans": 0, "hint": "식중독+맥콩키 무색+운동성+oxidase(-) = Salmonella.", "why": "Salmonella는 운동성 있고 oxidase 음성, 맥콩키 무색 콜로니로 식중독을 일으킨다.", "mem": "Salmonella: 운동성+, oxidase-, 무색. Shigella=non-motile, V.para=oxidase+, ETEC=맥콩키 적색.", "img": "", "tag": ""}, {"n": 35, "sec": 2, "id": "세균2 21-6", "src": "세균각론2 · 21번", "q": "29세 여성이 소변이 자주 마렵고 소변 볼 때 통증으로 병원에 왔다. 원인 균은 MacConkey agar에서 핑크색 콜로니를 띠었다. 가장 가능성이 높은 균의 특성으로 맞지 않는 것은?", "opts": ["Pili가 중요한 독성인자", "그람음성막대균", "Oxidase 음성", "운동성 있음", "Urease 양성"], "ans": 4, "hint": "요로감염+맥콩키 핑크색(젖산발효) = E. coli.", "why": "E. coli는 urease 음성이다. Urease 양성이라는 설명이 틀렸다.", "mem": "E.coli 요로감염: 맥콩키 핑크(젖산발효), pili adhesin 중요, oxidase-, urease-. urease+면 Proteus.", "img": "", "tag": ""}, {"n": 36, "sec": 2, "id": "세균2 21-7", "src": "세균각론2 · 21번", "q": "57세 남성이 여름 휴가철이 지나 한적한 바다에 가서 바다 낚시를 하였다. 물에 들어가 그물로 낚시를 하였는데 뾰족한 돌들에 다리가 몇 군데 긁혔다. 며칠 후 온 몸이 아프고 열과 오한이 나더니 다리에 사진과 같은 수포가 생겼다. 환자는 만성 간 질환을 갖고 있었다. 원인균의 특성이 아닌 것은?", "opts": ["Oxidase (-)", "Halophilic", "Polysaccharide capsule", "Curved 그람음성막대균", "TCBS에서 초록색 콜로니"], "ans": 0, "hint": "간질환+바다 상처+다리 수포 = V. vulnificus.", "why": "Vibrio는 oxidase 양성이다. Oxidase 음성이라는 설명이 틀렸다.", "mem": "Vibrio=oxidase 양성, 호염성(halophilic), 만곡형 그람음성막대, TCBS 녹색, 협막.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGeAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6pooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiig phtheria/ExoA=단백합성 저해.", "img": "", "tag": ""}, {"n": 39, "sec": 2, "id": "세균2 21-10", "src": "세균각론2 · 21번", "q": "물탱크를 청소하는 52세 남성이 열이 나고, 두통, 몸살, 마른 기침으로 병원에 왔다. X-ray 폐사진에서 폐렴으로 확인되었다. 원인 균은 sheep blood agar 배지에서는 자라지 않고 시스테인과 철분이 첨가된 BCYE 배지에서 자랐다. 원인 균의 특성으로 맞는 것은?", "opts": ["협막의 항포식작용", "절대 세포내 기생세균", "항체가 감염 해소에 중요", "그람염색에서 진한 분홍색", "Macrophage 안에서 생존"], "ans": 4, "hint": "물탱크+비정형 폐렴+BCYE 배양 = Legionella.", "why": "Legionella는 facultative intracellular로 대식세포(macrophage) 안에서 생존·증식한다.", "mem": "Legionella=BCYE, 대식세포 내 생존(facultative). 절대세포내균 아님, cell-mediated immunity 중요, 은염색.", "img": "", "tag": ""}, {"n": 40, "sec": 2, "id": "세균2 23-1", "src": "세균각론2 · 23번", "q": "물설사로 시작한 장염이 이틀 후에는 심한 복통과 뒤무직으로 이어졌다. 원인균은 사람간 감염만 되는 운동성이 없는 그람음성막대균이었다. 이 균을 배양한 결과로 맞는 것은?", "opts": ["XLD배지에서 무색 콜로니", "혈액우무배지에서 검은색 콜로니", "EMB배지에서 검은색 콜로니", "Mannitol Salt 배지에서 무색 콜로니", "MacConkey 배지에서 분홍색 콜로니"], "ans": 0, "hint": "뒤무직(tenesmus)+사람간 전파+non-motile 그람음성막대 = Shigella.", "why": "Shigella는 젖산비발효·H₂S 비생성이라 XLD 배지에서 무색(red) 콜로니로 자란다.", "mem": "Shigella=뒤무직, non-motile, XLD 무색. H₂S 검은색은 Salmonella. EMB 검은색/금속광택은 E.coli.", "img": "", "tag": ""}, {"n": 41, "sec": 2, "id": "세균2 23-3", "src": "세균각론2 · 23번", "q": "71세 남자가 숨쉬기가 힘들고 끈적끈적한 피가 섞인 가래 기침을 하는 증상으로 병원에 왔다. 매일 소주를 마시는 알코올 중독자였다. 원인균은 MacConkey 배지에서 점액성의 분홍색 콜로니로 배양되었다. 이 균에게 가장 중요한 독성인자는?", "opts": ["Enterotoxin", "Capsule", "Cytotoxin", "IgA protease", "T3SS"], "ans": 1, "hint": "알콜중독+혈액 섞인 가래+점액성 분홍색 집락 = K. pneumoniae.", "why": "K. pneumoniae의 가장 중요한 독성인자는 협막(capsule)으로 점액성 집락과 항포식을 담당.", "mem": "Klebsiella=협막이 주 독성인자, 점액성 분홍 집락(젖산발효).", "img": "", "tag": ""}, {"n": 42, "sec": 2, "id": "세균2 23-5", "src": "세균각론2 · 23번", "q": "50세 남자가 8월 여름 휴가로 간 서해안에서 생선회와 조개 등을 먹었고 2일 후 고열, 오한, 사지의 통증, 구토로 병원에 왔다. 음주벽으로 황달을 앓은 적이 있었다. 입원 중 피부에 출혈성 수포가 생성되었고 혈압이 떨어지고(93/34) 호흡수가 증가되어(30회/min) 여러 장기에 문제가 발생하였다. 이 환자의 전신적 증상을 유도한 균의 독성인자는?", "opts": ["Endotoxin", "Enterotoxin", "Capsule", "Cytotoxin", "Toxic shock syndrome toxin"], "ans": 0, "hint": "간질환+조개+패혈성 쇼크(저혈압) = V. vulnificus 패혈증.", "why": "그람음성균 V. vulnificus의 endotoxin(LPS)이 패혈성 쇼크 등 전신 증상을 유도한다.", "mem": "그람음성 패혈증의 전신 증상=endotoxin(LPS). V.vulnificus 1차 패혈증.", "img": "", "tag": ""}, {"n": 43, "sec": 3, "id": "세균3 20-1", "src": "세균각론3 · 20번", "q": "8세 남아가 피로, 열감, 콧물 및 두통, 마른기침으로 병원에 왔다. 가슴 X선 사진에서 하부 폐에 반점형 혼탁이 관찰되었다. 객담 검체 배양 검사에서 계란 프라이형(fried-egg)의 작은 균 집락이 관찰되었다. 원인 균의 특성으로 맞는 것은?", "opts": ["알막대균 모양", "세포내 기생세균", "Sterol 포함한 세포막", "그람염색에서 분홍색 균", "Peptidoglycan ring이 있음"], "ans": 2, "hint": "마른기침+비정형폐렴+fried-egg 집락 = Mycoplasma pneumoniae.", "why": "Mycoplasma는 세포막에 sterol을 함유하는 유일한 세균이다.", "mem": "Mycoplasma=무세포벽, sterol 함유 세포막, 그람염색 안됨, peptidoglycan 없음, fried-egg 집락.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGTAWcDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDt9U8V6jqsLQSyAQt1XFY4Uk4AJqW2tJrtisSFsdT6VsWkDWGPmQnvkVqkPcxtI8S6voru8GgyGQnBk39RV+T4o+IA5R9EkAHfdXRWtwSu7CEf7tRXgSTI2pz7U+VBY5+L4tayz+UuiSMf96rMnxN16JcnQpP++6mWa3spNvloZT04qeS4mwCUU+g20cqCxlD4seICw3aFJj/fqz/wszXHUH+w5P8AvupXmuSd7wKqjvtFT2uob+CqAD/Zo5UFiifihrsZAOgyf9906T4m6wvXQ5Mn/brY+1pL8oWP/vmqN1qsFoxZzHgeq0uVBYqJ8TdWCFm0GQf8DprfFXVcf8gKTA/26tR67aaiAIxGD9KtKSnO2P8AFRRZBYx1+Lupu20aDLkf7VK3xc1NJNr6FJg/7dXf7UiE/lvFEM99opLq7iBARI2J kcSeWp2DNFFMaGT/AHqmjYm3YEmiigCvafeeo41HmOcc0UVQE6fdNRMSHXBxzRRUAWT98UsbMcgk4zRRQgLpJCrzUczFFBUkH1oooBC27s+SzEn3q2vVRRRSGQ3yqpOABTLdj5CjJxk0UUCJ25k554q7bcDFFFDAoHmaT6mnD7lFFJAxvSQEUSHOSetFFMEU7v8A1JpNIZg5GTj0oopgaUhIibBqtB90nvmiigY9mITgmqk5O5RnvRRQgZdAwi49KKKKCT//2Q==", "tag": "사진/그림"}, {"n": 44, "sec": 3, "id": "세균3 20-2", "src": "세균각론3 · 20번", "q": "29세 남자가 소변 볼 때에 화끈거리고 농액성 분비물이 나온다고 병원에 왔다. 분비물을 도말염색하니 커피콩 모양의 그람음성 쌍알균이 관찰되었다. 이 균의 숙주 점막상피세포 부착능과 면역회피작용을 동시에 나타내는 독성인자는?", "opts": ["Pili", "Porin", "Lipooligosaccharide", "Polysaccharide capsule", "Outer membrane protein"], "ans": 0, "hint": "농액성 요도분비물+커피콩 모양 그람음성 쌍알균 = N. gonorrhoeae.", "why": "임균의 Pili는 점막상피 부착과 호중구 killing 저항(면역회피)을 동시에 나타낸다. (교수 코멘트: pili와 porin 모두 정답 처리)", "mem": "임균 pili=부착+호중구 저항. 교수 코멘트로 porin도 정답 인정. LOS=endotoxin 활성.", "img": "", "tag": ""}, {"n": 45, "sec": 3, "id": "세균3 20-3", "src": "세균각론3 · 20번", "q": "49세 남자가 한달 넘게 지속되는 기침으로 병원에 왔다. 기침은 점차 심해졌고 객혈과 체중감소, 야간발한의 증상이 동반되었다고 한다. 객담검사에서 항산성 세균이 관찰되었다. 원인균과 관련된 발병기전은?", "opts": ["협막의 항포식작용", "IL-10 유사물질을 분비", "Phagolysosome 융합을 억제", "Macrophage의 apoptosis 촉진", "Macrophage의 cytokine 분비 억제"], "ans": 2, "hint": "만성 기침+객혈+체중감소+야간발한+항산성균 = 결핵(M. tuberculosis).", "why": "M. tuberculosis의 중요 발병기전은 세포 내에서 phagosome과 lysosome의 융합(fusion)을 억제하는 것.", "mem": "결핵=phagolysosome 융합 억제. Cord factor 등 표면당지질. 항포식 협막은 N.gonorrhoeae/H.influenzae.", "img": "", "tag": ""}, {"n": 46, "sec": 3, "id": "세균3 20-4", "src": "세균각론3 · 20번", "q": "40세 남자가 호흡곤란으로 응급실에 왔다. 열, 오한, 근육통, 마른기침이 있었고 가슴 X선상 왼쪽 하부 폐 경화와 오른쪽 상부 폐 반점형 침윤이 관찰되었다. 환자가 조류 애호가이며 최근 기르던 새가 병들어 죽었다는 말을 듣고 의사는 doxycycline 치료를 결정하였다. 의사가 생각한 원인균은?", "opts": ["Coxiella burnetti", "Chlamydia psittaci", "Mycoplasma pneumonia", "Chlamydophila pneumoniae", "Mycobacterium avium complex"], "ans": 1, "hint": "조류 애호가+비정형 폐렴 = 앵무새병(Chlamydia psittaci).", "why": "앵무새병은 조류의 마른 배설물·분비물 흡입으로 감염되며 비정형폐렴·두통, doxycycline/macrolide로 치료.", "mem": "앵무새병=C.psittaci(조류). Q열=C.burnetti(가축/우유), C.pneumoniae=사람-사람.", "img": "", "tag": ""}, {"n": 47, "sec": 3, "id": "세균3 20-5", "src": "세균각론3 · 20번", "q": "56세 여자가 10월 초순 5박6일 야영을 하고 집에 돌아온 지 약 2주 후 가슴과 배에 발진이 생겼고 곧 팔다리로 번졌다. 열이 39도까지 올랐고 오한, 두통, 기침, 구토, 복통이 나타났다. 환자의 겨드랑이 사이로 괴사성 검은 가피를 볼 수 있었다. 원인균의 발병기전은?", "opts": ["림프구의 파괴", "폐포세포의 파괴", "뇌신경세포의 파괴", "피부상피세포의 파괴", "혈관내피세포의 파괴"], "ans": 4, "hint": "가을 야영+괴사성 검은 가피(eschar) = 쯔쯔가무시병(Orientia tsutsugamushi).", "why": "Orientia는 전신 혈관 내피세포에 염증을 유발하여 혈관폐쇄·미세혈전·미세출혈을 야기한다.", "mem": "쯔쯔가무시=가을, 가피(eschar), 털진드기 유충. 혈관내피세포 파괴 → 모든 장기 출혈.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFbAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD1snim88kmnHk/SkPSskMQZoPHalHApM80AOBo6GkHUd6U5yO+KYAWCqcmmnzCATxnoDToyhJJ+bHpS5ZzlutJsBmHzk4o2MQRnrSknOM96XOOOtIB8SrCu7Pz+vpTc5Oc5zTckijtQAucmlxntSYx0p3JHtQAmOeDR9aOntQSTwKAFx0zQcZ6Uo44zk0nI5NADloIJPShTmnZG2mIaTxgdaZjHXk0jMdwAFP2HAxSAYCW4HerkcQiX1aoosIMjrT3cnkH60DCQ559KaCMcn8KYSeeetGOnOTQA/rSEfNjNKO5pMdzigB3TgmmninLzz1oYce9ADcnPNLjGaB+tG00gDjb70gp3GaQ4zzTAOegpOxoPXNKGGKLgBXikzjrSbtzUvbNIA60UdeaQ+nJzTAMZxRznijI78UAcUAOx8vGM0mSKMYxQfWgBf0opM5HFFAiA0deOxprHikJI5PSmhjuFphJz0pDIuOlOjG45YHFMCSNGkYBRzTWTeSASV/nUzvtTZGMAjk9zUQIBpMY5UCDAAGOtIDk+1K2SMUgYdKkQEcbh0poGDmnk/LiozQAvOKXHHSkDDvSjpzQAUpOBSAjmndaAAAE0Y54FBxj3pRwPemAoXnJG urgdorferi는 참진드기(Ixodes)가 매개하며 사람은 우연숙주이다.", "mem": "라임병=참진드기(Ixodes). 쥐벼룩=R.typhi, 털진드기=Orientia, 쥐오줌=Leptospira, 몸이=R.prowazekii/B.recurrentis.", "img": "", "tag": ""}, {"n": 50, "sec": 3, "id": "세균3 20-8", "src": "세균각론3 · 20번", "q": "30대 남자가 자신의 성기에 사마귀 같은 병변이 생겨서 왔다. 한 달 전에 성기 부위에 통증이 없는 궤양이 있었고, 지금은 겨드랑이와 손바닥 등에 구진이 나타나고 발열과 오한도 있다. 이 병의 진단을 위한 선별검사와 확진검사가 맞게 짝지어진 것은?", "opts": ["RPR / VDRL", "VDRL / RPR", "VDRL / FTA-ABS", "FTA-ABS / RPR", "FTA-ABS / VDRL"], "ans": 2, "hint": "무통성 궤양→손바닥 구진/발열 = 2기 매독.", "why": "매독은 비트레포네마 검사(VDRL/RPR)를 선별검사로, 트레포네마 검사(FTA-ABS/TPHA)를 확진검사로 사용.", "mem": "매독 선별=VDRL/RPR(카디오리핀), 확진=FTA-ABS/TPHA/EIA. VDRL/FTA-ABS 짝이 정답.", "img": "", "tag": ""}, {"n": 51, "sec": 3, "id": "세균3 20-9", "src": "세균각론3 · 20번", "q": "40대 남자가 고열, 각막충혈, 근육통 및 기침을 하면 피가 함께 나오는 객혈로 병원에 왔다. 이러한 증상은 늦가을 장마 후 벼베기를 끝내고 2주 후에 나타났다. 현미경응집법을 이용한 혈청학적 검사로 진단 후 항생제로 치료하였다. 원인균의 감염경로는?", "opts": ["쥐벼룩에 물림", "참진드기에 물림", "털진드기에 물림", "몸이의 배설물이 피부 상처에 들어감", "쥐의 오줌에 오염된 물이 눈이나 피부 상처에 들어감"], "ans": 4, "hint": "벼베기+각막충혈+객혈+현미경응집법 = 렙토스피라증.", "why": "Leptospira interrogans는 보균동물(들쥐)의 오줌에 오염된 물이 눈/피부 상처로 들어가 감염. Fletcher/EMJH 배지, 암시야 현미경, MAT.", "mem": "렙토스피라=쥐 오줌 오염수, 각막충혈+폐출혈, MAT(현미경응집). 사람간 전파 안됨.", "img": "", "tag": ""}, {"n": 52, "sec": 3, "id": "세균3 20-10", "src": "세균각론3 · 20번", "q": "28세 여자가 소변 볼 때 불편하고 아랫배가 아프고 질 분비물이 나와 병원에 왔다. 질염이 의심되어 자궁경부를 생리식염수로 적신 면봉으로 도말 후 그람염색하고 초콜릿한천배지와 McCoy 세포에서 배양하였다. 그람염색 후 균은 발견되지 않았고 초콜릿한천배지에서는 배양되지 않았으나 McCoy 세포에서 72시간 배양 후 요오드 염색으로 세포내 봉입체를 확인하였다. 원인균은?", "opts": ["Treponema pallidum", "Neisseria gonorrhoeae", "Chlamydia trachomatis", "Mycoplasma genitalium", "Ureaplasma urealyticum"], "ans": 2, "hint": "McCoy 세포 배양+세포내 봉입체 = Chlamydia trachomatis.", "why": "세포내 기생균이며 세포내 봉입체, 비뇨생식기 감염은 트라코마균의 특징이다.", "mem": "C.trachomatis=절대세포내균, McCoy 배양, 봉입체. 나머지는 세포내 기생균이 아님.", "img": "", "tag": ""}, {"n": 53, "sec": 3, "id": "세균3 21-1", "src": "세균각론3 · 21번", "q": "30대 남자가 자신의 성기에 병변이 생겨서 왔다. 한 달 전 성기부위에 통증이 없는 궤양이 있었고 지금은 겨드랑이와 손바닥 등에 구진이 나타나고 발열과 오한이 있었다. 병변부위 검체에서 뚜렷하게 그람염색되는 균은 관찰되지 않았고, 일반 배지에서도 균이 자라지 않았다. 가장 가능성이 높은 원인균은?", "opts": ["Treponema pallidum", "Mycoplasma genitalium", "Chlamydia trachomatis", "Neisseria gonorrhoeae", "Orientia tsutsugamushi"], "ans": 0, "hint": "무통성 궤양→손바닥 구진/발열, 인공배지 배양 안됨 = 2기 매독(T. pallidum).", "why": "T. pallidum은 인공배지에서 배양되지 않으며 일반 그람염색으로 잘 보이지 않는다(암시야 현미경).", "mem": "매독=T.pallidum, 인공배지 배양 X, 무통성 궤양→2기 손바닥 발진.", "img": "", "tag": ""}, {"n": 54, "sec": 3, "id": "세균3 21-2", "src": "세균각론3 · 21번", "q": "위 병의 진단을 위해 의사가 수행했을 첫번째 진단법은?", "opts": ["McCoy 세포에서 배양", "Acid fast staining", "FTA-ABS", "VDRL", "EIA"], "ans": 3, "hint": "매독 진단의 첫 단계 = 선별검사.", "why": "매독은 비트레포네마 검사(VDRL/RPR)를 선별검사로 먼저 시행한다.", "mem": "매독 첫 검사=선별(VDRL/RPR). FTA-ABS/EIA는 확진. McCoy=클라미디아, AFB=결핵.", "img": "", "tag": ""}, {"n": 55, "sec": 3, "id": "세균3 21-3", "src": "세균각론3 · 21번", "q": "53세 여자가 강원도 산간지방에 캠핑을 다녀온 후 5일째에 미열과 감기증상이 있었다고 한다. 오른 팔에 10cm의 과녁 모양의 유주성 홍반(erythema migrans)이 관찰되었다. 혈액배양 결과는 음성, 혈청검사는 국립보건원에 의뢰하였다. 이 균의 감염경로는?", "opts": ["쥐벼룩에 물림", "참진드기에 물림", "털진드기에 물림", "몸이의 배설물이 피부 상처에 들어감", "쥐의 오줌에 오염된 물이 눈이나 피부 상처에 들어감"], "ans": 1, "hint": "과녁 모양 유주성 홍반 = 라임병(B. burgdorferi).", "why": "B. burgdorferi는 참진드기(Ixodes)가 매개한다.", "mem": "라임병=참진드기, erythema migrans.", "img": "", "tag": ""}, {"n": 56, "sec": 3, "id": "세균3 21-4", "src": "세균각론3 · 21번", "q": "29세 남자가 소변 볼 때에 화끈거리고 농액성 분비물이 나온다고 병원에 왔다. 분비물을 도말염색하니 커피콩 모양의 그람음성 쌍알균이 관찰되었다. 원인균에 대한 설명으로 맞는 것은?", "opts": ["Oxidase 음성", "협막이 항포식작용", "혈액우무배지에서 배양", "Endotoxin 활성이 없는 LOS", "Pili의 항원성 변이로 백신이 없음"], "ans": 4, "hint": "농액성 분비물+커피콩 그람음성 쌍알균 = N. gonorrhoeae.", "why": "임균은 pili의 항원성 변이(antigenic variation) 때문에 효과적인 백신이 없다.", "mem": "임균: oxidase 양성, 초콜릿한천 배양, LOS는 endotoxin 활성 있음, pili 항원변이로 백신 없음. 협막은 수막염균.", "img": "", "tag": ""}, {"n": 57, "sec": 3, "id": "세균3 21-5", "src": "세균각론3 · 21번", "q": "22세 여자가 몇 달 동안 피로, 기침, 식욕부진, 체중감소가 있어 왔다. 기침 시 피가 섞여 나왔고 밤에 식은 땀이 났다. 가슴 X선에서 양쪽 폐 상엽에 하얀 구름모양의 작은 병터가 관찰되었다. 가래 검체로 carbol fuchsin, acid alcohol, methylene blue를 이용한 염색법(항산성 염색)으로 진분홍색의 막대균이 발견되었다. 원인균이 폐 손상을 일으키는 기전은?", "opts": ["세포매개 과민반응 TST 검사", "세균의 독소작용", "체액성 면역반응", "세균 증식에 의한 폐포 폐색", "세균 효소에 의한 기도 상피세포 파괴"], "ans": 0, "hint": "체중감소+객혈+야간발한+항산성균 = 결핵.", "why": "결핵의 폐 손상은 균 자체가 아니라 세포매개 과민반응(type IV hypersensitivity)에 의한 조직 파괴이다.", "mem": "결핵 폐손상=세포매개 과민반응(육아종/건락괴사). 독소 없음.", "img": "", "tag": ""}, {"n": 58, "sec": 3, "id": "세균3 21-6", "src": "세균각론3 · 21번", "q": "2세 남아가 고열, 구토, 뻣뻣한 목으로 응급실에 왔다. 뇌척수액의 그람염색에서 그람음성균이 쌍알균으로 관찰되었다. 이 세균이 다형핵백혈구로부터 탐식되는 것을 보호하는 역할을 하는 이 균의 중요한 병원성 인자는?", "opts": ["Pili", "LOS", "T3SS", "Porin", "Capsule"], "ans": 4, "hint": "소아 수막염+그람음성 쌍알균 = N. meningitidis.", "why": "수막염균의 협막(capsule)이 다형핵백혈구의 탐식으로부터 보호(항포식)한다.", "mem": "수막염균 항포식=다당질 협막. pili/porin/LOS는 다른 인자.", "img": "", "tag": ""}, {"n": 59, "sec": 3, "id": "세균3 21-7", "src": "세균각론3 · 21번", "q": "다음 중 세포내 절대 기생세균이 아닌 것은?", "opts": ["Rickettsia prowazekii", "Orientia tsutsugamushi", "Chlamydia trachomatis", "Mycoplasma pneumoniae", "Coxiella burnetii"], "ans": 3, "hint": "절대세포내 기생균이 아닌 것 찾기.", "why": "Mycoplasma pneumoniae는 자유생활세균(무세포벽)으로 절대세포내 기생균이 아니다.", "mem": "절대세포내균=Rickettsia, Orientia, Chlamydia, Coxiella. Mycoplasma는 자유생활균.", "img": "", "tag": ""}, {"n": 60, "sec": 3, "id": "세균3 21-8", "src": "세균각론3 · 21번", "q": "40대 남자가 고열, 각막충혈, 근육통 및 기침을 하면 피가 함께 나오는 객혈로 병원에 왔다. 이러한 증상은 늦가을 장마 후 벼베기를 끝내고 2주 후에 나타났다. 현미경집법을 이용한 혈청학적 검사를 통해 진단을 내리고 원인균은 fletcher 배지에서 배양할 수 있었다. 이 질환의 원인균의 감염경로는?", "opts": ["쥐벼룩에 물림", "참진드기에 물림", "털진드기에 물림", "몸이의 배설물이 피부 상처에 들어감", "쥐의 오줌에 오염된 물이 눈이나 피부 상처에 들어감"], "ans": 4, "hint": "벼베기+각막충혈+객혈+Fletcher 배지 = 렙토스피라증.", "why": "Leptospira는 보균동물 오줌에 오염된 물이 눈/피부 상처로 들어가 감염된다.", "mem": "렙토스피라=쥐 오줌 오염수, Fletcher/EMJH 배지, 암시야 현미경.", "img": "", "tag": ""}, {"n": 61, "sec": 3, "id": "세균3 21-9", "src": "세균각론3 · 21번", "q": "28세 여자가 소변 볼 때 불편하고 아랫배가 아프고 질 분비물이 나와 병원에 왔다. 자궁경부를 생리식염수로 적신 면봉으로 도말 후 그람염색하고 초콜릿한천배지와 McCoy 세포에서 배양하였다. 그람염색에서 균은 발견되지 않았고 초콜릿한천배지에서도 배양되지 않았으나 McCoy 세포에서 72시간 배양 후 요오드 염색으로 세포내 봉입체를 확인하였다. 원인균의 특성으로 맞지 않는 것은?", "opts": ["LPS가 있다", "망상체로 증식", "대부분 세포에 감염", "기본소체로 감염", "외막이 있다"], "ans": 2, "hint": "McCoy 세포+봉입체 = Chlamydia trachomatis.", "why": "C. trachomatis는 점막상피세포(원주상피)에 친화성이 있어 '대부분의 세포에 감염'이라는 설명은 틀렸다.", "mem": "클라미디아: LPS·외막 있음, 망상체(증식형)/기본소체(감염형) 2형태. 모든 세포 감염 X.", "img": "", "tag": ""}, {"n": 62, "sec": 3, "id": "세균3 21-10", "src": "세균각론3 · 21번", "q": "20대 여성이 가을 산행을 하고 집에 돌아온 지 약 2주 후 가슴과 배에 발진이 생겼고 곧 팔다리로 번졌다. 열이 39도까지 올랐으며 오한, 두통 증상과 함께 기침, 구토, 복통의 증상이 나타났다. 환자의 겨드랑이 사이로 괴사성 검은 가피를 볼 수 있었다. 원인균의 발병기전은?", "opts": ["림프구의 파괴", "폐포세포의 파괴", "뇌신경세포의 파괴", "혈관내피세포의 파괴", "피부상피세포의 파괴"], "ans": 3, "hint": "가을 산행+괴사성 검은 가피 = 쯔쯔가무시병.", "why": "Orientia tsutsugamushi는 전신 혈관 내피세포 파괴(염증)로 미세혈전·미세출혈을 일으킨다.", "mem": "쯔쯔가무시=혈관내피세포 파괴, 가피(eschar).", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFbAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD1snim88kmnHk/SkPSskMQZoPHalHApM80AOBo6GkHUd6U5yO+KYAWCqcmmnzCATxnoDToyhJJ+bHpS5ZzlutJsBmHzk4o2MQRnrSknOM96XOOOtIB8SrCu7Pz+vpTc5Oc5zTckijtQAucmlxntSYx0p3JHtQAmOeDR9aOntQSTwKAFx0zQcZ6Uo44zk0nI5NADloIJPShTmnZG2mIaTxgdaZjHXk0jMdwAFP2HAxSAYCW4HerkcQiX1aoosIMjrT3cnkH60DCQ559KaCMcn8KYSeeetGOnOTQA/rSEfNjNKO5pMdzigB3TgmmninLzz1oYce9ADcnPNLjGaB+tG00gDjb70gp3GaQ4zzTAOegpOxoPXNKGGKLgBXi rans, doxycycline.", "img": "", "tag": ""}, {"n": 68, "sec": 3, "id": "세균3 23-3", "src": "세균각론3 · 23번", "q": "요도염으로 병원에 온 33세 남성이 임질로 진단되었다. 아내의 자궁경부 검사에서도 임균이 검출되었다. 다음 중 임균에 관한 설명으로 맞는 것은?", "opts": ["LOS의 항원성 변이로 백신이 없음", "Endotoxin 활성이 없는 LOS", "혈액우무배지에서 배양", "Capsule이 항포식작용", "Oxidase 양성"], "ans": 4, "hint": "임질 = N. gonorrhoeae.", "why": "임균은 oxidase 양성이다.", "mem": "임균: oxidase 양성, 초콜릿한천 배양(혈액우무 X), LOS endotoxin 활성 있음, pili 항원변이로 백신 없음. 협막은 수막염균.", "img": "", "tag": ""}, {"n": 69, "sec": 4, "id": "바이러스1 20-1", "src": "바이러스각론1 · 20번", "q": "HPV로 인한 자궁경부암에 대한 설명으로 맞는 것은?", "opts": ["암조직을 배양함으로써 HPV를 얻을 수 있다.", "암조직에서 integrated HPV DNA를 확인할 수 있다.", "캡시드 단백을 검출함으로써 암이라 진단할 수 있다.", "Pap smear로 원반 세포가 발견되면 암이라 진단할 수 있다.", "PCR로 16형과 18형이 아닌 형이 검출되면 암이라 진단할 수 없다."], "ans": 1, "hint": "거의 모든 자궁경부암은 삽입된 HPV DNA를 포함한다.", "why": "HPV genome이 E1/E2에서 절단되어 숙주 염색체에 삽입(integration)되어 E6/E7 발현→암화. 암조직에서 integrated HPV DNA 확인 가능.", "mem": "HPV 자궁경부암=integrated DNA. Pap smear 원반세포=감염 진단(암 진단 아님), 16/18 외 형도 암 가능.", "img": "", "tag": ""}, {"n": 70, "sec": 4, "id": "바이러스1 20-2", "src": "바이러스각론1 · 20번", "q": "태어난 지 일주일이 안된 신생아 피부에 수포가 생겼고 중추신경계와 간에 이상 증상을 보였다. 아기의 엄마는 분만 며칠 전에 성기에 아픈 수포가 생겼었다고 하였다. 분만실에서 자궁경부와 질 외벽에서 병변이 확인되었으나 제왕절개를 시도하기에는 너무 늦은 때였다. 의사가 신생아와 엄마에게 투여했을 치료제는?", "opts": ["Imiquimod", "Valacyclovir", "Azidothymidine", "VZ immunoglobulin", "효과적인 치료제가 없음"], "ans": 1, "hint": "신생아 수포+CNS/전신감염+산모 성기 수포 = 신생아 HSV-2 감염.", "why": "HSV 치료제는 acyclovir, valacyclovir, penciclovir, famciclovir 등이다.", "mem": "신생아 HSV=산도 전파, 세포매개면역 미발달로 전신 파급. 치료=acyclovir 계열.", "img": "", "tag": ""}, {"n": 71, "sec": 4, "id": "바이러스1 20-3", "src": "바이러스각론1 · 20번", "q": "54세 에이즈 환자가 기억력 감소와 왼손 마비 증상으로 치료 중 보행장애가 발생하고 갑자기 혼수 상태가 되었다. 뇌 MRI를 통해 양측 대뇌 백질에 병변을 확인하였다. 원인바이러스는?", "opts": ["Smallpox virus", "JC polyomavirus", "Human Herpesvirus 8", "Herpes simplex virus 1", "Human papilloma virus"], "ans": 1, "hint": "AIDS+양측 대뇌 백질 병변+진행성 신경증상 = PML(JC virus).", "why": "JC polyomavirus 감염 AIDS 환자의 약 10%에서 PML(진행다초점백질뇌병증)이 발병한다.", "mem": "PML=JC virus(면역저하 CNS). BK virus=요로감염. HHV8=Kaposi 육종.", "img": "", "tag": ""}, {"n": 72, "sec": 4, "id": "바이러스1 20-4", "src": "바이러스각론1 · 20번", "q": "3인 철종경기에 참석한 30대 여성이 너무 무리한 운동으로 경기 후 피부 분절에 수포성 병변이 나타나 병원에 왔다. 의사는 대상포진으로 진단을 내렸다. 하지만 이 여성은 수두를 앓은 적이 없었다. 가장 적절한 설명은?", "opts": ["이 여성은 VZV에 감염된 적이 있었다.", "이 여성은 VZV 예방접종을 받지 않았다.", "의사는 수두라고 진단을 내렸어야 한다.", "이 여성의 피부병변은 VZV가 초기 감염된 것이다.", "의사는 불충분한 증거로 확실한 진단을 내릴 수 없다."], "ans": 0, "hint": "피부 분절 수포성 병변(대상포진) = 잠복 VZV 재활성화.", "why": "대상포진은 과거 감염된 VZV가 신경절에 잠복했다가 재활성화되어 발생하므로, 이 여성은 과거 VZV에 감염된 적이 있다.", "mem": "대상포진=VZV 재활성화 → 과거 감염 필수. 초기 감염은 수두(전신).", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCADvAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDtBknOad09zTAR2pwrMRx/xWb/AIpG4A/vDNeP2ONnI5r174q4/wCEPuCecuAK8ftjn6eorOZ00di6Dk4FTRndwcetV0z65qzCnc+lSdCL0YOwYphJQHdgUscm0Bc8VHcurJ1/KoAydWm2pxXMTzjdnJzWzqkpAKge1c7IP3hznii5DJFlYvkE4rSt2LFf51iglORwD61pWLM0kfPFUtRI2hE6jI5qe33DikRsKO9SQnGCR0q0iy/BKycEVpQSBkB746Vm7wQpxViKQgccUMqJoJL04JqdHBz2FUY5CpHT8KnWQ+3NRY1RbDrwAOasxMD1qjCN2GzVpDg5yKRVi2rnHAqWJgc54qqJegIqVCSemaTAtA5PH508kjr3quHIIxUw55JpNisPXkEUBexpV6GkJLHBFFwsDADpTM7h/OlbgDmkCb1yOKASGg880rHPTtQVx708L8vUUXHYh++fpQcZ6UpwpJzTSxIpoljH4GMAm "}, {"n": 77, "sec": 4, "id": "바이러스1 20-9", "src": "바이러스각론1 · 20번", "q": "8세 남아가 수영학원 여름캠프에 갔다 온 후 열, 인후통, 두통, 결막염 증상으로 병원에 왔다. 같이 캠프에 참가한 다른 아이들도 유사한 증상을 보였다. 증상은 약 5~7일 지속되고 호전되었다. 원인바이러스는?", "opts": ["Human Herpes virus 6", "Herpes simplex virus", "Epstein-Barr virus", "Parvovirus B19", "Adenovirus"], "ans": 4, "hint": "수영장+인두결막열(열+인후통+결막염) = Adenovirus.", "why": "Adenovirus는 인두결막열(수영장 결막염), 급성호흡기질환 등을 일으킨다.", "mem": "수영장 인두결막열=Adenovirus. HHV-6=돌발진, Parvovirus B19=감염홍반.", "img": "", "tag": ""}, {"n": 78, "sec": 4, "id": "바이러스1 20-10", "src": "바이러스각론1 · 20번", "q": "6세 여아가 열, 두통, 근육통 등 비특이 증상 후 1주일 정도 뒤에 마치 뺨을 맞은 것처럼 명확한 발진이 양쪽 뺨에 생기면서 전신으로 퍼지는 반구진 발진(maculopapular rash)으로 병원에 왔다. 함께 방문한 엄마는 양쪽 손 관절에 심한 관절통과 부종을 호소하였다. 의사는 감염된 바이러스에 대한 항체 생성에 따른 면역복합체 형성에 의해 초래되었다고 설명하였다. 감염된 바이러스는?", "opts": ["Human Herpes virus 6", "Herpes simplex virus", "Epstein-Barr virus", "Parvovirus B19", "Adenovirus"], "ans": 3, "hint": "뺨 맞은 듯한 발진(slapped cheek)+관절통+면역복합체 = Parvovirus B19.", "why": "Parvovirus B19에 의한 감염홍반(제5발진질병)은 양 뺨 발진→전신, 성인 관절통, 면역복합체 기전.", "mem": "감염홍반(제5병)=Parvovirus B19, slapped cheek, 면역복합체.", "img": "", "tag": ""}, {"n": 79, "sec": 4, "id": "바이러스1 21-1", "src": "바이러스각론1 · 21번", "q": "8세 남아가 수영학원에서 주최하는 여름캠프에 갔다 온 후 열, 인후통, 두통, 결막염 증상으로 병원에 왔다. 같이 캠프에 참가한 다른 아이들도 유사한 증상을 보였다. 증상은 약 5~7일 정도 지속되고 호전되었다. 원인체는 ds DNA genome을 가지는 바이러스였다. 이 바이러스의 특징이 아닌 것은?", "opts": ["Linear genome", "Enveloped virus", "Viral DNA pol", "Virus release by cell lysis", "Fiber protein이 cell attachment protein"], "ans": 1, "hint": "수영장 인두결막열+dsDNA = Adenovirus.", "why": "Adenovirus는 envelope이 없는 naked capsid virus이다. Enveloped라는 설명이 틀렸다.", "mem": "Adenovirus=naked, linear dsDNA, terminal protein, fiber=부착, cell lysis로 방출.", "img": "", "tag": ""}, {"n": 80, "sec": 4, "id": "바이러스1 21-2", "src": "바이러스각론1 · 21번", "q": "6세 여아가 열, 두통, 근육통 등 비특이 증상 후 1주일 정도 뒤에 마치 뺨을 맞은 것처럼 명확한 발진이 양쪽 뺨에 생기면서 전신으로 퍼지는 반구진 발진으로 병원에 왔다. 함께 방문한 엄마는 양쪽 손 관절에 심한 관절통과 부종을 호소하였다. 의사는 남자 아이와 엄마의 증상은 어떤 기작에 의한 것인가?", "opts": ["바이러스의 세포파괴", "세포매개면역반응", "Cytokine storm", "Syncytia 형성", "면역복합체"], "ans": 4, "hint": "slapped cheek+관절통 = Parvovirus B19 감염홍반.", "why": "발진과 관절통은 바이러스에 대한 항체가 형성한 면역복합체(immune complex)에 의한 것이다.", "mem": "감염홍반 2단계 증상=면역복합체(항체 매개). 세포매개 아님.", "img": "", "tag": ""}, {"n": 81, "sec": 4, "id": "바이러스1 21-3", "src": "바이러스각론1 · 21번", "q": "수두와 대상포진에 대한 설명으로 맞는 것은?", "opts": ["어린이가 어른보다 더 심각한 수두 증상을 보인다.", "어린이가 어른보다 대상포진에 걸리기 쉽다.", "대상포진 후에 신경통이 생기기도 한다.", "수두는 피부 분절에 발진이 나타난다.", "대상포진은 수두보다 전염성이 높다."], "ans": 2, "hint": "수두-대상포진 임상 비교.", "why": "대상포진 환자의 약 30%에서 대상포진후신경통(만성통증증후군)이 나타난다.", "mem": "대상포진후신경통 O. 어른이 더 심한 수두, 어른이 대상포진 잘 걸림, 대상포진은 분절성(수두는 전신), 수두가 전염성 높음.", "img": "", "tag": ""}, {"n": 82, "sec": 4, "id": "바이러스1 21-4", "src": "바이러스각론1 · 21번", "q": "2022년 monkey pox의 outbreak가 여러 나라에서 일어났다. Monkeypox를 일으키는 바이러스의 특징으로 맞지 않는 것은?", "opts": ["세포질에서 조립", "Genome이 dsDNA", "핵에서 genome 복제", "Viral DNA polymerase로 DNA 생성", "Viral RNA polymerase로 mRNA 생성"], "ans": 2, "hint": "Monkeypox = Poxviridae.", "why": "Poxvirus는 viral polymerase와 DNA-dependent RNA polymerase를 가져 세포질에서 복제·전사한다. '핵에서 복제'가 틀렸다.", "mem": "Poxvirus=세포질 복제(예외적 DNA virus). dsDNA, viral DNA pol·RNA pol 보유.", "img": "", "tag": ""}, {"n": 83, "sec": 4, "id": "바이러스1 21-5", "src": "바이러스각론1 · 21번", "q": "36세 여성이 자궁경부암으로 진단되었다. 옳지 않은 것은?", "opts": ["각질층에서 바이러스가 방출된다", "종양유전자인 E6, E7이 계속 발현된다", "Pap smear에서 세포의 형성 이상이 발견된다", "HPV 16형 또는 18형에 감염이 되었을 가능성이 높다", "HPV genome이 세포의 염색체에 삽입이 되었을 것이다."], "ans": 0, "hint": "자궁경부암 = HPV(주로 16/18형).", "why": "각질층에서 바이러스가 조립·방출되는 것은 피부 HPV(사마귀) 기전이며, 자궁경부암은 점막 HPV로 genome integration·E6/E7 발현이 특징.", "mem": "자궁경부암=integration, E6(p53분해)/E7(pRB분해) 발현. 각질층 방출은 사마귀(생산성 감염).", "img": "", "tag": ""}, {"n": 84, "sec": 4, "id": "바이러스1 21-6", "src": "바이러스각론1 · 21번", "q": "운동을 하지 않던 20대 여성이 산행을 다녀오고 아래와 같은 물집이 입 주변에 생겼다. 이 원인바이러스와 바이러스가 잠복하였을 기관은?", "opts": ["VAV, dorsal root ganglia", "HSV-1, trigeminal ganglia", "HSV-1, Dorsal root ganglia", "HSV-2, trigeminal ganglia", "HSV-2
