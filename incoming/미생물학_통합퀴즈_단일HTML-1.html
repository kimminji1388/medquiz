sviridae에 속하는 HSV와 VZV가 다른 점은?", "opts": ["잠복세포", "병터특징 (병터의 범위)", "초기 감염 타겟 세포", "항바이러스제", "주 전파경로"], "ans": 4, "hint": "HSV vs VZV 차이점(중복정답 2,5 인정).", "why": "HSV는 수포액·침·질액 등 체액으로 전파되고, VZV는 주로 호흡(비말)으로 전파된다(주 전파경로 차이). 병터 범위도 차이.", "mem": "HSV: 국소 병터·체액 전파. VZV: 전신 수두·호흡 전파. (병터범위·전파경로 차이, 중복정답 인정)", "img": "", "tag": ""}, {"n": 87, "sec": 4, "id": "바이러스1 21-9", "src": "바이러스각론1 · 21번", "q": "54세 에이즈 환자가 기억력 감소와 왼손 마비 증상으로 치료 중 보행장애가 발생하고 갑자기 혼수 상태가 되었다. 뇌 MRI를 통해 양측 대뇌 백질에 병변을 확인하였다. 원인체는 dsDNA genome을 가지는 바이러스였다. 이 바이러스 특징이 아닌 것은?", "opts": ["Syncytia 형성", "Naked capsid virus", "Circular genome", "핵에서 genome 복제", "항체가 감염 제어에 중요"], "ans": 0, "hint": "AIDS+백질 병변+dsDNA = JC polyomavirus(PML).", "why": "JC virus(naked, circular dsDNA, 핵에서 복제)는 syncytia를 형성하지 않는다(syncytia는 HSV 등).", "mem": "JC virus=naked, circular dsDNA, 핵 복제, 항체 중요. Syncytia는 enveloped(HSV) 특징.", "img": "", "tag": ""}, {"n": 88, "sec": 4, "id": "바이러스1 21-10", "src": "바이러스각론1 · 21번", "q": "떨림, 간헐적 근육경련 및 운동 조정상실이 있는 65세 여자환자가 급속한 진행성 치매로 병원에 왔다. 뇌척수액과 혈청에서 세균 및 바이러스 감염 검사 결과는 음성이었다. 원인체에 대한 설명으로 올바른 것은?", "opts": ["면역반응으로 인터페론이 생산된다.", "뇌에서 지속적인 염증반응을 일으킨다.", "스펀지같이 구멍이 난 뇌 피질을 생성한다.", "단백분해효소에 의하여 병원성이 상실된다.", "15분간의 고압증기멸균에서 병원성이 상실된다."], "ans": 2, "hint": "진행성 치매+운동실조+세균/바이러스 음성 = 프리온(해면상뇌병증).", "why": "프리온은 해면상(spongiform) 공포화로 구멍이 난 뇌 피질을 만든다.", "mem": "프리온: 핵산 없음(인터페론·염증 없음), 단백분해효소·고압증기멸균에 저항, 해면상 변화.", "img": "", "tag": ""}, {"n": 89, "sec": 4, "id": "바이러스1 22-3", "src": "바이러스각론1 · 22번", "q": "사람면역결핍바이러스(HIV)에 감염된 65세 남자가 1개월 이상 지속된 설사와 체중감소로 병원을 찾았다. 혈액검사 결과 ml당 CD4+ T 세포의 수가 150/uL이었다. 임상단계는?", "opts": ["감염초기", "무증상기", "AIDS 환자기", "중간기", "회복기"], "ans": 2, "hint": "HIV+CD4 150/uL = AIDS.", "why": "CD4+ T세포 수가 200/uL 이하이면 AIDS로 진단한다(150/uL → AIDS 환자기).", "mem": "CD4<200/uL=AIDS 진단 기준.", "img": "", "tag": ""}, {"n": 90, "sec": 4, "id": "바이러스1 22-7", "src": "바이러스각론1 · 22번", "q": "23세 여성이 목이 붓고 침 삼키기 어려운 증상으로 이비인후과를 찾았다. 일주일 동안 열, 피로감과 인후통이 있었고 검진 결과 편도와 경부 림프선과 비장이 커져 있었다. 피검사에서 비정형 림프구가 발견되었고 이종항체검사에서 양성을 보였다. 이러한 증상은 원인 바이러스가 어떤 세포를 감염시켜 나타난 것인가? (증가된 세포)", "opts": ["T cell", "B cell", "표피세포", "신경세포", "콘포식세포"], "ans": 1, "hint": "전염성단핵구증(EBV)+이종항체 양성+비정형 림프구.", "why": "EBV는 B세포를 감염시키며, 이에 대한 면역반응으로 비정형 림프구(반응성 T세포)가 증가한다. 감염 표적은 B세포.", "mem": "전염성단핵구증=EBV가 B세포 감염. 비정형림프구는 반응성 T세포(이종친화항체 양성).", "img": "", "tag": ""}, {"n": 91, "sec": 4, "id": "바이러스1 22-8", "src": "바이러스각론1 · 22번", "q": "50세 남자가 만성백혈병으로 골수이식을 받은 후 회복 중, 3주 차에 갑자기 열이 나고 비장비대와 비정형림프구가 나타났다. 폐렴 증상이 발병하여 중환자실에 입원하였고 항생제를 투여받았다. 혈액검사에서 이종친화항체는 나타나지 않았다. 간염증상이 보였으나 간염바이러스는 발견되지 않았다. 조직 검체에서 핵내봉입체가 있는 세포가 발견되었다. 가장 가능성이 높은 원인 바이러스는?", "opts": ["VZV", "EBV", "CMV", "JC virus", "Adenovirus"], "ans": 2, "hint": "골수이식(면역저하)+이종친화항체 음성+핵내봉입체+폐렴/간염 = CMV.", "why": "CMV는 면역저하자에서 폐렴·간염을 일으키며 Owl's eye(핵내봉입체)가 특징. 이종친화항체 음성으로 EBV와 감별.", "mem": "면역저하+핵내봉입체(Owl's eye)+이종친화항체 음성=CMV. EBV는 이종친화항체 양성.", "img": "", "tag": ""}, {"n": 92, "sec": 4, "id": "바이러스1 22-9", "src": "바이러스각론1 · 22번", "q": "8개월 여아가 갑자기 고열이 나서 병원에 왔다. 의사 진찰에서 상기도 감염, 수막염, 뇌염의 징후는 없었다. 이틀 후 여아는 고열 발작을 해서 다시 병원에 왔는데, 병원에서 체온을 재보니 열은 떨어져 있었다. 이를 후 아이 전신에 발진이 나타났다. 원인 바이러스와 진단명은?", "opts": ["Human herpesvirus 7, 돌발진", "Human herpesvirus 8, Kaposi 육종", "Human herpesvirus 6, 제5발진질병", "Parvovirus B19, 감염홍반", "Varicella zoster virus, 수두"], "ans": 0, "hint": "영아 고열 3~4일→해열 후 발진 = 돌발진(HHV-6/7).", "why": "돌발진(exanthem subitum)은 고열이 수일 지속 후 해열되면서 발진이 나타나며, HHV-6 또는 HHV-7이 원인.", "mem": "돌발진=HHV-6/7. 고열 후 해열되며 발진. HHV-6은 제6발진질병(제5병은 Parvovirus B19).", "img": "", "tag": ""}, {"n": 93, "sec": 4, "id": "바이러스1 23-1", "src": "바이러스각론1 · 23번", "q": "30세의 여성이 정기적인 검사로 파파니콜로염색검사(pap smear)를 하였는데 자궁경부 형성이상이 확인되었다. In situ hybridization 검사로 HPV 16형이 형성이상세포에서 관찰되었다. 다음 중 HPV가 암으로 발전되기 위해 필요한 과정은?", "opts": ["HPV의 E6, E7의 비활성", "HPV genome의 숙주 염색체 삽입", "기저층에서의 HPV genome replication", "각질층에서의 HPV 입자 방출", "HPV late gene의 활성"], "ans": 1, "hint": "HPV 자궁경부암 발전 과정.", "why": "HPV genome의 숙주 염색체 삽입(integration)이 E6/E7 종양유전자 과발현을 일으켜 암으로 진행한다.", "mem": "HPV 암화=genome integration→E6(p53)/E7(pRB) 활성. late gene/입자방출은 생산성 감염(비암성).", "img": "", "tag": ""}, {"n": 94, "sec": 4, "id": "바이러스1 23-4", "src": "바이러스각론1 · 23번", "q": "산업 현장에서 근무하는 한 환자가 뚜렷한 결막하 출혈, 안와 주위 부종, 각막염에 합당한 각막 소견을 보여 안과를 방문했다. 환자는 심한 광과민과 눈에 이물감을 호소하였다. 7일 후 동일한 작업장에서 근무하던 다른 근로자 9명에서도 유사한 증상이 발생하였다. 가장 가능성 있는 병원체는?", "opts": ["HSV 1", "BK virus", "Adenovirus", "Parvovirus B19", "CMV"], "ans": 2, "hint": "집단 발생 각결막염(유행성) = Adenovirus.", "why": "유행성 각결막염은 Adenovirus가 원인이며 집단 발생이 특징이다.", "mem": "유행성 각결막염=Adenovirus, 집단 발생. HSV는 수지상 각막염(개별).", "img": "", "tag": ""}, {"n": 95, "sec": 5, "id": "바이러스2 20-1", "src": "바이러스각론2 · 20번", "q": "6개월된 남자 아기가 물설사를 5일동안 하였다. 가끔씩 구토도 하였으나 변에 피나 농은 발견되지 않았다. 아기는 탈수 증상을 보였다. 이 집에 놀러왔던 가족의 아기도 같은 증상으로 병원에 갔다고 한다. 가장 가능성이 높은 바이러스의 특징으로 맞는 것은?", "opts": ["+RNA genome", "Enveloped virus", "Budding으로 방출", "불활성화 백신이 있음", "자연감염은 재감염을 막을 수 없음."], "ans": 4, "hint": "영아 물설사+탈수+가족 전파 = Rotavirus.", "why": "Rotavirus는 naked virus라 항체가 충분한 면역을 주지 못해 자연감염이 재감염을 막을 수 없다.", "mem": "Rotavirus=dsRNA, naked, lysis 방출, 경구용 생백신(로타텍/로타릭스), 재감염 가능.", "img": "", "tag": ""}, {"n": 96, "sec": 5, "id": "바이러스2 20-2", "src": "바이러스각론2 · 20번", "q": "45세 남자가 친구들과 함께 10일간의 지중해 선상여행을 다녀온 직후 갑자기 구역질, 구토, 복통과 심한 물설사가 있었다. 열은 없었고 친구들도 비슷한 증상을 보였다. 원인바이러스를 진단할 수 있는 방법이 아닌 것은?", "opts": ["바이러스 배양 후 CPE 관찰", "Electron microscopy", "Latex agglutination", "RT-PCR", "ELISA"], "ans": 0, "hint": "선상여행+집단 물설사+무열 = Norovirus.", "why": "Norovirus는 다른 calicivirus와 달리 배양이 되지 않으므로 배양 후 CPE 관찰이 불가능하다.", "mem": "Norovirus=배양 불가(CPE 관찰 X). EM/latex agglutination/RT-PCR/ELISA로 진단 가능.", "img": "", "tag": ""}, {"n": 97, "sec": 5, "id": "바이러스2 20-3", "src": "바이러스각론2 · 20번", "q": "7월 말경 65세 남자가 갑작스런 고열로 왔다. 전신 권태, 인후통으로 시작하여 욕지기, 구토가 있다가 목 근육의 강직이 왔으며 의식이 혼미하여졌다. 최근 외국은 다녀온 적이 없다고 하였다. 원인 병원체는 외피가 있는 RNA 바이러스였다. 원인바이러스의 감염경로는?", "opts": ["공기전파(air borne)", "성접촉(sexual contact)", "설치류 매개(rodent borne)", "대변-구강 경로(fecal-oral route)", "절지동물 매개(arthropod borne)"], "ans": 4, "hint": "여름+뇌염+외피 RNA virus+해외력 없음 = 일본뇌염(Arbovirus).", "why": "Arbovirus(일본뇌염)는 절지동물(집모기)에 의해 매개된다.", "mem": "일본뇌염=절지동물(모기) 매개, 여름. 외피 RNA virus라 장관에서 생존 어려움(fecal-oral 아님).", "img": "", "tag": ""}, {"n": 98, "sec": 5, "id": "바이러스2 20-4", "src": "바이러스각론2 · 20번", "q": "5세 남아가 3~4일간 지속되는 재채기, 콧물, 코막힘, 경미한 인후통, 두통으로 병원에 왔다. 이러한 증상을 유발한 원인체는 양성극성의 단일가닥 RNA 외피비보유바이러스로 밝혀졌다. 가장 가능성이 높은 원인체는?", "opts": ["Poliovirus", "Rhinovirus", "Adenovirus", "Coronavirus", "Coxsackievirus"], "ans": 1, "hint": "감기증상+(+)ssRNA+naked = Rhinovirus.", "why": "Rhinovirus는 감기와 상기도 감염의 가장 흔한 원인체이다.", "mem": "감기=Rhinovirus(naked +ssRNA). Adenovirus=DNA, Coronavirus=enveloped, Coxsackie=수족구/발진.", "img": "", "tag": ""}, {"n": 99, "sec": 5, "id": "바이러스2 20-5", "src": "바이러스각론2 · 20번", "q": "50세 남자가 동남아 여행에서 돌아오고 일주일 후에 심한 고열과 구토로 병원에 왔다. 처음에 일시적으로 붉은 반점이 몸통에 나타나다가 3~4일 후에는 해열과 함께 다시 두 번째 발진이 얼굴과 손발로 확산되고 심한 근육통과 뼈의 통증이 동반하였다. 이 남자가 이와 관련된 질환에 다시 걸리지 않도록 하려면?", "opts": ["평상시에 모기에 물리지 않도록 해야한다.", "동남아 여행에서 동물원에 가지 않도록 한다.", "사람이 많은 공간에서는 마스크를 써야 한다.", "면역이 생겼으므로 특별한 주의가 필요하지 않는다.", "동남아 여행을 갔을 때 모기에 물리지 않도록 해야한다."], "ans": 4, "hint": "동남아+고열+뼈 통증(breakbone) = 뎅기열(dengue).", "why": "뎅기 백신이 국내에 없고 다른 혈청형 재감염은 더 심한 뎅기출혈열을 일으키므로, 발생국가 여행 시 모기에 물리지 않는 것이 핵심.", "mem": "뎅기열=이집트숲모기(국내X), 백신 없음, 재감염 시 더 위험(비중화항체). 여행지 모기 회피.", "img": "", "tag": ""}, {"n": 100, "sec": 5, "id": "바이러스2 20-6", "src": "바이러스각론2 · 20번", "q": "인도에 설립한 의료선교병원에서 급성 이완성 마비로 입원한 아이들을 진료하고 있었다. 이 병은 고열, 구토, 심한 두통으로 시작하여 목 강직, 근육통과 근육에 힘이 없어지고 변비 증상을 가진다. 파견된 의료진은 특별한 보호장비를 하지 않았는데 아무도 감염되지 않았다. 그 이유로 가장 적절한 것은?", "opts": ["JEV 백신을 맞았기 때문", "IPV 백신을 맞았기 때문", "한국에서 가져간 생수를 마셨기 때문", "모기 기피제를 뿌리며 생활했기 때문", "인도인에게만 감염시키는 바이러스이기 때문"], "ans": 1, "hint": "급성 이완성 마비 = 폴리오(poliovirus).", "why": "한국 의료진은 IPV(주사용 사백신) 접종률이 95% 이상이라 폴리오에 감염되지 않았을 가능성이 높다.", "mem": "폴리오=IPV 백신. 분변-입 전파, 인간만 숙주. 생수만으로는 호흡기 전파 배제 불가.", "img": "", "tag": ""}, {"n": 101, "sec": 5, "id": "바이러스2 20-7", "src": "바이러스각론2 · 20번", "q": "어린이집에 다니는 3세 여아가 열이 나고 칭얼거리고 음식을 먹지 않았다. 입안을 보니 수포가 있었고 손과 발에도 비슷한 수포를 관찰할 수 있었다. 다음 중 원인바이러스에 대해 맞게 설명한 것은?", "opts": ["면역병리가 증상의 주 원인이다.", "산성에 강해서 장관계를 감염시킬 수 있다.", "감염이 된 사이트에서 바로 증상을 일으킨다.", "이 바이러스의 수용체는 상피세포에 특이적으로 있다.", "세포매개면역반응이 바이러스 억제에 주된 역할을 한다."], "ans": 1, "hint": "수족구병(입+손발 수포) = Coxsackievirus.", "why": "Coxsackievirus(enterovirus)는 산성에 강해 장관계를 통과/감염할 수 있다.", "mem": "Coxsackie=수족구, naked, 산 저항성. 세포용해가 증상 주원인(면역병리 X), 항체가 주 방어(naked).", "img": "", "tag": ""}, {"n": 102, "sec": 5, "id": "바이러스2 20-8", "src": "바이러스각론2 · 20번", "q": "예정일보다 3주 일찍 태어난 신생아가 소리에 반응하지 않았다. 산모는 임신 4주째 얼굴, 목, 등에 연한 반점상 발진이 있었고 미열, 감기 비슷한 증상과 손/무릎 관절 경직이 있었지만 출산 전까지 치료를 받지 않았다. 산모는 어린시절 백신접종을 불규칙하게 받았다. 가장 가능성이 높은 바이러스가 속한 family는?", "opts": ["Herpesviridae", "Parvoviridae", "Togaviridae", "Flaviviridae", "Picornaviridae"], "ans": 2, "hint": "선천성 감염(난청)+산모 발진/관절염 = 풍진(Rubella).", "why": "Rubella virus는 Togaviridae에 속하며 선천성 풍진증후군(난청 등)을 일으킨다.", "mem": "풍진=Togaviridae, 선천성 풍진증후군(난청·심장기형). MMR 백신.", "img": "", "tag": ""}, {"n": 103, "sec": 5, "id": "바이러스2 20-9", "src": "바이러스각론2 · 20번", "q": "34세 남자가 수개월간 지속된 피로, 체중감소, 설사 및 야간 발한(night sweat)으로 왔다. 신체진찰에서 림프절 종대가 있었으며, 구강에는 효모균 감염(아구창)이 의심되는 병변이 관찰되었다. 원인 바이러스의 감염경로는?", "opts": ["공기전파(air borne)", "성접촉(sexual contact)", "설치류 매개(rodent borne)", "대변-구강 경로(fecal-oral route)", "절지동물 매개(arthropod borne)"], "ans": 1, "hint": "만성 피로+체중감소+림프절종대+아구창 = HIV.", "why": "HIV는 성접촉으로 전염되는 대표적 바이러스이다.", "mem": "HIV=성접촉 전파. 면역저하로 기회감염(구강 칸디다증/아구창).", "img": "", "tag": ""}, {"n": 104, "sec": 5, "id": "바이러스2 20-10", "src": "바이러스각론2 · 20번", "q": "71세 여성이 38℃ 이상의 고열과 두통, 전신 권태, 근육통과 기침으로 왔다. 숨이 차고 호흡이 곤란하였다. 가슴 X선에서 폐 침윤의 폐렴 소견을 보였다. 객담 검사에서 세균배양은 음성, 코로나 RT-PCR에서 양성이었다. 원인 바이러스에 관한 설명으로 옳지 않은 것은?", "opts": ["주로 비말을 통해 전파된다.", "CPE로 syncytia를 확인할 수 있다.", "상기도, 하기도, 위장관이 target 기관이다.", "Spike glycoprotein은 tissue tropism에 영향을 미친다.", "Early gene product로는 RNA dependent RNA polymerase가 있다."], "ans": 1, "hint": "코로나(SARS-CoV-2) 폐렴.", "why": "Coronavirus는 ER에서 budding/exocytosis로 방출되어 cell lysis를 하지 않으므로 CPE인 syncytia를 확인하기 어렵다.", "mem": "Coronavirus=exocytosis 방출(lysis X)→syncytia CPE 어려움. Spike=tissue tropism(ACE2), RdRp=early gene.", "img": "", "tag": ""}, {"n": 105, "sec": 5, "id": "바이러스3 20-1", "src": "바이러스각론3 · 20번", "q": "떨림, 간헐적 근육경련 및 운동 조정상실이 있는 65세 여자환자가 급속한 진행성 치매로 병원에 왔다. 뇌척수액과 혈청에서 세균 및 바이러스 감염 검사는 음성이었다. 편도선 생검조직의 웨스턴블롯으로 원인체를 확인할 수 있었다. 원인체에 대한 설명으로 올바른 것은?", "opts": ["감염성 병원체이다.", "면역반응으로 인터페론이 생산된다.", "감염된 세포에서 봉입체가 발견된다.", "단백분해효소에 의하여 병원성이 상실된다.", "15분간의 고압증기멸균에서 병원성이 상실된다."], "ans": 0, "hint": "진행성 치매+운동실조+세균/바이러스 음성+편도선 생검 = 프리온.", "why": "프리온은 핵산 없이 단백질로만 구성된 감염성 병원체이다.", "mem": "프리온=단백질 감염체. 인터페론·봉입체 없음, 단백분해효소·고압증기멸균(15분) 저항(autoclave 1시간 필요).", "img": "", "tag": ""}, {"n": 106, "sec": 5, "id": "바이러스3 20-2A", "src": "바이러스각론3 · 20번", "q": "3세 된 남아가 기침, 콧물, 결막염 증세로 병원에 왔다. 신체진찰에서 구강의 볼 점막 안 홍반에 회백색의 중심부가 존재하는 반점(Koplik spot)이 관찰되었다. 환아는 2~3일 후 피부에 발진이 났다. 원인 바이러스의 특징이 아닌 것은?", "opts": ["Syncytia를 만들 수 있다.", "적혈구를 응집시킬 수 있다.", "핵에서 genome 복제가 일어난다.", "세포막에서 budding으로 방출된다.", "단일가닥 -RNA genome을 갖는다."], "ans": 2, "hint": "Koplik spot+3C(기침·콧물·결막염)+발진 = 홍역(Measles).", "why": "홍역(Paramyxoviridae)은 세포질에서 genome 복제가 일어난다(핵 아님). Influenza 외 RNA virus는 세포질 복제.", "mem": "홍역=Paramyxoviridae, 세포질 복제, syncytia, HA(적혈구응집), budding, -ssRNA.", "img": "", "tag": ""}, {"n": 107, "sec": 5, "id": "바이러스3 20-2B", "src": "바이러스각론3 · 20번", "q": "45세 남자의 정기건강검진에서 얻은 혈청검사 결과는 HBsAg(-), Anti-HBs(+), HBeAg(-), total anti-HBc(+)이었다. 이 남자의 현재 상태는?", "opts": ["급성 B형 간염", "백신투여 건강인", "활동성 만성 B형 간염", "감염 후 회복된 건강인", "비활동성 만성 B형 간염"], "ans": 3, "hint": "HBsAg(-), Anti-HBs(+), anti-HBc(+) 해석.", "why": "HBsAg(-)로 감염 중 아님, Anti-HBs(+)+anti-HBc(+)는 자연감염 후 회복을 의미.", "mem": "감염 후 회복=anti-HBs(+)+anti-HBc(+). 백신 접종자는 anti-HBc 음성.", "img": "", "tag": ""}, {"n": 108, "sec": 5, "id": "바이러스3 20-3", "src": "바이러스각론3 · 20번", "q": "2세와 4세 남매가 열, 코막힘, 목아픔을 호소하다가 둘다 컹컹거리는 기침과 목이 쉬어서 병원에 왔다. 청진에서 가슴에 쌕쌕거리는 소리를 확인할 수 있었다. 가장 가능성이 높은 바이러스는?", "opts": ["Hantavirus", "Influenza virus", "Metapneumovirus", "Parainfluenza virus", "Respiratory syncytial virus"], "ans": 3, "hint": "컹컹거리는 기침(barking, croup) = Parainfluenza virus.", "why": "Croup(barking seal cough)은 Parainfluenza virus의 대표적 특징이다.", "mem": "Croup(컹컹 기침)=Parainfluenza. RSV도 하기도 감염하나 barking이 감별점.", "img": "", "tag": ""}, {"n": 109, "sec": 5, "id": "바이러스3 20-4", "src": "바이러스각론3 · 20번", "q": "2개월 영아가 2월에 세기관지염으로 병원에 입원하였다. 아이는 호흡곤란으로 위중한 상태였다. 의사가 처방하였을 약제는?", "opts": ["약독화 생백신", "Palivizumab", "Amoxicillin", "IFN-alpha", "Ribavirin"], "ans": 4, "hint": "겨울+영아 세기관지염+위중 = RSV.", "why": "RSV로 입원한 위중한 유아에게는 ribavirin 흡인 치료가 도움이 된다.", "mem": "RSV 위중=ribavirin 치료. Palivizumab=고위험군 '예방'(단클론항체). 백신 없음.", "img": "", "tag": ""}, {"n": 110, "sec": 5, "id": "바이러스3 20-5", "src": "바이러스각론3 · 20번", "q": "40세 남자가 9월에 벌초 후에 발열, 오한, 두통이 나타나고 안면홍조와 출혈반점이 있어 병원에 왔다. 발열 후 5일경에 혈압저하가 나타나 3일간 지속되며, 신부전으로 인한 질소혈증, 심한 단백뇨가 동반되었다. 원인 바이러스의 특징이 아닌 것은?", "opts": ["쥐가 자연 숙주", "외피보유바이러스", "골지에서 외피 얻음", "작은소참진드기 매개", "분절로 이루어진 RNA genome"], "ans": 3, "hint": "벌초+신부전+출혈 = 신증후군출혈열(Hantavirus).", "why": "Hantavirus는 쥐(설치류)가 매개하며, 작은소참진드기 매개는 SFTS virus이다.", "mem": "Hantavirus=설치류 매개. 작은소참진드기=SFTS. 둘 다 Bunyavirales(외피, 골지에서 외피, 분절 -RNA).", "img": "", "tag": ""}, {"n": 111, "sec": 5, "id": "바이러스3 20-6", "src": "바이러스각론3 · 20번", "q": "2009년 전세계적으로 유행한 H1N1 독감(돼지독감) 바이러스는 항원 대변이를 통해 만들어진 새로운 바이러스였다. 이것이 가능하게 한 influenza virus의 특성은?", "opts": ["다핵거대세포 형성 능력", "외부 유전자를 받는 M2 channel", "변이가 쉽게 일어나는 RNA genome", "절편(segment)으로 이루어진 genome", "바이러스간 융합을 가능하게 하는 외피 당단백"], "ans": 3, "hint": "항원 대변이(antigenic shift) 기전.", "why": "Influenza는 절편화된 RNA를 가져 유전자 재편성(reassortment)으로 항원 대변이를 일으킬 수 있다.", "mem": "항원 대변이(shift)=segment reassortment. 점변이(drift)는 RNA genome 변이.", "img": "", "tag": ""}, {"n": 112, "sec": 5, "id": "바이러스3 20-7", "src": "바이러스각론3 · 20번", "q": "성질이 난폭했던 야생너구리에게 물린 사람이 병원에 왔다. 적절한 조치에 해당하는 것은?", "opts": ["깊이 물린 상처는 봉합", "표면적 상처는 얇게 절개", "비누와 물로 상처를 세척", "HRIG(면역글로불린)을 IV 주입", "물린 부위에 광견병 백신 접종"], "ans": 2, "hint": "광견병 의심 교상 후 조치.", "why": "상처를 비누와 물로 잘 씻어내는 것이 적절하다(항바이러스 물질/알코올/포비돈 소독).", "mem": "광견병 노출 후: 상처 비누+물 세척, HRIG는 물린 부위+근육(IV 아님), 백신은 삼각근/대퇴(물린 부위 아님), 봉합 피함.", "img": "", "tag": ""}, {"n": 113, "sec": 5, "id": "바이러스3 20-8", "src": "바이러스각론3 · 20번", "q": "36세 여자가 등산에 갔다 온 후에 고열, 피로, 식욕 저하, 구토, 설사, 복통 등의 증상이 나타나고 백혈구와 혈소판이 감소하여서 입원하였다. 원인 바이러스의 특징이 아닌 것은?", "opts": ["쥐가 자연 숙주", "외피보유바이러스", "골지에서 외피 얻음", "작은소참진드기 매개", "분절로 이루어진 RNA genome"], "ans": 0, "hint": "등산+위장염+백혈구/혈소판 감소 = SFTS.", "why": "SFTS는 작은소참진드기가 매개하며 쥐(설치류) 매개는 Hantavirus이다('쥐가 자연 숙주'가 틀림).", "mem": "SFTS=작은소참진드기 매개, 혈소판/백혈구 감소. Hantavirus=쥐. 둘 다 Bunyavirales(외피·골지·분절 -RNA).", "img": "", "tag": ""}, {"n": 114, "sec": 5, "id": "바이러스3 20-9", "src": "바이러스각론3 · 20번", "q": "17세 남자가 고열과 권태, 식욕부진과 함께 한 쪽 귀와 턱이 아프고 귀 밑이 부어오르는 증상으로 병원에 왔다. 이 환자가 겪게 될 합병증으로 가장 가능성이 높은 것은?", "opts": ["길랑-바레 증후군", "출혈열", "심근염", "고환염", "난소염"], "ans": 3, "hint": "귀밑샘(이하선) 부종 = 볼거리(mumps).", "why": "볼거리는 viremia로 생식샘으로 퍼져 사춘기 이후 남성에서 고환염(orchitis)을 합병한다(환자가 남성).", "mem": "볼거리(mumps)=이하선염, 사춘기 후 남성 고환염. 난소염은 여성.", "img": "", "tag": ""}, {"n": 115, "sec": 5, "id": "바이러스3 20-10", "src": "바이러스각론3 · 20번", "q": "71세 여성이 38℃ 이상의 고열과 두통, 전신 권태, 근육통과 기침으로 왔다. 숨이 차고 호흡이 곤란하였다. 가슴 X선에서 폐 침윤의 폐렴 소견을 보였다. 객담 검사에서 세균배양은 음성, 코로나 RT-PCR에서 양성이었다. 원인 바이러스에 관한 설명으로 옳지 않은 것은?", "opts": ["세포막에서 budding으로 방출한다.", "Early gene product로는 RdRp가 있다.", "주로 비말을 통해 전파된다.", "상기도, 하기도, 위장관이 target 기관이다.", "Spike glycoprotein은 tissue tropism에 영향을 미친다."], "ans": 0, "hint": "코로나(SARS-CoV-2) 폐렴.", "why": "Coronavirus는 ER/Golgi에서 budding 후 exocytosis로 방출되며, 세포막에서 budding하지 않는다.", "mem": "Coronavirus=ER/Golgi budding→exocytosis(세포막 budding X). RdRp early gene, Spike=ACE2 tropism.", "img": "", "tag": ""}, {"n": 116, "sec": 5, "id": "바이러스3 21-1", "src": "바이러스각론3 · 21번", "q": "다음 중 influenza virus의 발병기전의 설명으로 맞는 것은?", "opts": ["인터페론의 분비가 전신 독감증상을 유도한다.", "종 특이적 항체는 예방보다 회복에 더 중요하다.", "세균2차 감염으로 인후염과 마른기침 증상을 가진다.", "항체는 같은 type(A,B) 안의 다른 종에도 cross-protection을 한다.", "효과적인 예방을 위한 항체는 바이러스 내부 단백에 대한 항체이다."], "ans": 0, "hint": "인플루엔자 발병기전.", "why": "인플루엔자의 전신 독감증상(발열·근육통)은 인터페론 분비에 의해 유도된다.", "mem": "독감 전신증상=인터페론. 항체는 예방 중요, cross-protection 안됨(HA/NA 변이), 표면 단백(HA) 항체가 방어.", "img": "", "tag": ""}, {"n": 117, "sec": 5, "id": "바이러스3 21-2", "src": "바이러스각론3 · 21번", "q": "겨울에 발생하는 영아와 소아의 세기관지염, 폐렴에서 가장 중요한 병원체의 특징으로 맞지 않는 것은?", "opts": ["Syncytia를 만들 수 있다.", "Viremia를 일으킬 수 있다.", "Virion에 polymerase를 가지고 있다.", "위험군 영유아에 대한 예방법이 있다.", "심각한 영유아에 대한 치료법이 있다."], "ans": 1, "hint": "영아 세기관지염/폐렴 최중요 병원체 = RSV.", "why": "RSV는 호흡기 점막에 국한되어 viremia를 일으키지 않는다.", "mem": "RSV: syncytia O, virion에 RdRp O, palivizumab 예방, ribavirin 치료. Viremia 안일으킴.", "img": "", "tag": ""}, {"n": 118, "sec": 5, "id": "바이러스3 21-3", "src": "바이러스각론3 · 21번", "q": "3세 남아가 열, 코막힘, 목아픔, 컹컹거리는 기침과 목이 쉬어서 병원에 왔다. 청진에서 가슴에 쌕쌕거리는 소리를 확인할 수 있었다. 가장 가능성이 높은 바이러스는?", "opts": ["Respiratory syncytial virus", "Hantavirus", "Influenza virus", "Metapneumovirus", "Parainfluenza virus"], "ans": 4, "hint": "컹컹거리는 기침(croup) = Parainfluenza virus.", "why": "Croup(barking cough)은 Parainfluenza virus의 대표 특징.", "mem": "Croup=Parainfluenza.", "img": "", "tag": ""}, {"n": 119, "sec": 5, "id": "바이러스3 21-4", "src": "바이러스각론3 · 21번", "q": "경련성 발작을 일으키는 환자가 입원하였다. 특히 물을 보면 무서워하는 특징을 보였다. 일주일 후 환자가 사망하였고 brain biopsy에서 세포질의 봉입체를 확인할 수 있었다. 원인 바이러스의 타겟 조직으로 전달 경로는?", "opts": ["Viremia를 통해", "뇌척수액을 통해", "Cell-cell fusion을 통해", "감염된 macrophage를 통해", "Retrograde axonal transport를 통해"], "ans": 4, "hint": "공수병(물 공포)+세포질 봉입체(Negri body) = 광견병(Rabies).", "why": "Rabies virus는 말초신경에서 역행성 축삭수송(retrograde axonal transport)으로 CNS에 전달된다.", "mem": "광견병=Rabies, Negri body, retrograde axonal transport로 CNS 전달.", "img": "", "tag": ""}, {"n": 120, "sec": 5, "id": "바이러스3 21-5", "src": "바이러스각론3 · 21번", "q": "45세 남자의 정기건강검진에서 얻은 혈청검사 결과는 HBsAg(+), Anti-HBs(-), HBeAg(+), total anti-HBc(-)이었다. 이 남자의 현재 상태는?", "opts": ["급성 감염 초기", "백신을 맞은 상태", "감염 후 회복된 상태", "활동성 만성 B형 간염", "비활동성 만성 B형 간염"], "ans": 0, "hint": "HBsAg(+), HBeAg(+), anti-HBc(-) 해석.", "why": "HBsAg(+)/HBeAg(+)은 활동성 감염을 의미하고, anti-HBc(-)는 아직 항체가 안 생긴 급성 감염 초기를 시사.", "mem": "급성 초기=HBsAg+/HBeAg+/anti-HBc(-). 만성은 anti-HBc 양성.", "img": "", "tag": ""}, {"n": 121, "sec": 5, "id": "바이러스3 21-6", "src": "바이러스각론3 · 21번", "q": "20대 군인이 갑작스런 고열, 오한, 두통으로 왔다. 안면홍조, 결막충혈, 출혈반점 등이 관찰되다가 신부전 증상도 나타냈다. 3주 전 군인 봉사활동으로 추수하는 것을 도왔다고 한다. 진드기에 물린 흔적은 없었다. 원인 바이러스의 감염경로는?", "opts": ["감염된 동물에 물림", "감염된 동물의 배설물로 오염된 물이 피부 상처나 눈으로 들어감", "감염된 동물의 피를 섭취한 모기에 물림", "감염된 동물의 배설물로 오염된 물을 섭취함", "감염된 동물의 건조된 배설물이 호흡기로 들어감"], "ans": 4, "hint": "추수+신부전+출혈+진드기 없음 = 신증후군출혈열(Hantavirus).", "why": "Hantavirus는 설치류의 건조된 배설물(에어로졸)이 호흡기로 들어가 감염된다.", "mem": "Hantavirus=쥐 배설물 호흡기 흡입. 진드기 없음이 SFTS와 감별점.", "img": "", "tag": ""}, {"n": 122, "sec": 5, "id": "바이러스3 21-7", "src": "바이러스각론3 · 21번", "q": "3세 된 남아가 기침, 콧물, 결막염 증세로 병원에 왔다. 신체진찰에서 구강의 볼 점막 안 홍반에 회백색의 중심부가 존재하는 반점(Koplik spot)이 관찰되었다. 환아는 2~3일 후 피부에 발진이 났다. 원인 바이러스의 특징이 아닌 것은?", "opts": ["분변-구강 경로로 감염된다.", "적혈구를 응집시킬 수 있다.", "면역저하를 일으킬 수 있다.", "Syncytia를 만들 수 있다.", "전염력이 매우 높다."], "ans": 0, "hint": "Koplik spot+3C+발진 = 홍역.", "why": "홍역은 호흡기(비말)로 전파되며 분변-구강 경로로 감염되지 않는다.", "mem": "홍역=비말(호흡기) 전파, HA(적혈구응집), 일시적 면역억제, syncytia, 전염력 매우 높음.", "img": "", "tag": ""}, {"n": 123, "sec": 5, "id": "바이러스3 21-8", "src": "바이러스각론3 · 21번", "q": "떨림, 간헐적 근육경련 및 운동 조정상실이 있는 65세 여자환자가 급속한 진행성 치매로 병원에 왔다. 뇌척수액과 혈청에서 세균 및 바이러스 감염 검사는 음성이었다. 원인체에 대한 설명으로 올바른 것은?", "opts": ["면역반응으로 인터페론이 생산된다.", "뇌에서 지속적인 염증반응을 일으킨다.", "스펀지같이 구멍이 난 뇌 피질을 생성한다.", "단백분해효소에 의하여 병원성이 상실된다.", "15분간의 고압증기멸균에서 병원성이 상실된다."], "ans": 2, "hint": "진행성 치매+세균/바이러스 음성 = 프리온.", "why": "프리온은 해면상(스펀지) 변화로 구멍이 난 뇌 피질을 만든다.", "mem": "프리온=해면상뇌병증. 인터페론·염증 없음, 단백분해효소·고압증기멸균 저항.", "img": "", "tag": ""}, {"n": 124, "sec": 5, "id": "바이러스3 21-9", "src": "바이러스각론3 · 21번", "q": "36세 여자가 등산에 갔다 온 후에 고열, 피로, 식욕 저하, 구토, 설사, 복통 등의 증상이 나타나고 백혈구와 혈소판이 감소하여서 입원하였다. 감염경로와 원인 바이러스를 바르게 짝지은 것은?", "opts": ["모기-SFTS virus", "모기-Marburg virus", "참진드기-SFTS virus", "참진드기-Marburg virus", "모기-Lassa fever virus"], "ans": 2, "hint": "등산+위장염+백혈구/혈소판 감소 = SFTS.", "why": "SFTS는 참진드기(작은소참진드기)가 매개한다.", "mem": "SFTS=참진드기 매개, 혈소판/백혈구 감소.", "img": "", "tag": ""}, {"n": 125, "sec": 5, "id": "바이러스3 21-10", "src": "바이러스각론3 · 21번", "q": "다음 중 zoonosis(인수공통감염)을 일으키는 바이러스가 아닌 것은?", "opts": ["Rabies virus", "Hantavirus", "Japanese encephalitis virus", "Influenza virus A", "Hepatitis B virus"], "ans": 4, "hint": "인수공통감염을 일으키지 않는 바이러스 찾기.", "why": "Hepatitis B virus는 사람 간 전파(혈액/체액)되는 바이러스로 인수공통감염이 아니다.", "mem": "HBV=사람 전용. Rabies/Hanta/JEV/Influenza A는 동물 매개(인수공통).", "img": "", "tag": ""}, {"n": 126, "sec": 5, "id": "바이러스2 22-1", "src": "바이러스각론2 · 22번", "q": "Arbovirus가 아닌 것은?", "opts": ["Zika virus", "Rubella virus", "West Nile virus", "Yellow fever virus", "Chikungunya virus"], "ans": 1, "hint": "Arbovirus(절지동물 매개)가 아닌 것 찾기.", "why": "Rubella virus는 공기(비말) 전파되며 절지동물 매개가 아니다.", "mem": "Arbovirus=Zika/West Nile/Yellow fever/Chikungunya(모기 매개). Rubella는 호흡기 전파.", "img": "", "tag": ""}, {"n": 127, "sec": 5, "id": "바이러스2 22-5", "src": "바이러스각론2 · 22번", "q": "46세의 여자가 구토와 설사로 응급실로 왔다. 스키리조트로 여행을 다녀왔다고 한다. 리조트에 머문 다수의 다른 스키어들 역시 같은 증상으로 병원으로 갔다고 한다. 조사 결과 리조트 식당에서 공급된 조개류의 일부가 원인 병원체에 오염되어 있었다. 환자는 피로감과 두통, 근육통이 있지만 변에서 혈액이나 농은 관찰되지 않았고 이틀 후 호전되었다. 가장 가능성이 높은 병원체는?", "opts": ["Norovirus", "Enterovirus", "Coronavirus", "Zika virus", "Rotavirus"], "ans": 0, "hint": "조개류+집단 위장염+무혈변+빠른 호전 = Norovirus.", "why": "Norovirus는 오염된 조개류로 집단 식중독을 일으키며 며칠 내 호전된다.", "mem": "조개류 집단 위장염=Norovirus. Rotavirus는 주로 영아.", "img": "", "tag": ""}, {"n": 128, "sec": 5, "id": "바이러스2 22-6", "src": "바이러스각론2 · 22번", "q": "다음 중 +RNA genome으로부터 -RNA를 만들고 -RNA를 template로 하여 mRNA를 합성하는 바이러스가 아닌 것은?", "opts": ["Norovirus", "Dengue virus", "SARS-CoV-2", "MERS-CoV", "Chikungunya virus"], "ans": 0, "hint": "+RNA→-RNA→mRNA 합성 안하는 것 찾기.", "why": "Norovirus는 +RNA를 직접 mRNA로 번역하는 바이러스로, -RNA 중간체를 거치지 않는다.", "mem": "Norovirus=+RNA 직접 번역. Coronavirus/Flavivirus 등은 -RNA template 거침.", "img": "", "tag": ""}, {"n": 129, "sec": 5, "id": "바이러스2 22-8", "src": "바이러스각론2 · 22번", "q": "SARS-CoV-2의 viral protease를 억제하는 기작을 가진 약제는?", "opts": ["Dolutegravir", "Molnupiravir", "Ritonavir", "Paxlovid", "Remdesivir"], "ans": 3, "hint": "SARS-CoV-2 protease 억제제.", "why": "Paxlovid(nirmatrelvir/ritonavir)는 viral protease를 억제한다.", "mem": "Paxlovid=protease 억제. Remdesivir/Molnupiravir=RdRp, Dolutegravir=HIV integrase.", "img": "", "tag": ""}, {"n": 130, "sec": 5, "id": "바이러스2 22-9", "src": "바이러스각론2 · 22번", "q": "노로바이러스와 로타바이러스의 공통점은?", "opts": ["백신이 있다.", "외피가 없다.", "치료제가 있다.", "배양할 수 있다.", "+RNA genome을 가진다."], "ans": 1, "hint": "Norovirus와 Rotavirus 공통점.", "why": "두 바이러스 모두 외피가 없는(naked) 바이러스이다.", "mem": "공통=naked. Noro=+ssRNA/백신 없음, Rota=dsRNA/생백신 있음. 둘 다 치료제 없음.", "img": "", "tag": ""}, {"n": 131, "sec": 5, "id": "바이러스2 23-2", "src": "바이러스각론2 · 23번", "q": "다음 중 SARS-CoV-2에 대한 설명으로 맞지 않는 것은?", "opts": ["주로 비말을 통해 전파된다.", "폐세포에서 syncytia를 확인할 수 있다.", "상기도, 하기도, 위장관이 target 기관이다.", "세포막에서 외피를 얻어 바이러스가 방출된다.", "감염 후 가장 먼저 만들어지는 단백으로 RNA dependent RNA polymerase가 있다."], "ans": 3, "hint": "SARS-CoV-2 설명 중 틀린 것.", "why": "Coronavirus는 ER/Golgi에서 외피를 얻어 exocytosis로 방출되며, 세포막에서 외피를 얻지 않는다.", "mem": "Coronavirus=ER/Golgi에서 외피 획득. (ACE2 결합으로 syncytia는 형성 가능)", "img": "", "tag": ""}, {"n": 132, "sec": 5, "id": "바이러스2 23-3", "src": "바이러스각론2 · 23번", "q": "6개월된 영아가 5일 동안 맑은 설사를 싸고 구토를 하여 병원에 왔다. 대변에는 피나 고름은 보이지 않았다. 늦가을에서 초봄 사이에 같은 질환을 가진 영유아가 많이 병원을 찾는다고 한다. 가장 가능성이 높은 원인 바이러스에 관한 설명으로 맞는 것은?", "opts": ["불활성화 백신이 있음", "백신은 감염을 막지는 못함", "+RNA genome", "Enveloped virus", "Budding으로 방출"], "ans": 1, "hint": "영아 겨울철 설사 = Rotavirus.", "why": "Rotavirus는 naked virus라 항체만으로 재감염을 막지 못한다(백신이 감염 자체를 막지는 못함).", "mem": "Rotavirus=dsRNA, naked, lysis 방출, 경구 생백신. 백신이 감염을 완전히 막진 못함.", "img": "", "tag": ""}, {"n": 133, "sec": 5, "id": "바이러스2 23-8", "src": "바이러스각론2 · 23번", "q": "55세 남자가 급성 B형 간염으로 치료를 받았다. B형 간염이 회복되어 가고 있음을 의미하는 표지자는?", "opts": ["HBeAg(+)", "IgG anti-HBc(+)", "IgM anti-HBc(+)", "HBsAg(+)", "Anti-HBs(+)"], "ans": 4, "hint": "B형 간염 회복 표지자.", "why": "Anti-HBs(+)는 B형 간염이 회복되어 가고 있음(면역 획득)을 의미한다.", "mem": "회복=Anti-HBs(+). HBsAg(+)/HBeAg(+)=활동성, IgM anti-HBc=급성.", "img": "", "tag": ""}, {"n": 134, "sec": 5, "id": "바이러스2 23-9", "src": "바이러스각론2 · 23번", "q": "10세 여아가 발열과 전신발진으로 병원에 왔다. 4일 전부터 기침, 콧물과 결막충혈이 있었고, 이틀 전에 구강 점막에 회백색의 모래알 크기 모양의 작은 반점(Koplik spot)이 관찰되었다. 다음 중 원인 바이러스에 대한 설명으로 맞지 않는 것은?", "opts": ["Syncytia를 만들 수 있다.", "적혈구를 응집시킬 수 있다.", "핵에서 genome복제가 일어난다.", "-RNA genome을 갖는다.", "세포막에서 budding으로 방출된다."], "ans": 2, "hint": "Koplik spot+3C+발진 = 홍역.", "why": "홍역(Paramyxoviridae)은 세포질에서 genome 복제가 일어난다(핵 아님).", "mem": "홍역=세포질 복제, syncytia, HA, -ssRNA, budding. Influenza만 핵에서 복제.", "img": "", "tag": ""}, {"n": 135, "sec": 5, "id": "바이러스2 23-10", "src": "바이러스각론2 · 23번", "q": "2개월 영아가 2월에 세기관지염으로 병원에 입원하였다. 아이는 호흡곤란으로 위중한 상태였다. 가장 가능성이 높은 바이러스에 감염되었다고 생각한 의사가 처방하였을 약제는?", "opts": ["Oseltamivir", "Palivizumab", "Paxlovid", "Ribavirin", "IFN-alpha"], "ans": 3, "hint": "겨울+영아 세기관지염+위중 = RSV.", "why": "RSV로 입원한 위중한 영아에게는 ribavirin(aerosolized) 흡인 치료를 한다.", "mem": "RSV 위중=ribavirin 치료. Palivizumab=예방, Oseltamivir=인플루엔자, Paxlovid=코로나.", "img": "", "tag": ""}, {"n": 136, "sec": 1, "id": "세균1 22-6", "src": "세균각론1 · 22번(조9)", "q": "같이 점심으로 김밥을 먹은 고등학생 3명이 복통과 구토 증상으로 오후 4시경에 병원에 왔다. 김밥에서 그람양성막대균이 관찰되었다. 가장 가능성이 높은 원인균과 식중독이 일어난 기작이 맞게 짝지어진 것은?", "opts": ["Staphylococcus aureus – 장독소 섭취", "Staphylococcus aureus – 세균 섭취하여 장에서 세균 증식", "Bacillus cereus – 세균 섭취하여 세균 증식", "Clostridium perfringens – 장독소 섭취", "Bacillus cereus – 장독소 섭취"], "ans": 4, "hint": "김밥(쌀)+빠른 발현(4시간)+그람양성막대균 = B. cereus 구토형 식중독.", "why": "B. cereus 구토형 식중독은 오염된 쌀에 미리 생성된 heat-stable 장독소(emetic toxin) 섭취로 발생한다.", "mem": "B.cereus 구토형=쌀, heat-stable 장독소 '섭취'(균 증식 아님). S.aureus도 장독소 섭취형이나 그람양성알균.", "img": "", "tag": ""}, {"n": 137, "sec": 1, "id": "세균1 22-7", "src": "세균각론1 · 22번(조9)", "q": "아프리카 지역 해외봉사 중인 의사에게 2세 아이가 심한 열로 왔다. 편도, 목젖 부위에 삼출을 막은 위막이 관찰되었고, 편도부위에서 검체를 분리하여 그람 염색한 결과 불규칙한 곤봉모양의 그람양성 막대균이 관찰되었다. 메틸렌블루 염색에서 세균 내부에 구슬모양의 과립이 관찰되었다. 원인이 되는 독소의 작용기전은?", "opts": ["초항원 작용", "cAMP 농도 증가", "신경전달물질 분비 억제", "단백질 합성 억제", "G단백에 의한 신호전달 저해"], "ans": 3, "hint": "위막+곤봉모양 그람양성막대균+메타크로마틴 과립 = 디프테리아.", "why": "Diphtheria toxin의 A subunit이 EF-2를 불활성화시켜 단백질 합성을 억제한다.", "mem": "디프테리아=단백합성 억제(EF-2). 초항원=S.pyogenes/aureus, cAMP↑=백일해, Ach 억제=보툴리눔.", "img": "", "tag": ""}, {"n": 138, "sec": 1, "id": "세균1 22-8", "src": "세균각론1 · 22번(조9)", "q": "태어난 지 일주일 된 신생아가 수막염 증상으로 병원에 왔다. CSF 배양에서 나온 원인균은 그람양성 짧은 막대균이었다. 가장 가능성이 높은 원인균의 특성으로 맞지 않는 것은?", "opts": ["낮은 온도에서도 증식가능", "배양시 운동성 있음", "감염제어에 세포매개면역이 중요", "세포질에서 증식", "세포 내에서 actin 작용으로 filopod 형성"], "ans": 4, "hint": "신생아 수막염+그람양성 짧은 막대균(알막대균) = L. monocytogenes.", "why": "Listeria는 세포 내에서 actin을 이용해 이동(actin rocket)하지만, filopod 형성이라는 설명이 정확하지 않다(actin-based motility로 인접 세포 침입).", "mem": "Listeria: 저온 증식(cold enrichment), 운동성(실온), 세포매개면역 중요, 세포질 증식, actin 기반 세포간 이동.", "img": "", "tag": ""}, {"n": 139, "sec": 1, "id": "세균1 22-9", "src": "세균각론1 · 22번(조9)", "q": "일가족 세 명이 집 근처 식당에서 저녁을 함께 사 먹은 후, 5사람에게서 48시간이 지나지 않아 구역, 구토, 변비, 복통 등의 소화기 증상과 더불어 복시, 침흘림, 연하 곤란, 언어장애 및 호흡곤란 증상이 보였다. 대변검사에서 특이균이 검출되지 않았다. 이 질환의 원인은?", "opts": ["세균 enterotoxin에 의한 세포 내 cAMP의 활성화", "세균 endotoxin 작용에 의한 패혈성 쇼크", "세균 독소가 콜린작동성 시냅스의 아세틸콜린 분비를 차단", "세균의 융해성 성피세포 침입, 세포 내 증식 및 세포간 확산", "세균 독소가 신경계를 침범하여 근육의 긴장성 연축을 유발"], "ans": 2, "hint": "복시·연하곤란·이완성마비+소화기 증상 = 보툴리눔(C. botulinum).", "why": "Botulinum toxin은 콜린작동성 시냅스에서 아세틸콜린 분비를 차단하여 이완성 마비를 일으킨다.", "mem": "보툴리눔=Ach 분비 차단(이완성마비), 복시·연하곤란. 긴장성 연축(경직)은 파상풍.", "img": "", "tag": ""}, {"n": 140, "sec": 1, "id": "세균1 22-10", "src": "세균각론1 · 22번(조9)", "q": "25세 남자가 세균성 중이염으로 광범위 퀴놀론계 항생제를 복용하던 중 7일 뒤부터 경련성 복통과 함께 과다한 설사가 시작되었다. 항균제 복용을 중단한 후에는 증상이 호전되었다. 대장내시경상 섬유소 점액, 염증세포들이 장점막 위에 하얀 플라크를 형성하고 있었다. 설사 당시 대변에서 분리될 가능성이 높은 원인균의 특성으로 맞는 것은?", "opts": ["Facultative anaerobe", "Endotoxin 생성", "신경독소 생성", "Enterotoxin과 cytotoxin을 생성", "아포 비형성균"], "ans": 3, "hint": "항생제 복용+위막성 장염(하얀 플라크) = C. difficile.", "why": "C. difficile는 enterotoxin(toxin A)과 cytotoxin(toxin B)을 생성하여 항생제 연관 위막성 장염을 일으킨다.", "mem": "C.difficile=toxinA(enterotoxin)+toxinB(cytotoxin), 아포형성, obligate anaerobe, 그람양성. endotoxin(그람음성)·신경독소 아님.", "img": "", "tag": ""}, {"n": 141, "sec": 2, "id": "세균2 22-1", "src": "세균각론2 · 22번", "q": "유치원 아이들이 집단적으로 발열과 혈변성 설사로 병원에 왔다. 그 중 2명의 아이는 소변이 잘 나오지 않는 증상을 보였다. MacConkey Sorbitol 배양검사에서 무색투명한 집락이 관찰되었다. 원인균이 발현하는 독성인자가 아닌 것은?", "opts": ["Shiga toxin (Stx1)", "Heat-stable toxin (Sta)", "Bundle-forming pili (BFP)", "Endotoxin", "Tir and intimin"], "ans": 1, "hint": "혈변성 설사+HUS(소변 안나옴)+Sorbitol MacConkey 무색 = EHEC(O157:H7).", "why": "Heat-stable toxin(STa)은 ETEC의 독성인자이며 EHEC의 독성인자가 아니다.", "mem": "EHEC O157:H7=Shiga toxin, BFP, endotoxin, Tir/intimin(A/E), Sorbitol 비발효(무색). STa는 ETEC.", "img": "", "tag": ""}, {"n": 142, "sec": 2, "id": "세균2 22-2", "src": "세균각론2 · 22번", "q": "65세 여자가 입원 치료를 받고 있던 중 38℃ 이상의 고열, 전신 권태, 근육통, 기침 및 호흡 곤란을 호소하기 시작하였다. 가슴 X선 사진에서 뚜렷한 폐 침윤이 관찰되고, 객담 가검물 검사에서 사진과 같은 세균이 분리된다. 이 질환의 원인균은?", "opts": ["Haemophilus influenza", "Legionella pneumophila", "Pseudomonas aeruginosa", "Klebsiella pneumoniae", "Bordetella pertussis"], "ans": 3, "hint": "입원 중 폐렴+점액성 집락(혈액·역콜린우무배지)+그람음성막대 = K. pneumoniae.", "why": "적색(분홍)으로 자라는 젖산발효, 점액성 협막 집락은 Klebsiella pneumoniae의 특징.", "mem": "Klebsiella=점액성 협막 집락, 젖산발효(분홍). Legionella=초콜릿/BCYE, Pseudomonas=lactose 비발효.", "img": "", "tag": ""}, {"n": 143, "sec": 2, "id": "세균2 22-3", "src": "세균각론2 · 22번", "q": "57세 남성이 여름 휴가철이 지나 한적한 바다에 가서 바다 낚시를 하였다. 물에 들어가 그물로 낚시를 하였는데 뾰족한 돌들에 다리가 몇 군데 긁혔다. 며칠 후 온 몸이 아프고 열과 오한이 나더니 다리에 사진과 같은 수포가 생겼다. 다리의 수포액을 TCBS 배지에서 배양한 결과 녹색의 집락이 형성되었다. 원인균의 독성이 아닌 것은?", "opts": ["Capsule 있음", "운동성 없음", "Halophilic", "Curved 그람음성막대균", "Oxidase 양성"], "ans": 1, "hint": "바다 상처+다리 수포+TCBS 녹색 = V. vulnificus.", "why": "Vibrio는 단극모(polar flagella)로 강한 운동성을 가지므로 '운동성 없음'이 틀렸다.", "mem": "Vibrio=운동성 있음(polar flagella), 협막, 호염성, 만곡형 그람음성막대, oxidase 양성.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/ 하며 왔다. 위내시경검사에서 위염과 궤양이 관찰되어 생검조직으로 세균검사를 시행하였다. 요소분해효소검사에서 양성으로 나타났고, 미세호기 조건에서 5일 배양 후 작은 집락이 관찰되었다. 배양된 균의 현미경 검사에서 그람음성의 막대균이 관찰되었다. 이 병원체는?", "opts": ["Helicobacter pylori", "Vibrio parahaemolyticus", "Proteus mirabilis", "Moraxella catarrhalis", "Campylobacter jejuni"], "ans": 0, "hint": "위염·궤양+urease 양성+미세호기 배양+만곡 그람음성막대 = H. pylori.", "why": "H. pylori는 urease 양성이며 위점막에서 위염·궤양을 일으킨다.", "mem": "H.pylori=urease+, 미세호기, 위염/궤양. urease+가 핵심 단서.", "img": "", "tag": ""}, {"n": 145, "sec": 2, "id": "세균2 22-6", "src": "세균각론2 · 22번", "q": "물설사로 시작한 장염이 이틀 후에는 심한 복통과 뒤무직으로 이어졌다. 원인균은 사람간 감염만 되는 운동성이 없는 그람음성막대균이었다. 가장 가능성이 높은 원인균은?", "opts": ["Escherichia coli", "Shigella sonnei", "Yersinia enterocolitica", "Salmonella enterica", "Campylobacter jejuni"], "ans": 1, "hint": "뒤무직(tenesmus)+사람간 전파+non-motile = Shigella.", "why": "Shigella sonnei는 사람-사람 전파, 비운동성 그람음성막대균으로 세균성 이질을 일으킨다.", "mem": "Shigella=뒤무직, 사람간 전파, non-motile, Ipa(침습). Salmonella는 인수공통·운동성.", "img": "", "tag": ""}, {"n": 146, "sec": 2, "id": "세균2 22-7", "src": "세균각론2 · 22번", "q": "5개월 여아가 고열과 구토로 왔다. 뇌척수액 검사에서 그람음성의 작은 다형태성 막대균이 발견되었으며 X인자와 V인자가 포함된 배지에서 매끈하고 불투명한 집락으로 배양되었다. 원인균의 중요한 독성인자인 협막을 바르게 말한 것은?", "opts": ["Alginate capsule", "Polypeptide capsule", "Hyaluronic acid capsule", "Lipopolysaccharide capsule", "Polyribosyl ribitol phosphate capsule"], "ans": 4, "hint": "소아 수막염+X·V인자 필요+다형태성 그람음성막대 = H. influenzae.", "why": "Hib의 협막은 polyribosyl ribitol phosphate(PRP)이다.", "mem": "Hib 협막=PRP. LPS는 협막이 아님, Yersinia=protein capsule, Alginate=Pseudomonas, Hyaluronic=S.pyogenes.", "img": "", "tag": ""}, {"n": 147, "sec": 2, "id": "세균2 22-8", "src": "세균각론2 · 22번", "q": "25세 여자가 태국 여행을 다녀온 뒤 복통과 함께 쌀뜨물 같은 설사로 병원에 왔다. MacConkey 배지에서는 무색의 집락이 나타났고, TCBS 배지에서는 노란색 집락이 관찰되었다. 설사를 유발하는 원인균의 독소 기작은?", "opts": ["Protein 합성 억제", "Neurotransmitter 분비 억제", "세포 간 연결 Protein 분해", "cAMP 증가 유도", "Superantigen 면역반응 유도"], "ans": 3, "hint": "쌀뜨물 설사+TCBS 노란색 = V. cholerae.", "why": "Cholera toxin은 cAMP를 증가시켜 수양성 설사를 유발한다.", "mem": "콜레라=cAMP↑(쌀뜨물 설사). TCBS 노란색=V.cholerae(녹색은 V.vulnificus/parahaemolyticus).", "img": "", "tag": ""}, {"n": 148, "sec": 2, "id": "세균2 22-9", "src": "세균각론2 · 22번", "q": "64세 남자가 피곤하고 열과 오한이 있어 왔다. 지난 며칠간 기침이 심해지며 흰 가래도 나왔다고 했다. 체온 38.2℃였고 청진 결과 오른쪽 하부 흉부에 수포음(rale)이 들렸다. 특정 원인균이 의심되어 BCYE 배지에 배양하였고 소변항원검사 실시하여 양성이 나왔다. 이 원인균의 중요한 발병기전은?", "opts": ["Cytotoxin으로 세포막을 파괴한다", "대식세포에서 생존하며 증식한다", "세포의 세포질에서 증식하며 actin polymerization을 유도한다", "림프 모세혈관에 침투하여 확산되고 전신질환을 일으킨다", "T3SS로 독성인자를 세포내 주입한다"], "ans": 1, "hint": "BCYE 배양+소변항원 양성+폐렴 = Legionella.", "why": "Legionella는 대식세포 안에서 생존·증식하는 facultative intracellular 병원체이다.", "mem": "Legionella=대식세포 내 생존(소변항원검사). actin polymerization=Shigella/Listeria, T3SS=Pseudomonas 등.", "img": "", "tag": ""}, {"n": 149, "sec": 2, "id": "세균2 22-10", "src": "세균각론2 · 22번", "q": "21세 여자가 3일 동안 배뇨에 대한 불편함과 증가된 배뇨 빈도수로 병원에 왔다. 발열, 복통, 요통, 질 분비물, 피부 발진 등은 없었다. 원심분리된 소변 시료의 침전물을 현미경으로 관찰한 결과 현미경 시야에 10~15개의 백혈구와 수많은 그람음성막대균이 검출되었다. 원인균은 MacConkey 배지에서 분홍색 콜로니를 띠었다. 원인균의 요로감염에 특이적으로 중요한 독성인자는?", "opts": ["Pili", "Capsule", "Exotoxin", "Urease", "Flagella"], "ans": 0, "hint": "요로감염+맥콩키 분홍색(젖산발효)+그람음성막대 = E. coli.", "why": "UPEC(E. coli)의 요로감염에 특이적으로 중요한 독성인자는 pili(adhesin)로 균이 소변에 씻겨나가지 않게 부착한다.", "mem": "E.coli 요로감염=pili(adhesin)가 핵심. 맥콩키 분홍=젖산발효. urease(-)로 Proteus 제외.", "img": "", "tag": ""}, {"n": 150, "sec": 2, "id": "세균2 23-2", "src": "세균각론2 · 23번(조3)", "q": "65세 여자가 입원 치료를 받고 있던 중 38℃ 이상의 고열, 전신 권태, 근육통, 기침 및 호흡 곤란을 호소하기 시작하였다. 가슴 X선에서 뚜렷한 폐 침윤이 관찰되고 객담 가검물에서 적색(분홍)으로 배양되는 세균이 분리된다. 이 질환의 원인균은?", "opts": ["Haemophilus influenza", "Legionella pneumophila", "Pseudomonas aeruginosa", "Klebsiella pneumoniae", "Bordetella pertussis"], "ans": 3, "hint": "입원 중 폐렴+분홍(젖산발효)+점액성 = K. pneumoniae.", "why": "적색으로 자라는 젖산발효·점액성 협막 집락은 Klebsiella pneumoniae.", "mem": "Klebsiella=점액성 협막, 젖산발효(분홍). P.aeruginosa=lactose 비발효, Legionella=BCYE.", "img": "", "tag": ""}, {"n": 151, "sec": 2, "id": "세균2 23-4", "src": "세균각론2 · 23번(조3)", "q": "50세의 남자가 복부통증과 구토를 호소하며 왔다. 위내시경검사에서 위염과 궤양이 관찰되어 생검조직으로 세균검사를 시행하였다. 요소분해효소검사에서 양성으로 나타났고 미세호기 조건에서 5일 배양 후 작은 집락이 관찰되었다. 그람음성의 막대균이 관찰되었다. 이 병원체는?", "opts": ["Helicobacter pylori", "Vibrio parahaemolyticus", "Proteus mirabilis", "Moraxella catarrhalis", "Campylobacter jejuni"], "ans": 0, "hint": "위염·궤양+urease 양성+미세호기 = H. pylori.", "why": "H. pylori는 urease 양성, 미세호기 배양, 위염·궤양을 일으킨다.", "mem": "H.pylori=urease+, 위장 증상. urease+가 핵심.", "img": "", "tag": ""}, {"n": 152, "sec": 2, "id": "세균2 23-6", "src": "세균각론2 · 23번(조3)", "q": "백신을 맞지 않은 3세 여아가 심한 기침으로 병원에 왔다. 일주일 동안 지속된 감기증상이 나아지지 않고 내원 전날에 심한 기침이 시작되었다. 발작적인 기침은 구토로 이어졌다. 내원 당시 아이는 매우 지친 상태였다. 피 검사에서 림프구의 증가가 보였다. 원인균의 독소 기작은?", "opts": ["EF-2를 불활성화하여 단백 합성 억제", "신경세포의 acetylcholine 억제", "Superantigen", "세포막에 pore형성", "세포내 cAMP 증가 유도"], "ans": 4, "hint": "발작성 기침→구토+림프구증가 = 백일해(B. pertussis).", "why": "Pertussis toxin은 adenylate cyclase 조절 단백을 불활성화하여 cAMP 증가를 유도한다.", "mem": "백일해=cAMP↑(LT). EF-2 불활성=디프테리아, Ach 억제=보툴리눔, pore=alpha toxin.", "img": "", "tag": ""}, {"n": 153, "sec": 2, "id": "세균2 23-7", "src": "세균각론2 · 23번(조3)", "q": "백신을 맞지 않은 어린이에게서 PRP(Polyribosyl ribitol phosphate)-protein conjugate 백신을 맞지 않은 어린이에게서 심각한 후두개염과 수막염을 일으킬 수 있는 균에 대한 설명으로 맞는 것은?", "opts": ["혈액우무배지에서 배양", "협막이 없으면 감염성이 없어짐", "Polypeptide capsule 가짐", "그람음성알균", "Endotoxin 가짐"], "ans": 4, "hint": "PRP 백신+후두개염+수막염 = H. influenzae type b.", "why": "H. influenzae는 그람음성균으로 endotoxin(LPS)를 가진다.", "mem": "Hib: 초콜릿한천(X·V인자) 배양, PRP 다당류 협막, 그람음성막대, endotoxin 보유. 무협막주도 감염 가능.", "img": "", "tag": ""}, {"n": 154, "sec": 2, "id": "세균2 23-8", "src": "세균각론2 · 23번(조3)", "q": "55세 남자가 야외 카페에서 친구들과 시간을 보내고 집에 돌아온 후에 발열, 두통, 마른기침이 시작되어 병원에 왔다. 가슴 X선에서 오른쪽 폐의 경화가 보였다. 방문하였던 카페는 오랫동안 쓰지 않았던 분수대를 그 날 가동하였고 분사된 물방울의 흡입으로 감염되었다면 원인균의 특성으로 맞는 것은?", "opts": ["절대 세포내 기생세균", "항체가 감염 해소에 중요", "시스테인과 철분이 첨가된 BCYE 배지에서 배양", "협막의 항포식작용", "그람염색에서 진분홍으로 염색이 잘됨"], "ans": 2, "hint": "분수대 aerosol+비정형 폐렴 = Legionella.", "why": "Legionella는 L-cysteine과 iron salt가 첨가된 BCYE 배지에서 배양한다.", "mem": "Legionella=BCYE 배지, facultative 세포내균, 임상검체 은염색, cell-mediated immunity 중요.", "img": "", "tag": ""}, {"n": 155, "sec": 2, "id": "세균2 23-9", "src": "세균각론2 · 23번(조3)", "q": "32세 여자가 소변을 잘 참지 못하고 소변 볼 때에 통증을 느껴서 왔다. 소변에서 냄새도 났다. 소변검사 결과 그람음성알막대균이 관찰되었고 균 특성검사에서 oxidase 음성, urease 음성이 나왔다. 원인 병원균이 요로감염을 일으키는 데 특별히 중요한 병원성 인자는?", "opts": ["Shiga toxin", "Flagella", "Capsule", "Pili", "LPS"], "ans": 3, "hint": "요로감염+urease(-)+oxidase(-) = E. coli(ExPEC).", "why": "UPEC의 요로감염에 중요한 병원성 인자는 pili(adhesin)이다.", "mem": "E.coli 요로감염=pili adhesin. urease(-) Proteus 제외, oxidase(-) Pseudomonas 제외.", "img": "", "tag": ""}, {"n": 156, "sec": 2, "id": "세균2 23-10", "src": "세균각론2 · 23번(조3)", "q": "38세 화상환자의 상처부위에 감염으로 농이 생겼다. 농을 배양한 결과 방향족 냄새가 나는 청록 및 녹황색의 균 집락을 확인할 수 있었다. 균은 포도당을 발효하지 않으며 oxidase 양성, catalase 양성이었다. 이 원인균의 독성인자 중에서 숙주세포의 단백합성을 저해하여 조직 손상을 초래하는 것은?", "opts": ["Pyocyanin", "Catalase", "Exoenzyme S", "Endotoxin", "Exotoxin A"], "ans": 4, "hint": "화상+청록/녹황색 집락+비발효+oxidase(+) = P. aeruginosa.", "why": "Exotoxin A는 숙주세포의 단백질 합성을 저해한다(diphtheria toxin 유사 기전).", "mem": "녹농균 Exotoxin A=EF-2 불활성(단백합성 저해). Pyocyanin=색소, Exoenzyme S=T3SS actin.", "img": "", "tag": ""}, {"n": 157, "sec": 3, "id": "세균3 22-2", "src": "세균각론3 · 22번(조3)", "q": "36세 남자가 열이 나고 점출혈이 있어 응급실에 왔다. 오늘 새벽부터 발열과 오한이 있었으며, 증상이 시작된 후 약 12시간 후인 저녁 무렵부터 양측하지와 등에 점출혈(petechia)이 나타났다고 하였다. 체온은 39℃였다. 혈액과 뇌척수액에서 백혈구 내부에 그람음성 쌍알균이 관찰되었다. 원인균의 중요한 병원성 인자로 혈청형을 결정하며 백신 물질이 되는 것은?", "opts": ["Polysaccharide capsule", "Outer membrane protein", "Lipooligosaccharide", "Porin", "Pili"], "ans": 0, "hint": "점출혈+그람음성 쌍알균 = N. meningitidis.", "why": "수막염균의 다당질 협막(polysaccharide capsule)이 혈청형(serogroup)을 결정하고 백신 물질이 된다.", "mem": "수막염균=다당질 협막(serogroup, 백신). 점출혈이 특징적.", "img": "", "tag": ""}, {"n": 158, "sec": 3, "id": "세균3 22-3", "src": "세균각론3 · 22번(조3)", "q": "15세 남자가 고열, 결막충혈, 두통, 목이 뻣뻣한 증상(수막염)으로 병원에 왔다. 환자는 이틀 전 휴가지 호수가에 물놀이를 하였는데 그 물은 쥐의 배설물에 오염된 물이었다. 의사가 원인균을 확인하기 위해 현재 할 수 있는 가장 적절한 검사법은?", "opts": ["현미경 응집 검사", "ELISA", "CSF를 그람염색", "혈액배양", "CSF를 fletcher 배지에 배양"], "ans": 4, "hint": "쥐 배설물 오염수+수막염+결막충혈 = 렙토스피라.", "why": "Leptospira는 fletcher(또는 EMJH) 배지에 배양하여 암시야 현미경으로 확인한다.", "mem": "렙토스피라 진단=Fletcher/EMJH 배양+암시야 현미경. 혈청학적으로는 MAT(현미경응집).", "img": "", "tag": ""}, {"n": 159, "sec": 3, "id": "세균3 22-4", "src": "세균각론3 · 22번(조3)", "q": "24세 남자가 4일 전부터 요도에서 화농성 분비물이 지속된다며 왔다. 분비물의 그람염색에서 그람음성 쌍알균이 관찰되었다. 특수배지에 배양한 원인균은 oxidase 양성이었다. 환자는 이전에 두 차례 이 균의 감염으로 치료한 적이 있었다. 과거 감염이 있었음에도 면역이 형성되지 않은 이유는?", "opts": ["Opa 단백의 항원성", "Endotoxin 활성이 없는 LOS", "림프구 활성저하 단백의 생산", "협막(capsule)이 항체의 부착을 차단", "Pilin 단백의 항원변화(antigenic variation)"], "ans": 4, "hint": "재발성 임질+화농성 요도분비물 = N. gonorrhoeae.", "why": "임균은 pilin 단백의 항원변화(antigenic variation) 때문에 재감염되며 면역이 형성되지 않는다.", "mem": "임균 재감염=pili 항원변이. LOS는 endotoxin 활성 있음, 협막은 수막염균.", "img": "", "tag": ""}, {"n": 160, "sec": 3, "id": "세균3 22-6", "src": "세균각론3 · 22번(조3)", "q": "49세 남자가 한달 넘게 지속되는 기침으로 병원에 왔다. 기침은 점차 심해졌고 객혈과 체중감소, 야간발한의 증상이 동반되었다. 객담검사에서 항산성 세균이 관찰되었다. 원인균과 관련된 발병기전은?", "opts": ["협막의 항포식작용", "IL-10 유사물질을 분비", "Macrophage의 cytokine 분비 억제", "Macrophage의 apoptosis 촉진", "Phagolysosome 융합을 억제"], "ans": 4, "hint": "만성 기침+객혈+체중감소+야간발한+항산성균 = 결핵.", "why": "M. tuberculosis는 phagosome-lysosome 융합을 억제하여 대식세포 내에서 생존한다.", "mem": "결핵=phagolysosome 융합 억제. 항산성균이 단서.", "img": "", "tag": ""}, {"n": 161, "sec": 3, "id": "세균3 22-7", "src": "세균각론3 · 22번(조3)", "q": "30대 남자가 자신의 성기에 병변이 생겨서 왔다. 환자는 한 달 전에 성기 부위에 통증이 없는 궤양이 있었다고 하였다. 지금은 겨드랑이와 손바닥 등에 구진이 나타나고, 발열과 오한도 있다. 이 병의 진단을 위한 선별검사와 확진검사가 맞게 짝지어진 것은?", "opts": ["VDRL / FTA-ABS", "FTA-ABS / RPR", "FTA-ABS / VDRL", "RPR / VDRL", "VDRL / RPR"], "ans": 0, "hint": "무통성 궤양→손바닥 구진/발열 = 2기 매독.", "why": "매독은 비트레포네마 검사(VDRL/RPR)를 선별검사로, 트레포네마 검사(FTA-ABS)를 확진검사로 사용.", "mem": "매독 선별=VDRL/RPR, 확진=FTA-ABS/TPHA. VDRL/FTA-ABS 짝.", "img": "", "tag": ""}, {"n": 162, "sec": 3, "id": "세균3 22-10", "src": "세균각론3 · 22번(조3)", "q": "40세 남자가 고열, 각막충혈, 근육통 및 기침을 하면 피가 함께 나오는 객혈 때문에 병원에 왔다. 이러한 증상은 늦가을 장마 후 벼베기를 끝내고 2주 후에 나타났다. 원인균은 Fletcher 배지에서 배양 후 광학현미경으로는 관찰하지 못하였고 암시야 현미경으로 관찰이 가능하였다. 원인균의 발병기전은?", "opts": ["림프구의 파괴", "폐포세포의 파괴", "뇌신경세포의 파괴", "피부상피세포의 파괴", "혈관내피세포의 파괴"], "ans": 4, "hint": "벼베기+각막충혈+객혈+Fletcher/암시야 = 렙토스피라.", "why": "Leptospira는 작은 혈관의 내피세포(혈관내피)를 손상시켜 수막염·신부전·출혈을 야기한다.", "mem": "렙토스피라=혈관내피세포 파괴, Fletcher 배지, 암시야 현미경.", "img": "", "tag": ""}, {"n": 163, "sec": 3, "id": "세균3 23-1", "src": "세균각론3 · 23번(조3)", "q": "인수공통감염병이란 사람과 동물 사이에서 상호 전파되는 병원체에 의한 전염성 질병을 말한다. 다음 중 인수공통감염병을 일으키는 균이 아닌 것은?", "opts": ["Chlamydia pneumoniae", "Rickettsia prowazekii", "Chlamydia psittaci", "Coxiella burnetii", "Rickettsia typhi"], "ans": 0, "hint": "인수공통감염병이 아닌 것 찾기.", "why": "C. pneumoniae는 사람만을 숙주로 하며 사람-사람 전파를 한다(인수공통 아님).", "mem": "C.pneumoniae=사람 전용. psittaci(조류)/Coxiella(가축)/Rickettsia(절지동물)는 인수공통.", "img": "", "tag": ""}, {"n": 164, "sec": 3, "id": "세균3 23-4", "src": "세균각론3 · 23번(조3)", "q": "28세 여자가 소변을 볼 때 불편하고, 아랫배가 아프고 질 분비물이 나와 병원에 왔다. 질염이 의심되어 자궁경부를 생리식염수로 적신 면봉으로 도말한 후 그람염색을 하고 초콜릿한천배지와 McCoy 세포에서 배양을 시행하였다. 그람염색 후 현미경 검사에서 균은 발견되지 않았고, 초콜릿한천배지에서는 배양이 되지 않았다. McCoy 세포에서는 72시간 배양 후에 요오드 염색으로 세포내 봉입체를 확인할 수 있었다. 원인균의 특성으로 맞는 것은?", "opts": ["협막이 있음", "대부분의 세포를 감염시킬 수 있다", "망상체로 세포에 부착, 침입한다", "항포식작용의 협막이 있다", "세포 밖에서는 증식하지 못한다"], "ans": 4, "hint": "McCoy 세포+세포내 봉입체 = Chlamydia trachomatis.", "why": "C. trachomatis는 절대세포내 기생균이라 세포 밖에서는 증식하지 못한다.", "mem": "클라미디아=절대세포내 기생(세포밖 증식 X). 기본소체(감염형)/망상체(증식형). 부착·침입은 기본소체.", "img": "", "tag": ""}, {"n": 165, "sec": 3, "id": "세균3 23-5", "src": "세균각론3 · 23번(조3)", "q": "36세 남자가 열이 나고 점출혈이 있어 응급실에 왔다. 오늘 새벽부터 발열과 오한이 있었으며 증상 시작 후 약 12시간 후인 저녁 무렵부터 양측하지와 등에 점출혈(petechia)이 나타났다. 체온 39℃였다. 혈액과 뇌척수액 내부에 그람음성 쌍알균이 관찰되었다. 원인균의 중요한 병원성 인자로 혈청형을 결정하며 백신 물질이 되는 것은?", "opts": ["Polysaccharide capsule", "Outermembrane protein", "Lipooligosaccharide", "Porin", "Pili"], "ans": 0, "hint": "점출혈+그람음성 쌍알균 = N. meningitidis.", "why": "수막염균의 다당질 협막이 혈청형을 결정하고 백신 물질이 된다.", "mem": "수막염균=다당질 협막(serogroup/백신).", "img": "", "tag": ""}, {"n": 166, "sec": 3, "id": "세균3 23-6", "src": "세균각론3 · 23번(조3)", "q": "49세 남자가 한달 넘게 지속되는 기침으로 병원에 왔다. 기침은 점차 심해졌고 객혈과 체중감소, 야간발한의 증상이 동반되었다. 객담검사에서 항산성 세균이 관찰되었다. 원인균과 관련된 발병기전은?", "opts": ["협막의 항포식작용", "IL-10 유사물질을 분비", "Macrophage의 cytokine 분비 억제", "Macrophage의 apoptosis 촉진", "Phagolysosome 융합을 억제"], "ans": 4, "hint": "만성 기침+객혈+체중감소+야간발한+항산성균 = 결핵.", "why": "M. tuberculosis는 phagolysosome 융합을 억제하여 대식세포 내 생존한다.", "mem": "결핵=phagolysosome 융합 억제.", "img": "", "tag": ""}, {"n": 167, "sec": 3, "id": "세균3 23-7", "src": "세균각론3 · 23번(조3)", "q": "30대 남자가 자신의 성기에 병변이 생겨서 왔다. 한 달 전에 성기 부위에 통증이 없는 궤양이 있었고 지금은 겨드랑이와 손바닥 등에 구진이 나타나고 발열과 오한도 있다. 이 병의 진단을 위한 선별검사와 확진검사가 맞게 짝지어진 것은?", "opts": ["VDRL / FTA-ABS", "FTA-ABS / RPR", "FTA-ABS / VDRL", "RPR / VDRL", "VDRL / RPR"], "ans": 0, "hint": "무통성 궤양→손바닥 구진 = 2기 매독.", "why": "선별=비트레포네마(VDRL/RPR), 확진=트레포네마(FTA-ABS).", "mem": "매독 선별 VDRL → 확진 FTA-ABS.", "img": "", "tag": ""}, {"n": 168, "sec": 3, "id": "세균3 23-8", "src": "세균각론3 · 23번(조3)", "q": "8세 남아가 피로, 열감, 콧물 및 두통, 마른기침으로 병원에 왔다. 가슴 X선 사진에서 하부 폐에 반점형 혼탁이 관찰되었다. 객담 검체 배양 검사에서 계란 프라이형(fried-egg)의 작은 균 집락이 관찰되었다. 원인 균의 특성으로 맞는 것은?", "opts": ["알막대균 모양", "세포내 기생세균", "Sterol 포함한 세포막", "그람염색에서 분홍색 균", "Peptidoglycan ring이 있음"], "ans": 2, "hint": "비정형폐렴+fried-egg 집락 = Mycoplasma pneumoniae.", "why": "Mycoplasma는 세포막에 sterol을 함유하는 유일한 세균이다.", "mem": "Mycoplasma=무세포벽, sterol 함유 세포막, 그람염색 안됨, peptidoglycan 없음.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGTAWcDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAEC  왔다. 이러한 증상은 늦가을 장마 후 벼베기를 끝내고 2주 후에 나타났다. 원인균은 Fletcher 배지에서 배양 후 광학현미경으로는 관찰하지 못하였고 암시야 현미경으로 관찰이 가능하였다. 원인균의 발병기전은?", "opts": ["림프구의 파괴", "폐포세포의 파괴", "뇌신경세포의 파괴", "피부상피세포의 파괴", "혈관내피세포의 파괴"], "ans": 4, "hint": "벼베기+각막충혈+객혈+Fletcher/암시야 = 렙토스피라.", "why": "Leptospira는 혈관내피세포를 손상시켜 수막염·신부전·출혈을 일으킨다.", "mem": "렙토스피라=혈관내피세포 파괴, Fletcher 배지, 암시야.", "img": "", "tag": ""}, {"n": 171, "sec": 4, "id": "바이러스1 22-1", "src": "바이러스각론1 · 22번(조7)", "q": "HPV로 인한 자궁경부암의 진단에 대한 설명으로 맞는 것은?", "opts": ["캡시드 단백을 검출함으로써 암이라 진단할 수 있다.", "자궁경부암 조직이면 integrated HPV를 확인할 수 있다.", "Pap smear로 원반 세포가 발견되면 암이라 진단할 수 있다.", "자궁경부암 조직이면 각질층에서 HPV 입자를 확인할 수 있다.", "PCR로 16형과 18형이 아닌 형이 검출되면 암이라 진단할 수 있다."], "ans": 1, "hint": "HPV 자궁경부암 진단.", "why": "거의 모든 자궁경부암 조직은 숙주 염색체에 삽입된 integrated HPV DNA를 포함한다.", "mem": "자궁경부암=integrated HPV DNA. 캡시드/입자 검출 불가(점막 HPV), Pap 원반세포=감염 진단(암 X).", "img": "", "tag": ""}, {"n": 172, "sec": 4, "id": "바이러스1 22-2", "src": "바이러스각론1 · 22번(조7)", "q": "정상분만으로 태어난 신생아가 고열과 발작을 하였다. 피부에 작은 수포도 있었다. 아기의 엄마도 성기에 수포가 종종 생긴다고 하였다. 신생아 감염을 일으킨 가장 가능성이 높은 원인바이러스는?", "opts": ["Cytomegalovirus", "Varicella zoster virus", "Human Herpesvirus 6", "Herpes simplex virus 1", "Herpes simplex virus 2"], "ans": 4, "hint": "신생아 수포+전신감염+산모 성기 수포 = HSV-2.", "why": "산모의 성기 HSV-2가 산도를 통해 신생아에게 전파되어 전신 헤르페스 감염을 일으킨다.", "mem": "신생아 헤르페스=HSV-2(산도 전파). 산모 성기 수포가 단서.", "img": "", "tag": ""}, {"n": 173, "sec": 4, "id": "바이러스1 22-4", "src": "바이러스각론1 · 22번(조7)", "q": "간이식으로 면역억제제를 복용 중인 55세 남자가 2일 전부터 시작된 피부병변으로 병원에 왔다. 병변은 남자의 왼쪽 허리 부위에 국한되어 수포성으로 발생하였으며, 해당 부위에 국소적인 통증을 호소하였다. 환자에 대한 설명으로 맞는 것은?", "opts": ["피부에 VZV의 직접 접촉으로 병변이 일어난 것이다.", "발병 2차 전염에 호흡을 통해 VZV에 감염되었을 것이다.", "환자는 이전에 VZV에 감염된 적이 있었을 것이다.", "환자는 VZV 예방접종을 받았을 것이다.", "환자의 진단명은 수두이다."], "ans": 2, "hint": "면역억제+허리 분절 수포성 병변(대상포진) = 잠복 VZV 재활성화.", "why": "대상포진은 과거 감염된 VZV가 신경절에 잠복했다가 재활성화된 것이므로, 환자는 이전에 VZV에 감염된 적이 있다.", "mem": "대상포진=VZV 재활성화→과거 감염 필수. dorsal root ganglia 잠복.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBD  "바이러스1 23-5", "src": "바이러스각론1 · 23번(조3)", "q": "떨림, 간헐적 근육경련 및 운동 조정상실이 있는 65세 여자환자가 급속한 진행성 치매로 병원에 왔다. 뇌척수액과 혈청에서 세균 및 바이러스 감염 검사 결과는 음성이었다. 편도선 생검조직의 웨스턴블롯으로 원인체를 확인할 수 있었다. 원인체에 대한 설명으로 올바른 것은?", "opts": ["감염성 병원체이다.", "면역반응으로 인터페론이 생산된다.", "감염된 세포에서 봉입체가 발견된다.", "단백분해효소에 의하여 병원성이 상실된다.", "15분간의 고압증기멸균에서 병원성이 상실된다."], "ans": 0, "hint": "진행성 치매+세균/바이러스 음성+편도선 생검 = 프리온.", "why": "프리온은 핵산 없이 단백질로만 구성된 감염성 병원체이다.", "mem": "프리온: 단백질 감염체, 인터페론·봉입체 없음, 단백분해효소·고압증기멸균(15분) 저항.", "img": "", "tag": ""}, {"n": 180, "sec": 4, "id": "바이러스1 23-6", "src": "바이러스각론1 · 23번(조3)", "q": "3인 철종경기에 참석한 30대 남성이 사진과 같은 통증이 심한 수포성 발진으로 병원에 왔다. 의사는 대상포진으로 진단을 내렸다. 하지만 이 남성은 수두를 앓은 적이 없었다. 가장 적절한 설명은?", "opts": ["이 남성의 피부병변은 HSV가 재발한 것이다.", "이 남성은 vzv에 감염된 적이 있었을 것이다.", "이 남성은 vzv 예방접종을 받지 않았을 것이다.", "의사는 수두라고 진단을 내렸어야 한다.", "불충분한 증거로 확실한 진단을 내릴 수 없다."], "ans": 1, "hint": "통증 심한 수포성 발진(대상포진)+수두 병력 없음.", "why": "대상포진은 과거 잠복 VZV 재활성화이므로 이 남성은 과거 VZV에 감염된 적이 있다(무증상/경증이었을 수 있음).", "mem": "대상포진=VZV 재활성화→과거 감염. 무증상 감염도 가능.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCADvAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDtBknOad09zTAR2pwrMRx/xWb/AIpG4A/vDNeP2ONnI5r174q4/wCEPuCecuAK8ftjn6eorOZ00di6Dk4FTRndwcetV0z65qzCnc+lSdCL0YOwYphJQHdgUscm0Bc8VH  "src": "바이러스각론1 · 23번(조3)", "q": "정상분만으로 출생한 건강한 신생아가 3주 뒤에 소리에 반응하지 않았고 점차 지능저하 증상이 관찰되었다. 신생아 소변에서 원인 바이러스 항원이 검출되었다. 가장 가능성이 높은 원인바이러스에 감염된 세포의 cytopathologic effect는?", "opts": ["원반세포 (Koilocyte)", "코드리 A (Cowdry A)", "부엉이 눈 (Owl's eye)", "네그리 소체 (Negri inclusion body)", "클라미디어 소체 (chlamydial body)"], "ans": 2, "hint": "신생아 청력소실+지능저하(선천감염)+소변 항원 = CMV.", "why": "CMV의 CPE는 Owl's eye(호염기성 핵내봉입체)이다.", "mem": "CMV=Owl's eye. Koilocyte=HPV, Cowdry A=HSV, Negri=Rabies.", "img": "", "tag": ""}, {"n": 183, "sec": 4, "id": "바이러스1 23-9", "src": "바이러스각론1 · 23번(조3)", "q": "6세 여아가 열, 두통, 근육통 등과 같은 비특이 증상 후 1주일 정도 뒤에 마치 뺨을 맞은 것처럼 명확한 발진이 양쪽 뺨에 생기면서 전신으로 퍼지는 반구진 발진으로 병원에 왔다. 함께 방문한 엄마는 양쪽 손 관절에 심한 관절통과 부종을 호소하였다. 의사는 남자 아이와 엄마의 증상은 어떤 기작에 의한 것인가?", "opts": ["면역복합체", "Syncytia 형성", "바이러스의 세포파괴", "세포매개면역반응", "Cytokine storm"], "ans": 0, "hint": "slapped cheek+관절통 = Parvovirus B19 감염홍반.", "why": "발진과 관절통은 항체가 형성한 면역복합체에 의한 것이다.", "mem": "감염홍반 2단계=면역복합체.", "img": "", "tag": ""}, {"n": 184, "sec": 4, "id": "바이러스1 23-10", "src": "바이러스각론1 · 23번(조3)", "q": "운동을 하지 않던 20대 여성이 산행을 다녀오고 아래와 같은 물집이 입 주변에 생겼다. 이 원인바이러스와 바이러스가 잠복하였을 기관은?", "opts": ["HSV-1, Dorsal root ganglia", "HSV-2, Trigeminal ganglia", "HSV-2, Sacral ganglia", "VZV, Dorsal root ganglia", "HSV-1, Trigeminal ganglia"], "ans": 4, "hint": "입 주변 물집 = HSV-1, 삼차신경절.", "why": "입술헤르페스는 HSV-1이며 삼차신경절에서 잠복한다.", "mem": "Oral HSV-1=trigeminal ganglia.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCADZAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAw 형이며 선천성 풍진증후군을 일으킨다(MMR 백신).", "mem": "풍진=Rubella, 단일 혈청형, 선천성 풍진증후군. measles/mumps/rubella 모두 단일 혈청형.", "img": "", "tag": ""}, {"n": 188, "sec": 5, "id": "바이러스2 21-7", "src": "바이러스각론2 · 21번(조10)", "q": "아래의 그래프를 보고 이 HIV 감염자에 대한 설명으로 가장 적절한 것을 고르시오.", "opts": ["감염 후 3주부터 나타난 단핵구증과 유사한 증상은 수년간 지속되었다.", "감염 후 6주부터 항 HIV 바이러스 약을 복용하였다.", "감염 후 9주까지 기회감염의 위험성이 매우 높았다.", "감염 후 9주부터 9년까지 바이러스가 증식하지 않는 임상적 잠복기를 가졌다.", "감염 후 7년 정도에 후천성면역결핍증으로 진단을 받았다."], "ans": 4, "hint": "HIV 자연경과 그래프.", "why": "CD4 T세포가 200/uL 이하로 떨어지는 약 7년 시점에 AIDS로 진단한다.", "mem": "AIDS=CD4<200/uL(약 7년). 잠복기에도 림프절에서 바이러스 증식.", "img": "", "tag": ""}, {"n": 189, "sec": 5, "id": "바이러스2 21-10", "src": "바이러스각론2 · 21번(조10)", "q": "71세 여성이 38℃ 이상의 고열과 두통, 전신 권태, 근육통과 기침으로 왔다. 숨이 차고 호흡이 곤란하였다. 가슴 X선에서 폐 침윤의 폐렴 소견을 보였다. 객담 검사에서 세균배양은 음성, 코로나 RT-PCR에서 양성이었다. 원인 바이러스에 관한 설명으로 옳지 않은 것은?", "opts": ["세포막에서 budding으로 방출한다.", "Early gene product로는 RdRp가 있다.", "주로 비말을 통해 전파된다.", "상기도, 하기도, 위장관이 target 기관이다.", "Spike glycoprotein은 tissue tropism에 영향을 미친다."], "ans": 0, "hint": "코로나(SARS-CoV-2) 폐렴.", "why": "Coronavirus는 ER/Golgi에서 budding 후 exocytosis로 방출되며 세포막에서 budding하지 않는다.", "mem": "Coronavirus=ER/Golgi budding→exocytosis. Spike=ACE2 tropism, RdRp early gene.", "img": "", "tag": ""}, {"n": 190, "sec": 5, "id": "바이러스2 23-1", "src": "바이러스각론2 · 23번(조3)", "q": "여름 캠프에 다녀온 초등학생이 열과 두통을 호소하다가 의식이 저하되고 경련을 일으켰다. 아이에게 모기 물린 자국이 많이 있었다. 가장 가능성이 높은 원인 바이러스에 대한 설명으로 맞는 것은?", "opts": ["Zoonosis를 일으킨다.", "세포막에서 외피를 얻는다.", "비리온 안에 RdRp를 가진다.", "백신이 없다.", "회복에 항체가 중요하다."], "ans": 0, "hint": "여름+모기+뇌염 = 일본뇌염.", "why": "일본뇌염은 인수공통감염(zoonosis)을 일으킨다.", "mem": "JEV=zoonosis(모기). 백신 있음, +RNA(RdRp early gene), 외피 ER/Golgi.", "img": "", "tag": ""}, {"n": 191, "sec": 5, "id": "바이러스2 23-4", "src": "바이러스각론2 · 23번(조3)", "q": "어린이집에 다니는 3세 여아가 열이 나고 칭얼거리고 음식을 먹지 않았다. 입안을 보니 수포가 있었고 손과 발에도 비슷한 수포를 관찰할 수 있었다. 원인바이러스가 주로 일으키는 질병/증상이 아닌 것은?", "opts": ["심근염", "수막염", "결막염", "마비증상", "설사증상"], "ans": 4, "hint": "수족구병(입+손발 수포) = Coxsackievirus.", "why": "Coxsackievirus는 심근염·수막염·결막염·마비 등을 일으키나 설사는 주 증상이 아니다.", "mem": "Coxsackievirus 증상: 수족구, 심근염, 무균수막염, 결막염, 마비. 설사는 주증상 아님.", "img": "", "tag": ""}, {"n": 192, "sec": 5, "id": "바이러스2 23-5", "src": "바이러스각론2 · 23번(조3)", "q": "성질이 난폭했던 야생너구리에게 물린 사람이 병원에 왔다. 광견병에 걸린 너구리라고 생각되었다. 적절한 조치에 해당하는 것은?", "opts": ["상처를 비누와 물로 세척", "HRIG(면역글로불린)을 정맥 주입", "광견병 백신을 물린 부위에 접종", "깊이 물린 상처는 바로 봉합", "표면적 상처는 얇게 절개"], "ans": 0, "hint": "광견병 의심 교상 후 조치.", "why": "상처를 비누와 물로 잘 세척하는 것이 적절하다.", "mem": "광견병 노출: 상처 비누+물 세척, HRIG는 물린 부위+근육(IV X), 백신은 삼각근(물린부위 X), 봉합 피함.", "img": "", "tag": ""}, {"n": 193, "sec": 5, "id": "바이러스2 23-6", "src": "바이러스각론2 · 23번(조3)", "q": "소두증을 가진 아기가 태어났다. 산모는 임신 4주째 얼굴, 목, 등에 연한 반점상발진이 있었다고 한다. 이 때 미열이 있었고, 감기와 비슷한 증상과 함께 손과 무릎 관절에 경직이 있었지만, 출산 전까지 아무런 처치나 치료를 받지 않았다. 사람만 감염시키는 단일 혈청형을 가지는 원인바이러스에 대한 설명으로 맞는 것은?", "opts": ["불활성화 백신이 있음", "항체는 태아 감염을 막지는 못함", "RdRp를 비리온 안에 가지고 있음", "Double capsid를 가지고 있음", "세포막에서 Budding으로 방출"], "ans": 4, "hint": "선천성 감염+산모 발진/관절염 = 풍진(Rubella, Togaviridae).", "why": "Rubella virus(Togaviridae, +ssRNA, enveloped)는 세포막에서 budding으로 방출된다.", "mem": "풍진=Togaviridae, +RNA(RdRp 비리온에 없음), 외피 budding, MMR 약독화 생백신.", "img": "", "tag": ""}, {"n": 194, "sec": 5, "id": "바이러스2 23-7", "src": "바이러스각론2 · 23번(조3)", "q": "40세 남자가 9월에 벌초 후에 발열, 오한, 두통이 나타나고 안면홍조와 출혈반점이 있어 병원에 왔다. 발열 후 5일경에 혈압저하가 나타나 3일간 지속되며, 신부전으로 인한 질소혈증, 심한 단백뇨가 동반되었다. 원인 바이러스의 특징이 아닌 것은?", "opts": ["쥐가 자연 숙주", "외피보유바이러스", "골지에서 외피 얻음", "작은소참진드기 매개", "분절로 이루어진 RNA genome"], "ans": 3, "hint": "벌초+신부전+출혈 = 신증후군출혈열(Hantavirus).", "why": "Hantavirus는 쥐(설치류)가 매개하며, 작은소참진드기 매개는 SFTS이다.", "mem": "Hantavirus=설치류 매개. 작은소참진드기=SFTS. 둘 다 Bunyavirales.", "img": "", "tag": ""}, {"n": 195, "sec": 1, "id": "세균1 21-6", "src": "세균각론1 · 21번(조12)", "q": "생후 1주일된 신생아가 목의 경직과 고열로 왔다. 산모는 임신 중 체험목장을 방문하여 살균되지 않은 우유를 먹었고, 이후 약한 감기 증상을 앓았다고 하였다. 신생아의 뇌척수액에서 그람양성 짧은 막대균이 발견되었다. 원인균의 특성으로 맞지 않는 것은?", "opts": ["한냉증균", "감염제어에 항체 중요", "End-over-end 운동성", "Actin assembly 유도", "세포질 내 증식"], "ans": 1, "hint": "살균안된 우유+신생아 수막염+그람양성 짧은 막대균 = L. monocytogenes.", "why": "Listeria는 세포내 기생균이라 세포매개면역이 중요하며 항체의 역할은 미미하다('항체 중요'가 틀림).", "mem": "Listeria: cold enrichment, end-over-end 운동(텀블링), actin 기반 이동, 세포질 증식, 세포매개면역 중요.", "img": "", "tag": ""}, {"n": 196, "sec": 1, "id": "세균1 21-7", "src": "세균각론1 · 21번(조12)", "q": "태어난지 일주일 된 신생아가 수막염 증상으로 병원에 왔다. CSF 배양에서 나온 원인균은 운동성이 없는 그람양성알균이었으며 혈액우무배지에서 베타용혈이 나타났다. 가장 가능성이 높은 원인균은?", "opts": ["Streptococcus pneumoniae", "Streptococcus agalactiae", "Staphylococcus aureus", "Corynebacterium diphtheria", "Listeria monocytogenes"], "ans": 1, "hint": "신생아 수막염+베타용혈+그람양성알균 = S. agalactiae(GBS).", "why": "S. agalactiae는 신생아 수막염·패혈증을 일으키며 베타용혈을 보인다.", "mem": "신생아 수막염 그람양성알균=GBS(agalactiae). S.pneumoniae=알파용혈, Listeria=막대균.", "img": "", "tag": ""}, {"n": 197, "sec": 1, "id": "세균1 21-8", "src": "세균각론1 · 21번(조12)", "q": "항생제 연관 위막성 대장염은 치료한 후에도 재발하는 경우가 많은데 그 이유는?", "opts": ["절대 혐기성 균이기 때문", "Binary toxin을 생성하기 때문", "아포를 형성하는 균이기 때문", "세포내 기생할 수 있는 세균이기 때문", "Enterotoxin과 cytotoxin을 생성하기 때문"], "ans": 2, "hint": "항생제 연관 위막성 대장염 = C. difficile.", "why": "C. difficile는 아포(spore)를 형성하기 때문에 항생제 치료 후에도 아포가 살아남아 재발한다.", "mem": "C.difficile 재발=아포 형성(치료 후 생존). FMT로 치료.", "img": "", "tag": ""}, {"n": 198, "sec": 1, "id": "세균1 21-9", "src": "세균각론1 · 21번(조12)", "q": "자취하는 대학생이 아침에 만들어 놓은 볶음밥을 식탁에 놓고 학교에 간 후, 저녁에 데워 식사했다. 3시간쯤 지나 갑작스러운 구역, 구토 및 복통 증상을 나타냈고 다음 날 오전까지 지속되었다가 특별한 치료 없이 회복되었다. 다음 중 원인 균은?", "opts": ["Bacillus cereus", "Clostridium botulinum", "Listeria monocytogenes", "Clostridium perfringens", "Staphylococcus epidermidis"], "ans": 0, "hint": "볶음밥(쌀)+빠른 구토+짧은 경과 = B. cereus 구토형 식중독.", "why": "B. cereus 구토형 식중독은 오염된 쌀이 주원인이며 빠른 발현·24시간 내 회복이 특징.", "mem": "볶음밥 구토형=B.cereus. C.botulinum은 1~3일 후, C.perfringens는 8~12시간 후.", "img": "", "tag": ""}, {"n": 199, "sec": 1, "id": "세균1 21-10", "src": "세균각론1 · 21번(조12)", "q": "백신 맞기를 거부하는 가족의 3세 여아가 목이 붓고 숨쉬기를 힘들어하여서 응급실에 왔다. 인두에 삼출물과 회백색의 위막이 있었고, 삼출물에서 곤봉모양의 그람양성막대균을 확인할 수 있었다. 이 균의 독소의 발병기전은?", "opts": ["Superantigen", "세포막에 pore형성", "세포내 cAMP 증가 유도", "신경세포의 acetylcholine 억제", "EF-2를 불활성하여 단백 합성 억제"], "ans": 4, "hint": "회백색 위막+곤봉모양 그람양성막대균 = 디프테리아.", "why": "Diphtheria toxin은 EF-2를 불활성화시켜 단백질 합성을 억제한다.", "mem": "디프테리아=EF-2 불활성(단백합성 억제). 위막+곤봉모양이 단서.", "img": "", "tag": ""}, {"n": 200, "sec": 2, "id": "세균2 22-5", "src": "세균각론2 · 22번", "q": "유치원 아이들이 집단적으로 발열과 혈변성 설사로 병원에 왔다. 그 중 2명의 아이는 소변이 잘 나오지 않는 증상을 보였다. MacConkey Sorbitol 배양검사에서 무색투명한 집락이 관찰되었다. 가장 가능성이 높은 원인균은?", "opts": ["Enterotoxigenic E. coli", "Enterohemorrhagic E. coli", "Enteroinvasive E. coli", "Salmonella enterica", "Shigella sonnei"], "ans": 1, "hint": "혈변성 설사+HUS(소변 안나옴)+Sorbitol MacConkey 무색 = EHEC(O157:H7).", "why": "EHEC O157:H7은 sorbitol을 발효하지 못해 SMAC에서 무색 집락을 형성하고 Shiga toxin으로 HUS를 일으킨다.", "mem": "EHEC O157:H7=혈변+HUS, Sorbitol 비발효(무색), Shiga toxin. 용혈요독증후군(HUS).", "img": "", "tag": ""}, {"n": 201, "sec": 1, "id": "세균1 23-1", "src": "세균각론1 · 23번(조3)", "q": "28세 남자가 오토바이 사고로 다리의 개방형 골절을 입었다. 골절 부위에 가스가 찬 물집이 보이고 검게 변하며 괴사가 시작되었다. 상처 주위에서 염증세포는 관찰되지 않았다. 이 현상과 관련이 있는 이 균의 독소는?", "opts": ["Tetanus toxin", "Alpha toxin", "Diphtheria toxin", "Lethal toxin", "Botulinum toxin"], "ans": 1, "hint": "개방골절+가스 찬 물집+괴사+염증세포 없음 = 가스괴저(C. perfringens).", "why": "C. perfringens의 alpha toxin(lecithinase)이 가스괴저를 일으키며 괴사부에 염증세포가 보이지 않는다.", "mem": "가스괴저=C.perfringens alpha toxin. Tetanus=C.tetani, Lethal=B.anthracis, Botulinum=C.botulinum.", "img": "", "tag": ""}, {"n": 202, "sec": 1, "id": "세균1 23-2", "src": "세균각론1 · 23번(조3)", "q": "20세 여자가 탐폰을 사용한 후 갑자기 고열, 두통, 근육통, 복통이 시작되었고, 이후 전신 피부에 붉은 반점이 생겨 응급실에 왔다. 도착 시 혈압 80/50, 맥박 140회/분. 혈액 백혈구·간 효소 수치 상승. 혈액·뇨·뇌척수액 배양에서 균 집락이 없었으나 질 분비액에서 Staphylococcus aureus 집락이 확인되었다. 이 질병의 원인 독소와 같은 기작을 가지는 독소는?", "opts": ["Bacillus anthracis - edema toxin", "Clostridium tetani - tetanus toxin", "Staphylococcus aureus - Exfoliative toxin", "Streptococcus pyogenes - pyrogenic exotoxin", "Corynebacterium diphtheria - Diphtheria toxin"], "ans": 3, "hint": "탐폰+sunburn 양 발진+전신증상, 균은 국소에만 = TSS(TSST-1, superantigen).", "why": "TSST-1은 초항원(superantigen)이며, 같은 초항원 기작을 가진 것은 S. pyogenes의 pyrogenic exotoxin이다.", "mem": "TSST-1=초항원. 같은 초항원 기작=S.pyogenes pyrogenic exotoxin. edema/tetanus/diphtheria는 다른 기전.", "img": "", "tag": ""}, {"n": 203, "sec": 1, "id": "세균1 23-3", "src": "세균각론1 · 23번(조3)", "q": "70세 여자가 급성 폐렴으로 항생제를 1주일째 복용하던 중 갑자기 복통과 함께 녹색의 점액성 설사가 시작되어 병원에 왔다. 대장 내시경으로 위막성 장염이 관찰되었다. 원인 균의 특성으로 맞지 않는 것은?", "opts": ["Endospore 형성", "Facultative anaerobe", "Metronidazole로 치료", "Vancomycin으로 치료", "Enterotoxin와 cytotoxin으로 인한 증상"], "ans": 1, "hint": "항생제 복용+위막성 장염 = C. difficile.", "why": "Clostridium은 obligate anaerobe이다. Facultative anaerobe가 틀렸다.", "mem": "C.difficile=obligate anaerobe, 아포형성, toxinA/B, 경증 metronidazole·중증 vancomycin, 재발 FMT.", "img": "", "tag": ""}, {"n": 204, "sec": 1, "id": "세균1 23-4", "src": "세균각론1 · 23번(조3)", "q": "9세 남아가 혈뇨, 부종, 단백뇨 등과 같은 급성 사구체신염의 증상으로 병원에 왔다. 이 환자는 3주 전에 혈액우무배지에서 베타용혈을 보이는 group A 사슬알균에 의한 급성인후염을 앓았었다. 이 환자의 질병 유발 기전으로 가장 적합한 것은?", "opts": ["면역복합체의 침착으로 인한 사구체 기저막의 염증반응", "용혈소(hemolysin) 작용으로 인한 적혈구 파괴", "내독소에 의한 혈관내피세포의 투과도 변화", "외독소에 의한 사구체 기저막의 투과도 변화", "항체의 교차반응을 통한 사구체 기저막에 대한 항체의존성 세포독성"], "ans": 0, "hint": "GAS 인두염 3주 후 급성사구체신염(PSGN).", "why": "PSGN은 면역복합체가 사구체 기저막에 침착하여 염증을 일으킨다.", "mem": "PSGN=면역복합체 침착. 류마티스열은 교차반응(class I M protein).", "img": "", "tag": ""}, {"n": 205, "sec": 1, "id": "세균1 23-5", "src": "세균각론1 · 23번(조3)", "q": "자연분만한 신생아가 뇌수막염으로 진단되었다. 뇌척수액에서 짧은 사슬모양의 그람양성알균이 검출되었다. 원인 균의 특징으로 맞는 것은?", "opts": ["베타용혈", "한랭증균(Listeria)", "Catalase (+)", "Coagulase (+)", "Bacitracin 감수성(S. pyogenes)"], "ans": 0, "hint": "신생아 수막염+짧은 사슬 그람양성알균 = S. agalactiae(GBS).", "why": "S. agalactiae는 베타용혈을 보인다.", "mem": "신생아 수막염 그람양성알균=GBS(agalactiae), 베타용혈. catalase 음성(연쇄구균), bacitracin 저항(GBS).", "img": "", "tag": ""}, {"n": 206, "sec": 1, "id": "세균1 23-6", "src": "세균각론1 · 23번(조3)", "q": "무더운 여름날 25세 직장 여성이 하루 종일 상온에 방치되었던 찬밥으로 김치볶음밥을 조리하여 저녁식사를 한 후 6시간쯤 지나 갑작스러운 구역, 구토 및 복통 증상을 나타내었다. 증상은 다음 날 오전까지 지속되었고 이후 특별한 치료 없이 저절로 회복되었다. 상복부 증상 이외에 발열이나 설사 등의 증상은 동반되지 않았다. 원인균으로 적합한 것은?", "opts": ["Staphylococcus epidermidis", "Bacillus cereus", "Clostridium botulinum", "Listeria monocytogenes", "Clostridium perfringens"], "ans": 1, "hint": "찬밥(쌀)+빠른 구토+짧은 경과 = B. cereus 구토형 식중독.", "why": "B. cereus 구토형 식중독은 오염된 쌀(볶음밥)이 주원인이며 heat-stable 장독소로 빠른 발현·짧은 경과.", "mem": "볶음밥/찬밥 구토형=B.cereus. S.aureus도 가능하나 그람양성알균.", "img": "", "tag": ""}, {"n": 207, "sec": 1, "id": "세균1 23-7", "src": "세균각론1 · 23번(조3)", "q": "82세 남자가 갑자기 몸이 춥고, 고열, 혈액이 있는 가래기침 증상으로 병원에 왔다. 가슴 X선 촬영 결과에서 아래 폐의 짙은 경화가 관찰되었다. 객담에서 분리된 균을 그람염색해서 사진과 같았다. 이 균의 특성으로 맞는 것은?", "opts": ["옵토킨(optochin)에 저항성", "혈액우무배지에서 베타용혈", "Pyrogenic toxin으로 염증유발", "담즙 용해에 저항성", "협막으로 항포식작용"], "ans": 4, "hint": "폐경화+그람양성 쌍알균 = S. pneumoniae.", "why": "S. pneumoniae는 협막(polysaccharide capsule)으로 항포식작용을 하는 것이 주 독성기전이다.", "mem": "폐렴구균=협막 항포식. optochin 감수성, 알파용혈, 담즙용해 감수성.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFBAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDaMxb53PJ61ZgeIdsZrPkZmYKaswRDrk1nc7rKxdCoRkCpFAC9KWAAjBFTtGm0k/lSMiJxlRjmoCMcFTU6Ej8Kf5e4g0AVDlOTTWnx3qWVOSfSqE7qmeeaaNIq4lxdOv8AGcVasrzdgZzWBeXDBgA1W9Kkd3HFNrQ1lTXKdQpDLmnbttRI/wAg9acpzzmoONofyTz0ppbBpGkJHFMIzzmgLDz7UjZxgnNLg4GaaxJoEK7hVH 비즈니스 여행에서 소 농장을 방문하고 돌아온 후 팔의 상처가 붓고 궤양이 생긴 후에 새까만 가피가 생겼다. 남자는 열이 나고 몸살이 나는 증상도 있었다. 피부 검체로부터 아포를 생성하는 그람양성균이 배양되었다. 이 균의 독소 중 zinc protease로 작용하는 것은?", "opts": ["Protective antigen", "Lethal factor", "Alpha toxin", "Edema factor", "Enterotoxin"], "ans": 1, "hint": "소 접촉+검은 가피+아포형성 그람양성균 = 피부탄저(B. anthracis).", "why": "B. anthracis의 Lethal factor는 zinc protease로 MAPKK를 절단한다.", "mem": "탄저 Lethal factor=zinc protease(MAPKK 절단). Edema factor=adenylate cyclase(cAMP↑).", "img": "", "tag": ""}, {"n": 210, "sec": 1, "id": "세균1 23-10", "src": "세균각론1 · 23번(조3)", "q": "아프리카 의료선교센터에 8세 어린이가 목이 전체적으로 붓고 삼키는 것과 숨쉬는 것이 힘든 상태로 왔다. 아이의 인두에 단단하게 붙어있는 두터운 회백색의 위막을 볼 수 있었다. 심장과 신경 합병증을 일으킬 수 있는 원인균의 독소 기작은?", "opts": ["단백질 합성 억제", "신경전달물질 분비 억제", "G단백에 의한 신호전달 저해", "초항원 작용", "cAMP농도 증가"], "ans": 0, "hint": "두터운 회백색 위막+후두 폐쇄 = 디프테리아.", "why": "Diphtheria toxin은 EF-2를 불활성화하여 단백질 합성을 억제하며 심장·신경 합병증을 일으킨다.", "mem": "디프테리아=단백합성 억제(EF-2), 심근염·신경마비 합병증.", "img": "", "tag": ""}, {"n": 211, "sec": 5, "id": "바이러스2 21-1", "src": "바이러스각론2 · 21번(조10)", "q": "Arbovirus가 아닌 것은?", "opts": ["Zika virus", "Rubella virus", "West Nile virus", "Yellow fever virus", "Chikungunya virus"], "ans": 1, "hint": "Arbovirus(절지동물 매개)가 아닌 것 찾기.", "why": "Rubella virus는 호흡기(비말) 전파이며 절지동물 매개가 아니다.", "mem": "Arbovirus=Zika/West Nile/Yellow fever/Chikungunya(모기). Rubella는 호흡기 전파.", "img": "", "tag": ""}, {"n": 212, "sec": 5, "id": "바이러스2 21-5", "src": "바이러스각론2 · 21번(조10)", "q": "46세의 여자가 구토와 설사로 응급실로 왔다. 스키리조트로 여행을 다녀왔다고 한다. 그 리조트에 머문 다수의 다른 스키어들 역시 같은 증상으로 병원으로 갔다고 한다. 조사 결과 리조트 식당에서 공급된 조개류의 일부가 원인 병원체에 오염되어 있었다. 환자는 피로감과 두통, 근육통이 있지만 변에서 혈액이나 농은 관찰되지 않았고 이틀 후 호전되었다. 가장 가능성이 높은 병원체는?", "opts": ["Norovirus", "Enterovirus", "Coronavirus", "Zika virus", "Rotavirus"], "ans": 0, "hint": "조개류+집단 위장염+무혈변+빠른 호전 = Norovirus.", "why": "Norovirus는 오염된 조개류로 집단 식중독을 일으키며 며칠 내 호전된다.", "mem": "조개류 집단 위장염=Norovirus. Rotavirus는 주로 영아.", "img": "", "tag": ""}, {"n": 213, "sec": 5, "id": "바이러스2 21-6", "src": "바이러스각론2 · 21번(조10)", "q": "다음 중 +RNA genome으로부터 -RNA를 만들고 -RNA를 template로 하여 mRNA를 합성하는 바이러스가 아닌 것은?", "opts": ["Norovirus", "Dengue virus", "SARS-CoV-2", "MERS-CoV", "Chikungunya virus"], "ans": 0, "hint": "+RNA→-RNA→mRNA 안하는 것 찾기.", "why": "Norovirus는 +RNA를 직접 mRNA로 번역하며 -RNA 중간체를 거치지 않는다.", "mem": "Norovirus=+RNA 직접 번역. Coronavirus/Flavivirus는 -RNA template 거침.", "img": "", "tag": ""}, {"n": 214, "sec": 5, "id": "바이러스2 21-8", "src": "바이러스각론2 · 21번(조10)", "q": "SARS-CoV-2의 viral protease를 억제하는 기작을 가진 약제는?", "opts": ["Dolutegravir", "Molnupiravir", "Ritonavir", "Paxlovid", "Remdesivir"], "ans": 3, "hint": "SARS-CoV-2 protease 억제제.", "why": "Paxlovid(nirmatrelvir/ritonavir)는 viral protease를 억제한다.", "mem": "Paxlovid=protease 억제. Remdesivir/Molnupiravir=RdRp, Dolutegravir=HIV integrase.", "img": "", "tag": ""}, {"n": 215, "sec": 5, "id": "바이러스2 21-9", "src": "바이러스각론2 · 21번(조10)", "q": "노로바이러스와 로타바이러스의 공통점은?", "opts": ["백신이 있다.", "외피가 없다.", "치료제가 있다.", "배양할 수 있다.", "+RNA genome을 가진다."], "ans": 1, "hint": "Norovirus와 Rotavirus 공통점.", "why": "두 바이러스 모두 외피가 없는(naked) 바이러스이다.", "mem": "공통=naked. Noro=+ssRNA/백신없음, Rota=dsRNA/생백신. 둘 다 치료제 없음.", "img": "", "tag": ""}, {"n": 216, "sec": 5, "id": "바이러스2 22-2", "src": "바이러스각론2 · 22번(조7)", "q": "7월 말경 65세 남자가 갑작스런 고열로 왔다. 전신 권태, 인후통으로 시작하여 욕지기, 구토가 있다가 목 근육의 강직이 왔으며 의식이 혼미하여졌다. 최근 외국은 다녀온 적이 없다고 하였다. 원인 병원체는 외피가 있는 RNA 바이러스였다. 가장 가능성이 높은 원인바이러스의 매개체는?", "opts": ["쥐(Hanta virus, Lassa fever)", "모기(Dengue, Yellow fever, Zika, Chikungunya, 일본뇌염)", "몸이(배recurrent감염)", "좀진드기(작은소참진드기 dabie banda)", "참진드기"], "ans": 1, "hint": "여름+뇌염+외피 RNA virus+해외력 없음 = 일본뇌염(Arbovirus).", "why": "일본뇌염은 Culex(집모기)가 매개한다(국내 존재). 뎅기 매개 Aedes는 국내에 없음.", "mem": "일본뇌염=집모기(Culex) 매개. 7~12월 발생. 외피 RNA 바이러스.", "img": "", "tag": ""}, {"n": 217, "sec": 5, "id": "바이러스2 22-3", "src": "바이러스각론2 · 22번(조7)", "q": "다음 중 SARS-CoV-1에 대한 설명으로 맞지 않는 것은?", "opts": ["주로 비말을 통해 전파된다.", "세포 수용체는 ACE2이다.", "상기도, 하기도, 위장관이 primary target이다.", "Spike glycoprotein은 tissue tropism에 영향을 미친다.", "Early gene으로 spike glycoprotein이 있다."], "ans": 4, "hint": "SARS-CoV-1 설명 중 틀린 것.", "why": "Spike glycoprotein은 structural protein으로 late gene에 속한다. Early gene에는 RdRp 등이 있다.", "mem": "Spike=structural protein(late gene). Early gene=RdRp. ACE2 수용체, 비말 전파.", "img": "", "tag": ""}, {"n": 218, "sec": 5, "id": "바이러스2 22-4", "src": "바이러스각론2 · 22번(조7)", "q": "어린이집에 다니는 3세 여아가 열이 나고 칭얼거리고 음식을 먹지 않았다. 입안과 손과 발에도 비슷한 수포를 관찰할 수 있었다. 다음 중 적절한 조치는?", "opts": ["원인 병원체를 알기 위해 진단검사를 의뢰한다.", "병원에 가서 수액을 처방한다.", "보호자는 아이와 밀폐된 공간에 오래 있지 않는다.", "Acyclovir 연고를 수포성 병터에 발라준다.", "다 나을 때까지 어린이집에 보내지 않는다."], "ans": 4, "hint": "수족구병(입+손발 수포) = Coxsackievirus.", "why": "수족구는 전염력이 강하므로(특히 세균이 아닌 바이러스) 다 나을 때까지 어린이집에 보내지 않는 것이 적절하다.", "mem": "수족구=Coxsackie, 전염력 강함→격리. 일상증상(보존치료), Acyclovir는 HSV용(무효).", "img": "", "tag": ""}, {"n": 219, "sec": 5, "id": "바이러스2 22-7", "src": "바이러스각론2 · 22번(조7)", "q": "경기도 포천에 거주하는 55세 남자 농부가 늦가을 추수 후에 3일 전부터 시작된 사지의 근육통으로 병원에 왔다. 당시 체온 38.3℃, 혈압 110/90. 입원 후 오한, 전신 쇠약감, 두통, 안구통 등의 증상을 보인 후에 결막출혈, 안면홍조, 겨드랑이에 점상출혈 등이 관찰되었다. 설치류 유래인 원인바이러스는?", "opts": ["Hantavirus", "Dabie bandavirus", "Yellow fever virus", "Ebola virus", "Echovirus"], "ans": 0, "hint": "추수+신부전/출혈+설치류 유래 = Hantavirus.", "why": "Hantavirus는 설치류 유래(쥐 배설물 호흡기 흡입)이며 신증후군출혈열을 일으킨다.", "mem": "Hantavirus=설치류 유래. Dabie bandavirus(SFTS)=진드기, Ebola=출혈열이나 설치류 아님.", "img": "", "tag": ""}, {"n": 220, "sec": 5, "id": "바이러스2 22-10", "src": "바이러스각론2 · 22번(조7)", "q": "겨울에 영아와 소아에서 세기관지염, 폐렴을 일으킬 수 있으며, 위험군 영유아를 대상으로 monoclonal antibody로 예방이 가능한 바이러스는?", "opts": ["Rhinovirus", "Influenza virus", "Metapneumovirus", "Parainfluenza virus", "Respiratory syncytial virus"], "ans": 4, "hint": "겨울+영아 세기관지염/폐렴+단클론항체 예방 = RSV.", "why": "RSV는 위험군 영유아에게 palivizumab(monoclonal antibody)으로 예방한다.", "mem": "RSV=palivizumab(단클론항체) 예방. Rhinovirus는 감기.", "img": "", "tag": ""}];
const SEC = {1:"01 세균 그람양성",2:"02 세균 그람음성",3:"03 세균 기타세균",4:"04 바이러스 DNA·레트로·프리온",5:"05 바이러스 RNA·간염"};
const SECSHORT = {1:"그람양성",2:"그람음성",3:"기타세균",4:"DNA·프리온",5:"RNA·간염"};

// session state (in-memory; persists for the session)
const state = { answered:{}, correct:{}, view:"all" };

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const KEYS = ["A","B","C","D","E","F","G"];

function visibleList(){
  let list = DATA;
  if(state.view==="wrong"){
    list = DATA.filter(q => state.answered[q.n] && !state.correct[q.n]);
  } else if(state.view!=="all"){
    const s = parseInt(state.view,10);
    list = DATA.filter(q => q.sec===s);
  }
  return list;
}

function renderStats(){
  const list = visibleList();
  const shown = list.length;
  let done=0, wrong=0;
  for(const q of list){
    if(state.answered[q.n]){ done++; if(!state.correct[q.n]) wrong++; }
  }
  document.getElementById("st-shown").textContent = shown;
  document.getElementById("st-done").textContent = done;
  document.getElementById("st-wrong").textContent = wrong;
}

function cardHTML(q){
  const photo = q.tag ? `<span class="chip photo">${esc(q.tag)}</span>` : "";
  const img = q.img ? `<div class="qimg"><img loading="lazy" src="${q.img}" alt="문항 ${esc(q.id)} 사진"></div>` : "";
  const opts = q.opts.map((t,i)=>`
    <button class="opt" data-q="${q.n}" data-i="${i}">
      <span class="key">${KEYS[i]}</span><span class="txt">${esc(t)}</span>
    </button>`).join("");
  return `
  <article class="card" id="q-${q.n}" data-q="${q.n}">
    <div class="meta">
      <span class="badge">${esc(q.id)}</span>
      <span class="chip sec">${esc(SECSHORT[q.sec])}</span>
      ${photo}
      <span class="src">${esc(q.src)}</span>
    </div>
    ${img}
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    <div class="qfoot">
      <button class="exp-toggle" data-exp="${q.n}">정답·해설 보기</button>
      <span class="result-tag" id="rt-${q.n}"></span>
    </div>
    <div class="exp" id="exp-${q.n}">
      <div class="row"><span class="lab cue">단서</span><span class="body">${esc(q.hint)}</span></div>
      <div class="row"><span class="lab judge">정답 ${KEYS[q.ans]}. ${esc(q.opts[q.ans])}</span><span class="body">${esc(q.why)}</span></div>
      <div class="row"><span class="lab mem">암기</span><span class="body">${esc(q.mem)}</span></div>
    </div>
  </article>`;
}

function render(){
  const list = visibleList();
  const root = document.getElementById("list");
  if(list.length===0){
    root.innerHTML = `<div class="empty"><b>표시할 문제가 없어요</b>${state.view==="wrong"?"틀린 문제가 아직 없습니다. 풀다 보면 여기 모입니다.":"이 섹션에 문제가 없습니다."}</div>`;
    renderStats(); return;
  }
  root.innerHTML = list.map(cardHTML).join("");
  // restore answered states
  for(const q of list){
    if(state.answered[q.n]!==undefined){
      applyAnswerUI(q.n, state.answered[q.n], false);
    }
  }
  renderStats();
}

function applyAnswerUI(n, chosen, openExp){
  const q = DATA[n];
  const card = document.getElementById("q-"+n);
  if(!card) return;
  const btns = card.querySelectorAll(".opt");
  btns.forEach((b,i)=>{
    b.setAttribute("disabled","");
    b.classList.remove("correct","wrong","muted");
    if(i===q.ans) b.classList.add("correct");
    else if(i===chosen) b.classList.add("wrong");
    else b.classList.add("muted");
  });
  const rt = document.getElementById("rt-"+n);
  if(chosen===q.ans){ rt.textContent="정답"; rt.className="result-tag ok"; }
  else { rt.textContent="오답 · 정답 "+KEYS[q.ans]; rt.className="result-tag no"; }
  if(openExp){
    document.getElementById("exp-"+n).classList.add("show");
  }
}

document.addEventListener("click", (e)=>{
  const opt = e.target.closest(".opt");
  if(opt && !opt.hasAttribute("disabled")){
    const n = +opt.dataset.q, i = +opt.dataset.i;
    state.answered[n] = i;
    state.correct[n] = (i===DATA[n].ans);
    applyAnswerUI(n, i, false);
    renderStats();
    return;
  }
  const ex = e.target.closest(".exp-toggle");
  if(ex){
    const n = ex.dataset.exp;
    const el = document.getElementById("exp-"+n);
    el.classList.toggle("show");
    ex.textContent = el.classList.contains("show") ? "해설 접기" : "정답·해설 보기";
    return;
  }
  const seg = e.target.closest(".segbtn");
  if(seg){
    document.querySelectorAll(".segbtn").forEach(b=>b.setAttribute("aria-pressed","false"));
    seg.setAttribute("aria-pressed","true");
    state.view = seg.dataset.view;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
});

document.getElementById("btn-wrong").addEventListener("click",()=>{
  document.querySelectorAll(".segbtn").forEach(b=>b.setAttribute("aria-pressed","false"));
  const wb = document.querySelector('.segbtn[data-view="wrong"]');
  wb.setAttribute("aria-pressed","true");
  state.view="wrong"; render(); window.scrollTo({top:0,behavior:"smooth"});
});

document.getElementById("btn-clearmark").addEventListener("click",()=>{
  // clear only the wrong markings (keep correct ones), reset wrong answers so they can retry
  for(const n in state.correct){
    if(!state.correct[n]){ delete state.answered[n]; delete state.correct[n]; }
  }
  render();
});

document.getElementById("btn-reset").addEventListener("click",()=>{
  if(confirm("풀이 기록을 전체 삭제할까요? 모든 채점 결과가 사라집니다.")){
    state.answered={}; state.correct={};
    render(); window.scrollTo({top:0,behavior:"smooth"});
  }
});

render();
</script>
</body>
</html>
